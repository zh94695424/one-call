# Redocly lint/bundle configuration for the ONECALL v1 contract.
#
# The shared rules below are count-free. Exact slice operation sets and the
# 7/7/0/0/0=14, 11/21/0/0/0=32 and 18/21/6/3/1=49 assertions are performed by
# check-doc-map.mjs --stage s1|s2|s3 so an incomplete slice never fails merely
# because the final cumulative count is not present yet.

extends:
  - recommended

plugins:
  - ./contract-rules.mjs

rules:
  # Proprietary license is name-only on purpose: A1 must not invent a license
  # URL or SPDX identifier. This recommended style rule is not a contract rule.
  info-license-strict: off
  # The foundation intentionally defines all six accepted trust schemes even
  # when a slice does not yet use every scheme.
  no-unused-components: off
  operation-operationId: error
  operation-operationId-unique: error
  operation-summary: error
  operation-4xx-response: error
  operation-2xx-response: error
  security-defined: error
  no-unresolved-refs: error
  no-invalid-media-type-examples: error
  no-path-trailing-slash: error
  no-ambiguous-paths: error
  no-identical-paths: error
  path-parameters-defined: error

  onecall/operation-metadata: error
  onecall/security-by-surface: error
  onecall/problem-complete: error
  onecall/cursor-listings: error
  onecall/idempotency-writes: error
  onecall/sensitive-fields: error
  onecall/server-relative: error
  onecall/versioned-paths: error
  onecall/tagged: error
  onecall/no-unbounded-list: error
  onecall/secret-direction: error
  onecall/ivr-decision-status: error
  onecall/share-semantics: error
  onecall/draft-candidates: error
