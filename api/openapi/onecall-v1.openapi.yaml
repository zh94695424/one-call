  /api/v1/ivr/calls/{callId}/recordings/{recordingId}/complete:
    post:
      tags: [ivr]
      operationId: completeIvrRecording
      summary: Complete one recording upload under server-observed media facts.
      description: |
        Notifies the platform that the declared upload finished and triggers
        server-side object/media validation. The client does not supply hash,
        version or bucket facts; only the recording identity and current status
        are authoritative inputs. `DECLARED` recordings that have not yet been
        observed by the evidence or media adapter return
        `UPLOAD_OBSERVATION_REQUIRED`. An expired `upload_expires_at` is
        `UPLOAD_EXPIRED` with no extension. A different object/version/hash
        identity is `RECORDING_IDENTITY_CONFLICT` and first server facts are
        never overwritten. When object or media storage is unknown the service
        fails closed with `STORAGE_UNKNOWN` (503) and never fabricates media
        facts. Success is `VALIDATED` or `QUARANTINED` with server-recomputed
        duration/hash. Same identity with the same observed facts returns the
        first completion. `complete` does not create or solidify an evidence
        record; evidence solidification remains a later owner flow outside this
        transaction. Object keys, versions, buckets, raw bytes and audio URLs
        are never returned.
      security:
        - ivrMtls: []
          ivrSignature: []
      x-onecall-surface: ivr
      x-onecall-audience: ivr-service
      x-onecall-authorization: ivrMtls + ivrSignature; known parent call and recording; server-observed object/media facts only; evidence solidification is out of scope
      x-onecall-a0-models:
        - evidence.recording
        - evidence.media_object
        - evidence.evidence_record
        - evidence.evidence_event
        - ivr.call_record
      x-onecall-a0-contracts:
        - T-S3-01
        - T-S3-02
        - '§9.27'
        - '§9.28'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - IVR_ARGUMENT_INVALID
        - CALL_UNKNOWN
        - UPLOAD_OBSERVATION_REQUIRED
        - RECORDING_IDENTITY_CONFLICT
        - UPLOAD_EXPIRED
        - STORAGE_UNKNOWN
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      parameters:
        - name: callId
          in: path
          required: true
          description: Stable parent IVR call identity.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: recordingId
          in: path
          required: true
          description: Stable recording identity declared earlier for this call.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/IvrTimestampParam'
        - $ref: '#/components/parameters/IvrNonceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingCompletionRequest'
      responses:
        '200':
          description: Server-validated or quarantined recording completion; same identity and facts replay the first outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCompletion'
        '400':
          $ref: '#/components/responses/IvRArgumentInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CallUnknown'
        '409':
          $ref: '#/components/responses/RecordingConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Storage or media outcome is unknown (`STORAGE_UNKNOWN`) or another dependency is unavailable (`SERVICE_UNAVAILABLE`); the service fails closed and never fabricates media facts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/public/shares/{capabilityToken}:
    get:
      tags: [public-share]
      operationId: getPublicShare
      summary: Read public share page safety metadata without consuming admission.
      description: |
        Displays the safety metadata for one capability token. Page open and
        prefetch never consume admission and never write `PAGE_OPENED`,
        `PREFETCH_IGNORED` or any `share_access_event` (observation-free). An
        invalid, missing or retired token is the unified `SHARE_TOKEN_INVALID`
        (404) without existence disclosure. A valid token whose grant is
        REVOKED or EXPIRED is `SHARE_REVOKED`/`SHARE_EXPIRED` (410). For
        `ORGANIZATION_MEMBER` shares, a missing or non-matching
        `customerSession` returns only `verificationMode`, `status`,
        `expiresAt`, `downloadAllowed` and
        `verificationChallenge{customerSessionRequired:true}` and omits
        `content`; content is projected only after the authenticated
        account/organization/membership matches the grant tenant. `NONE`,
        `EXTRACTION_CODE` and `DESIGNATED_MOBILE` page behavior is unchanged.
        shareId, evidenceId, subjectId, object keys/URLs, token/hash and
        unshared content are never returned.
      security:
        - {}
        - customerSession: []
      x-onecall-surface: public-share
      x-onecall-audience: public-capability
      x-onecall-authorization: capability token digest only; observation-free GET; ORGANIZATION_MEMBER content projected only after matching authenticated tenant; no share_access_event write
      x-onecall-a0-models:
        - sharing.evidence_share_grant
        - evidence.evidence_record
      x-onecall-a0-contracts:
        - T-S3-04
        - SHARE_ACCESS
        - '§7.4'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - SHARE_TOKEN_INVALID
        - SHARE_REVOKED
        - SHARE_EXPIRED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: not-applicable
      parameters:
        - name: capabilityToken
          in: path
          required: true
          description: Opaque public capability token; only the server-side digest is stored and compared.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          description: Share page safety metadata; content is present only when the mode and optional matching member session allow it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShareView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShareTokenInvalid'
        '410':
          $ref: '#/components/responses/ShareGone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/public/shares/{capabilityToken}/admissions:
    post:
      tags: [public-share]
      operationId: createPublicShareAdmission
      summary: Admit one share access attempt and issue a short-lived media credential.
      description: |
        Performs the explicit admission for one capability token: verifies the
        mode-specific proof, atomically counts exactly once and, after a
        committed admission, issues the short-lived media authorization. The
        body carries `admissionRequestId` (1-128) and the discriminated
        `verification` union. Only `ORGANIZATION_MEMBER` requires an
        authenticated `customerSession`; `EXTRACTION_CODE` uses a `writeOnly`
        code that is never echoed. Failed verification is
        `SHARE_VERIFICATION_FAILED` and consumes no admission; OPEN subject
        risk is `SHARE_RISK_BLOCKED`; a mismatched member tenant is
        `SHARE_WRONG_TENANT`; a LOCKED grant blocks only new admissions with
        `SHARE_LOCKED`; reaching `maxAdmissions` is
        `SHARE_ADMISSION_LIMIT_REACHED`; an ended session window is
        `SHARE_SESSION_EXPIRED` (410). When the ticket or session policy is
        unavailable after the admission is committed, the service fails closed
        with `SHARE_SESSION_POLICY_UNAVAILABLE` or `DEPENDENCY_UNAVAILABLE`
        (503) without recounting or re-rolling; the same `admissionRequestId`
        reissues the ticket and never recounts. `NONE` results are
        `NOT_REQUIRED` and do not record a verified identity. Codes, tokens,
        hashes, phones, OTPs, object keys and unshared evidence are never
        returned.
      security:
        - {}
        - customerSession: []
      x-onecall-surface: public-share
      x-onecall-audience: public-capability
      x-onecall-authorization: capability token + mode verification; atomic single count; ORGANIZATION_MEMBER requires matching customerSession; ticket failure after commit fails closed without recount
      x-onecall-a0-models:
        - sharing.share_admission
        - sharing.share_access_event
        - sharing.evidence_share_grant
        - subject_number.subject_risk_state
      x-onecall-a0-contracts:
        - T-S3-04
        - SHARE_ACCESS
        - '§7.4'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - SHARE_VERIFICATION_FAILED
        - SHARE_RISK_BLOCKED
        - SHARE_WRONG_TENANT
        - SHARE_TOKEN_INVALID
        - SHARE_REVOKED
        - SHARE_EXPIRED
        - SHARE_LOCKED
        - SHARE_ADMISSION_LIMIT_REACHED
        - SHARE_GENERATION_STALE
        - SHARE_SESSION_EXPIRED
        - SHARE_SESSION_POLICY_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      x-onecall-replay-order: verification-and-risk-before-count
      parameters:
        - name: capabilityToken
          in: path
          required: true
          description: Opaque public capability token; only the server-side digest is stored and compared.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAdmissionRequest'
      responses:
        '201':
          description: First admitted session with a short-lived media authorization; the same admissionRequestId replays the ticket without recounting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareAdmission'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ShareAccessDenied'
        '404':
          $ref: '#/components/responses/ShareTokenInvalid'
        '409':
          $ref: '#/components/responses/ShareAccessDenied'
        '410':
          $ref: '#/components/responses/ShareGone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Ticket/session policy (`SHARE_SESSION_POLICY_UNAVAILABLE`) or another dependency (`DEPENDENCY_UNAVAILABLE`) failed after a committed admission; fail closed without recounting or re-rolling; same admissionRequestId reissues the ticket.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/public/shares/{capabilityToken}/admissions/{admissionId}/media-authorizations:
    post:
      tags: [public-share]
      operationId: authorizePublicShareMedia
      summary: Issue or rebuild a short-lived media credential for an admitted session.
      description: |
        Issues or rebuilds short-lived playback, seek or renew media
        credentials for one already-admitted session under the media gateway
        trust boundary. The body carries `authorizationRequestId` (1-128) and a
        `purpose` of `PLAYBACK`, `SEEK` or `RENEW`. The server re-reads the
        admission witness, grant status/time/generation and risk. An `ACTIVE`
        grant or an already-admitted `LOCKED` session may authorize;
        `SHARE_LOCKED` is intentionally absent because LOCKED only blocks new
        P2 admissions. OPEN subject risk is `SHARE_RISK_BLOCKED`; a mismatched
        member tenant is `SHARE_WRONG_TENANT`; a changed revocation or code
        generation witness is `SHARE_GENERATION_STALE`; an ended session window
        is `SHARE_SESSION_EXPIRED` (410); unavailable ticket/session policy or
        dependency is a 503 fail-closed. `ORGANIZATION_MEMBER` reissue is bound
        to the already-admitted recipient witness. The returned
        `mediaAuthorization.credential` is opaque, `readOnly`, requires log
        redaction and is not a return-once secret; the credential is validated
        by the media gateway. Permanent URLs, object keys, bytes, Redis ticket
        structure and remote buffer reclamation promises are never returned.
      security:
        - {}
        - customerSession: []
      x-onecall-surface: public-share
      x-onecall-audience: public-capability
      x-onecall-authorization: capability token + admission witness; ACTIVE or already-admitted LOCKED only; deterministic access identity; media gateway validates credential
      x-onecall-a0-models:
        - sharing.share_access_event
        - sharing.share_admission
        - sharing.evidence_share_grant
        - subject_number.subject_risk_state
      x-onecall-a0-contracts:
        - T-S3-05
        - SHARE_ACCESS
        - '§7.4'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - SHARE_RISK_BLOCKED
        - SHARE_WRONG_TENANT
        - SHARE_TOKEN_INVALID
        - SHARE_REVOKED
        - SHARE_EXPIRED
        - SHARE_GENERATION_STALE
        - SHARE_SESSION_EXPIRED
        - SHARE_SESSION_POLICY_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      parameters:
        - name: capabilityToken
          in: path
          required: true
          description: Opaque public capability token; only the server-side digest is stored and compared.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: admissionId
          in: path
          required: true
          description: Already-admitted session identity for this share.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAuthorizationRequest'
      responses:
        '200':
          description: Short-lived media credential for the admitted session; same authorizationRequestId with the same purpose replays the first issued credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAuthorization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ShareAccessDenied'
        '404':
          $ref: '#/components/responses/ShareTokenInvalid'
        '409':
          $ref: '#/components/responses/ShareAccessDenied'
        '410':
          $ref: '#/components/responses/ShareGone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/callbacks/payment-events:
    post:
      tags: [provider-callback]
      operationId: receivePaymentProviderCallback
      summary: Accept one verified provider payment event under provider identity.
      description: |
        Receives one already-signed payment event, verifies provider mutual-TLS
        identity, signature, time window and nonce, normalizes the provider
        event identity in the adapter layer and advances payment/order
        state idempotently without exposing internal results. The request body
        is the approved opaque provider payload; the OpenAPI contract does not
        copy vendor fields and A1 only guarantees 2xx acknowledgement, Problem
        rejection and same-event idempotency. A same provider event identity
        with a different payload fingerprint is `PAYMENT_EVENT_CONFLICT` (409)
        and the event is quarantined without advancing the order. Signature or
        mTLS failure is `CALLBACK_SIGNATURE_INVALID` (401) and the payload is
        not processed. A temporary platform deferral is `CALLBACK_RETRY_LATER`
        (503) under the same identity with no fabricated success. Success is
        `CallbackAcknowledgement` with `accepted: true` and a `duplicate`
        flag; provider payload, transaction details, internal errors,
        customer/employee identity and entitlement issuance internals are never
        returned.
      security:
        - providerCallbackMtls: []
          providerCallbackSignature: []
      x-onecall-surface: provider-callback
      x-onecall-audience: provider
      x-onecall-authorization: providerCallbackMtls + providerCallbackSignature; adapter-normalized provider event identity; server verification; payload encrypted at rest by the adapter; no internal result disclosure
      x-onecall-a0-models:
        - catalog_order.payment_event
        - catalog_order.payment_order
        - catalog_order.customer_order
        - platform.outbox_event
      x-onecall-a0-contracts:
        - T-S2-08
        - '§9.18'
        - '§10.17'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - CALLBACK_SIGNATURE_INVALID
        - PAYMENT_EVENT_CONFLICT
        - CALLBACK_RETRY_LATER
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: provider-event
      parameters:
        - $ref: '#/components/parameters/ProviderCallbackTimestampParam'
        - $ref: '#/components/parameters/ProviderCallbackNonceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentProviderCallbackRequest'
      responses:
        '200':
          description: Accepted acknowledgement; duplicate is true when the same provider event identity and payload fingerprint were already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAcknowledgement'
        '401':
          $ref: '#/components/responses/CallbackSignatureInvalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Same provider event identity with a different payload fingerprint (`PAYMENT_EVENT_CONFLICT`); the event is quarantined and never advances the order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Temporary platform deferral (`CALLBACK_RETRY_LATER`) or dependency unavailability (`SERVICE_UNAVAILABLE`); the provider may retry under the same identity and no success is fabricated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    customerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque customer session; issuance, WeChat/OTP login, refresh and revocation remain Q1/Q19 inputs.
    employeeSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Independent employee audience session with fixed ADMIN/OPS roles; authentication source and MFA remain Q1.
    ivrMtls:
      type: mutualTLS
      description: IVR service identity via mutual TLS. Certificate issuance, pinning and rotation remain Q7/Q15.
    ivrSignature:
      type: apiKey
      in: header
      name: X-ONECALL-SIGNATURE
      description: IVR request signature used together with mTLS. Algorithm, replay window and nonce form remain Q7/Q15/Q25.
    providerCallbackMtls:
      type: mutualTLS
      description: Payment provider callback service identity via mutual TLS. Certificate mapping remains Q6/Q15.
    providerCallbackSignature:
      type: apiKey
      in: header
      name: X-ONECALL-CALLBACK-SIGNATURE
      description: Provider callback signature used together with mTLS. Vendor payload and signature algorithm remain Q6/Q15.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor bound to the stable sort and normalized filter digest. Offset cursors are not accepted.
      schema:
        $ref: '#/components/schemas/Cursor'
    LimitParam:
      name: limit
      in: query
      required: false
      description: V1 API-governance page size default and maximum; a deployment may clamp further.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable operation action identity supplied by the caller; never truncated.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Customer-order client idempotency key (1-475). The A0 PURCHASE platform key is account_id||':'||this key (1-512); truncation is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 475
    TaskIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Customer outbound-call-task client idempotency key (1-512). The A0 task identity is (created_by_account_id, idempotency_key); a same-key same-fingerprint replay returns the original task without extending its frozen TTL.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IvrTimestampParam:
      name: X-ONECALL-TIMESTAMP
      in: header
      required: true
      description: IVR request timestamp echoed for signature verification. The accepted window and clock source remain Q7/Q15 inputs and are not frozen here.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IvrNonceParam:
      name: X-ONECALL-NONCE
      in: header
      required: true
      description: IVR request nonce for replay resistance. Nonce form, storage and replay window remain Q7/Q15/Q25 inputs and are not frozen here.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProviderCallbackTimestampParam:
      name: X-ONECALL-TIMESTAMP
      in: header
      required: true
      description: Provider callback request timestamp echoed for signature verification. The accepted window remains a Q6/Q15 input.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ProviderCallbackNonceParam:
      name: X-ONECALL-NONCE
      in: header
      required: true
      description: Provider callback request nonce for replay resistance. Nonce form and replay window remain Q6/Q15 inputs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthenticated:
      description: Missing or invalid customer or employee session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated identity is not allowed for the current access, role or resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the current identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request failed schema, field, enum or length validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorInvalid:
      description: The cursor cannot be parsed, was tampered with or crosses a surface.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ActivationStateConflict:
      description: The current activation state or revision does not permit the requested OPERATIONS transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogPublicationConflict:
      description: The current catalog active version or revision does not permit the requested publication or offsale transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrialPolicyPublicationConflict:
      description: The current enabled trial policy version or revision does not permit the requested publication or disable transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogDraftConflict:
      description: The DRAFT catalog candidate natural identity, state or content projection forbids the requested create or replace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrialPolicyDraftConflict:
      description: The DRAFT trial policy candidate natural identity, state or content projection forbids the requested create or replace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The platform rate or quota rejected the request; no numeric rate, window or retry policy is frozen in this contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency, capacity or maintenance condition makes the service unavailable; no vendor or retry-after semantics are frozen in this contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: Safe generic server failure with a stable trace identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OutboundTaskConflict:
      description: An in-progress call or an incompatible non-terminal outbound task forbids the requested task create or cancel.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IvRArgumentInvalid:
      description: An IVR protocol parameter failed bound validation before any decision could be frozen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SessionIdentityMismatch:
      description: The frozen session, decision, access-number or fingerprint identity cannot be reconciled for this call.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EventIdConflict:
      description: The IVR event identity `(IVR_EVENT, eventId)` already exists with a different semantic fingerprint; the first outcome is absorbed and the event conflict is reported as `EVENT_ID_CONFLICT`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CallUnknown:
      description: The trusted IVR service referenced a parent call that does not exist; no placeholder call is created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RecordingConflict:
      description: Recording upload observation, identity or expiry forbids the requested completion; first server facts are never overwritten.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShareTokenInvalid:
      description: The capability token is missing, invalid or retired; the response does not disclose whether a share exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShareAccessDenied:
      description: Verification, risk, tenant or generation checks denied the share access request without consuming an admission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShareGone:
      description: The share grant or admitted session is revoked or expired; already-issued short-lived credentials are not recalled.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CallbackSignatureInvalid:
      description: The provider callback mutual-TLS identity or signature failed verification; the payload is not processed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem detail extended with a stable business code and trace identity.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldProblem'
    ProblemCode:
      type: string
      description: Stable machine-readable business error code; the only machine branching key.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CURSOR_INVALID
        - CURSOR_FILTER_MISMATCH
        - CLAIM_RISK_BLOCKED
        - CLAIM_REPLAY_CONFLICT
        - CLAIM_CONTEXT_CONFLICT
        - ACTIVATION_STATE_CONFLICT
        - CONSENT_REQUIRED
        - ACTIVATION_CONSENT_DECLINED
        - PURCHASE_CONSENT_REQUIRED
        - PURCHASE_CONSENT_STALE
        - PURCHASE_CONSENT_DECLINED
        - REAL_NAME_REQUIRED
        - ACTIVATION_NOT_ACTIVE
        - ORDER_UNKNOWN_PAYMENT_PENDING
        - IDEMPOTENCY_CONFLICT
        - CATALOG_DRAFT_CONFLICT
        - CATALOG_DRAFT_STALE_VIEW
        - TRIAL_POLICY_DRAFT_CONFLICT
        - TRIAL_POLICY_DRAFT_STALE_VIEW
        - CATALOG_PUBLICATION_CONFLICT
        - PUBLICATION_STALE_VIEW
        - TRIAL_POLICY_PUBLICATION_CONFLICT
        - TRIAL_POLICY_STALE_VIEW
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
        - OUTBOUND_CALL_IN_PROGRESS
        - OUTBOUND_TASK_CONFLICT
        - OUTBOUND_TASK_NOT_CANCELLABLE
        - SHARE_CREATION_CONFLICT
        - SHARE_ACCESS_POLICY_UNAVAILABLE
        - SHARE_RISK_BLOCKED
        - SHARE_TRANSITION_CONFLICT
        - SHARE_GENERATION_STALE
        - SHARE_REVOKED
        - IVR_ARGUMENT_INVALID
        - SESSION_IDENTITY_MISMATCH
        - CALL_UNKNOWN
        - EVENT_ID_CONFLICT
        - UPLOAD_OBSERVATION_REQUIRED
        - RECORDING_IDENTITY_CONFLICT
        - UPLOAD_EXPIRED
        - STORAGE_UNKNOWN
        - SHARE_TOKEN_INVALID
        - SHARE_VERIFICATION_FAILED
        - SHARE_WRONG_TENANT
        - SHARE_LOCKED
        - SHARE_ADMISSION_LIMIT_REACHED
        - SHARE_SESSION_EXPIRED
        - SHARE_EXPIRED
        - SHARE_SESSION_POLICY_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE
        - CALLBACK_SIGNATURE_INVALID
        - PAYMENT_EVENT_CONFLICT
        - CALLBACK_RETRY_LATER
    FieldProblem:
      type: object
      additionalProperties: false
      description: Field-level validation problem; pointers identify the request location without echoing values.
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 512
    Cursor:
      type: string
      description: Opaque server-issued cursor; never an offset, SQL key or raw ID.
      minLength: 1
      maxLength: 512
    PageInfo:
      type: object
      additionalProperties: false
      description: Shared page-boundary convention; every *Page schema exposes these two fields together with items.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    CustomerAccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [workspaceType, status]
      properties:
        workspaceType:
          type: string
          enum: [PERSONAL, ORGANIZATION]
        organizationId:
          type: string
          format: uuid
        organizationDisplayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum: [ADMINISTRATOR, MEMBER, EVIDENCE_MANAGER, AUDITOR]
        status:
          type: string
          enum: [ACTIVE]
    CustomerContext:
      type: object
      additionalProperties: false
      required: [account, workspaces, channel]
      properties:
        account:
          $ref: '#/components/schemas/CustomerAccountSummary'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
        channel:
          type: string
          enum: [MINIAPP, WEB]
    BusinessNumber:
      type: object
      additionalProperties: false
      required: [bindingId, subjectId, numberMasked, numberType, bindingStatus, activationStatus, realNameStatus]
      properties:
        bindingId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        numberMasked:
          type: string
          minLength: 1
          maxLength: 64
        numberType:
          type: string
          enum: [MOBILE, LANDLINE]
        bindingStatus:
          type: string
          enum: [ACTIVE, DISABLED, RETIRED]
        activationStatus:
          type: string
          description: Server-derived activation projection for the bound subject; response-only and never client-writable.
          readOnly: true
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        realNameStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED]
    BusinessNumberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessNumber'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    TrialSummary:
      type: object
      additionalProperties: false
      required: [grantedSeconds, remainingSeconds, expiresAt, status]
      properties:
        grantedSeconds:
          type: integer
          minimum: 0
        remainingSeconds:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [GRANTED, EXHAUSTED, EXPIRED]
    ConsentRequirements:
      type: object
      additionalProperties: false
      description: Current policy, prompt and content identity that an explicit consent must match.
      required: [policyCode, policyVersion, promptVersion, contentSha256]
      properties:
        policyCode:
          type: string
          minLength: 1
          maxLength: 64
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        contentSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CustomerSubjectDetail:
      type: object
      additionalProperties: false
      required: [subjectId, activationStatus, evidenceCount, orderCount]
      properties:
        subjectId:
          type: string
          format: uuid
        numberMasked:
          type: string
          minLength: 1
          maxLength: 64
        activationStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        trial:
          $ref: '#/components/schemas/TrialSummary'
        consentRequirements:
          $ref: '#/components/schemas/ConsentRequirements'
        evidenceCount:
          type: integer
          minimum: 0
        orderCount:
          type: integer
          minimum: 0
    ClaimRequest:
      type: object
      additionalProperties: false
      description: Verified personal claim inputs. Account, owner, role, raw number, HMAC and verification ciphertext are server-derived and never accepted.
      required: [subjectId, bindingId, verificationMethod, verificationProofId]
      properties:
        subjectId:
          type: string
          format: uuid
        bindingId:
          type: string
          format: uuid
        verificationMethod:
          type: string
          enum: [SMS, WECHAT_PHONE, CALLER_CHALLENGE, MANUAL_REVIEW]
        verificationProofId:
          type: string
          description: Opaque server-validated verification-attempt reference; never a code, OTP, number or ciphertext.
          minLength: 1
          maxLength: 128
    ClaimResult:
      type: object
      additionalProperties: false
      required: [claimId, status, subjectId]
      properties:
        claimId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, REJECTED, CONFLICT]
        subjectId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
    ActivationRequest:
      type: object
      additionalProperties: false
      description: Explicit activation consent decision bound to the current policy, prompt and content identity.
      required: [activationEventId, decision, policyCode, policyVersion, promptVersion, contentSha256]
      properties:
        activationEventId:
          type: string
          minLength: 1
          maxLength: 128
        decision:
          type: string
          enum: [ACCEPT, DECLINE]
        policyCode:
          type: string
          minLength: 1
          maxLength: 64
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        contentSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ActivationTrial:
      type: object
      additionalProperties: false
      required: [grantedSeconds, expiresAt]
      properties:
        grantedSeconds:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    ActivationResult:
      type: object
      additionalProperties: false
      required: [activationStatus, activationRevision, transitionId, consentId, trialOutcome, trial]
      properties:
        activationStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        activationRevision:
          type: integer
          minimum: 1
        transitionId:
          type: string
          format: uuid
          description: The newly appended transition or the current latest transition anchor for an already-active replay.
        consentId:
          type: string
          format: uuid
        trialOutcome:
          type: string
          enum: [GRANTED, REPLAY, ALREADY_GRANTED]
        trial:
          $ref: '#/components/schemas/ActivationTrial'
    EvidenceArtifact:
      type: object
      additionalProperties: false
      required: [artifactRole]
      properties:
        artifactRole:
          type: string
          enum: [ORIGINAL, DERIVED]
        mimeType:
          type: string
          minLength: 1
          maxLength: 128
        sizeBytes:
          type: integer
          minimum: 0
        validatedDurationSeconds:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [evidenceId, subjectId, status, sourceType, capturedAt, consentVersion, createdAt]
      properties:
        evidenceId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SOLIDIFIED, QUARANTINED, FAILED]
        sourceType:
          type: string
          enum: [CALL_RECORDING]
        capturedAt:
          type: string
          format: date-time
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
        createdAt:
          type: string
          format: date-time
        artifactRoles:
          type: array
          items:
            type: string
            enum: [ORIGINAL, DERIVED]
    EvidencePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSummary'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    EvidenceDetail:
      type: object
      additionalProperties: false
      required: [evidenceId, subjectId, status, sourceType, capturedAt, consentVersion, artifacts]
      properties:
        evidenceId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SOLIDIFIED, QUARANTINED, FAILED]
        sourceType:
          type: string
          enum: [CALL_RECORDING]
        capturedAt:
          type: string
          format: date-time
        consentVersion:
          type: string
          minLength: 1
          maxLength: 64
        solidifiedAt:
          type: string
          format: date-time
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceArtifact'
    SubjectSummary:
      type: object
      additionalProperties: false
      required: [subjectId, source, activationStatus, realNameStatus, riskState, createdAt]
      properties:
        subjectId:
          type: string
          format: uuid
        maskedNumber:
          type: string
          minLength: 1
          maxLength: 64
        source:
          type: string
          enum: [IVR, MINIAPP, WEB, OPERATIONS]
        claimStatus:
          type: string
          enum: [ACCEPTED, REJECTED, CONFLICT]
        activationStatus:
          type: string
          description: Projected INACTIVE when no activation row exists yet.
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        realNameStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED]
        riskState:
          type: string
          description: OPEN when any binding risk state is OPEN; otherwise CLEARED.
          enum: [OPEN, CLEARED]
        createdAt:
          type: string
          format: date-time
    SubjectPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubjectSummary'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    BindingSummary:
      type: object
      additionalProperties: false
      required: [bindingId, numberMasked, numberType, bindingStatus]
      properties:
        bindingId:
          type: string
          format: uuid
        numberMasked:
          type: string
          minLength: 1
          maxLength: 64
        numberType:
          type: string
          enum: [MOBILE, LANDLINE]
        bindingStatus:
          type: string
          enum: [ACTIVE, DISABLED, RETIRED]
        verifiedAt:
          type: string
          format: date-time
    ClaimSummary:
      type: object
      additionalProperties: false
      required: [claimId, status, verificationMethod, riskCheckedAt]
      properties:
        claimId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, REJECTED, CONFLICT]
        verificationMethod:
          type: string
          enum: [SMS, WECHAT_PHONE, CALLER_CHALLENGE, MANUAL_REVIEW]
        riskCheckedAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
    ActivationState:
      type: object
      additionalProperties: false
      required: [status, revision]
      properties:
        status:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        revision:
          type: integer
          minimum: 1
    OperationsSubjectDetail:
      type: object
      additionalProperties: false
      required: [subjectId, source, realNameStatus, riskState, bindings, claims, evidenceCount, orderCount, createdAt]
      properties:
        subjectId:
          type: string
          format: uuid
        maskedNumber:
          type: string
          minLength: 1
          maxLength: 64
        source:
          type: string
          enum: [IVR, MINIAPP, WEB, OPERATIONS]
        realNameStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED]
        riskState:
          type: string
          description: OPEN when any binding risk state is OPEN; otherwise CLEARED.
          enum: [OPEN, CLEARED]
        activation:
          $ref: '#/components/schemas/ActivationState'
        trial:
          $ref: '#/components/schemas/TrialSummary'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BindingSummary'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/ClaimSummary'
        evidenceCount:
          type: integer
          minimum: 0
        orderCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ActivationTransitionRequest:
      type: object
      additionalProperties: false
      description: Fixed employee OPERATIONS transition request; the employee identity and source action domain are server-derived.
      required: [reasonCode, expectedActivationRevision]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
        expectedActivationRevision:
          type: integer
          minimum: 1
    ActivationTransition:
      type: object
      additionalProperties: false
      required: [transitionId, statusEventId, fromStatus, toStatus, fromRevision, toRevision, sourceChannel, sourceActionDomain, reasonCode, occurredAt]
      properties:
        transitionId:
          type: string
          format: uuid
        statusEventId:
          type: string
          minLength: 1
          maxLength: 128
        fromStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        toStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        fromRevision:
          type: integer
          minimum: 0
        toRevision:
          type: integer
          minimum: 1
        sourceChannel:
          type: string
          enum: [IVR, MINIAPP, WEB, OPERATIONS]
        sourceActionDomain:
          type: string
          enum: [ACTIVATION, IVR_CONFIRM, OPERATIONS]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
    ActivationSummary:
      type: object
      additionalProperties: false
      required: [transitionId, subjectId, statusEventId, fromStatus, toStatus, fromRevision, toRevision, sourceChannel, sourceActionDomain, reasonCode, occurredAt]
      properties:
        transitionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        statusEventId:
          type: string
          minLength: 1
          maxLength: 128
        fromStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        toStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        fromRevision:
          type: integer
          minimum: 0
        toRevision:
          type: integer
          minimum: 1
        sourceChannel:
          type: string
          enum: [IVR, MINIAPP, WEB, OPERATIONS]
        sourceActionDomain:
          type: string
          enum: [ACTIVATION, IVR_CONFIRM, OPERATIONS]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
    ActivationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivationSummary'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    IvrSessionSummary:
      type: object
      additionalProperties: false
      description: Safe IVR session metadata; no caller/callee full number, payload or playback credential.
      required: [sessionId, callId, status, nodeId, protocolVersion, promptVersion, accessNumberMasked, createdAt]
      properties:
        sessionId:
          type: string
          format: uuid
        callId:
          type: string
          minLength: 1
          maxLength: 128
        subjectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [RECEIVED, CONFIRMED, ABANDONED, REJECTED]
        nodeId:
          type: string
          minLength: 1
          maxLength: 64
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 32
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        guidanceStatus:
          type: string
          enum: [ACTIVATION_REQUIRED, CONSENT_REQUIRED]
        callerMasked:
          type: string
          minLength: 1
          maxLength: 64
        accessNumberMasked:
          type: string
          minLength: 1
          maxLength: 64
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
    IvrSessionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IvrSessionSummary'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    IvrDecisionSummary:
      type: object
      additionalProperties: false
      description: Redacted frozen decision metadata; full callee numbers and encrypted response payloads are excluded.
      required: [decisionId, purpose, action, reasonCode, decidedAt]
      properties:
        decisionId:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [INBOUND_RESOLVE, ACTIVATION_NEXT_ACTION, DIRECT_AUTHORIZATION]
        action:
          type:
            - string
            - 'null'
          enum:
            - GUIDE_ACTIVATION
            - DIAL_TASK_CALLEE
            - ENTER_CALLEE
            - GUIDE_PURCHASE
            - REJECT
            - REJECT_SUSPENDED
            - REJECT_CALL_IN_PROGRESS
            - null
        reasonCode:
          type: string
          enum:
            - ACTIVATION_REQUIRED
            - CONSENT_REQUIRED
            - CALLER_UNTRUSTED
            - SESSION_IDENTITY_MISMATCH
            - CALL_IN_PROGRESS
            - CONFIRMATION_NOT_ALLOWED
            - ACTIVATION_SUSPENDED
            - CALLER_BINDING_REVOKED
            - WORKSPACE_ACCESS_REVOKED
            - TASK_ACCESS_REVOKED
            - ORGANIZATION_INACTIVE
            - ACCOUNT_DISABLED
            - CALL_STATE_UNRESOLVED
            - TASK_CONFLICT
            - TASK_CLAIMED
            - NO_AVAILABLE_ENTITLEMENT
            - NO_VALID_TASK
            - TASK_EXPIRED
            - TASK_UNAVAILABLE
            - DIRECT_AUTHORIZED
            - DATA_INTEGRITY
        reservationId:
