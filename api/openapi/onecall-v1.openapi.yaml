        decisionId:
          type: string
          format: uuid
        callId:
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          type: string
          enum: [INBOUND_RESOLVE, ACTIVATION_NEXT_ACTION, DIRECT_AUTHORIZATION]
        action:
          type:
            - string
            - 'null'
          enum:
            - GUIDE_ACTIVATION
            - DIAL_TASK_CALLEE
            - ENTER_CALLEE
            - GUIDE_PURCHASE
            - REJECT
            - REJECT_SUSPENDED
            - REJECT_CALL_IN_PROGRESS
            - null
        callerState:
          type: string
          enum: [UNREGISTERED, INACTIVE, ACTIVE, SUSPENDED]
        taskMatch:
          type: string
          enum: [CLAIMED, NONE, EXPIRED, REJECTED, CONFLICT]
        reasonCode:
          type: string
          enum:
            - ACTIVATION_REQUIRED
            - CONSENT_REQUIRED
            - CALLER_UNTRUSTED
            - SESSION_IDENTITY_MISMATCH
            - CALL_IN_PROGRESS
            - CONFIRMATION_NOT_ALLOWED
            - ACTIVATION_SUSPENDED
            - CALLER_BINDING_REVOKED
            - WORKSPACE_ACCESS_REVOKED
            - TASK_ACCESS_REVOKED
            - ORGANIZATION_INACTIVE
            - ACCOUNT_DISABLED
            - CALL_STATE_UNRESOLVED
            - TASK_CONFLICT
            - TASK_CLAIMED
            - NO_AVAILABLE_ENTITLEMENT
            - NO_VALID_TASK
            - TASK_EXPIRED
            - TASK_UNAVAILABLE
            - DIRECT_AUTHORIZED
            - DATA_INTEGRITY
        availableRecordingSeconds:
          type: integer
          minimum: 0
        balanceAsOf:
          type: string
          format: date-time
        task:
          type:
            - object
            - 'null'
          additionalProperties: false
          required: [taskId, businessType, calleeMasked]
          properties:
            taskId:
              type: string
              minLength: 1
              maxLength: 64
            businessType:
              type: string
              minLength: 1
              maxLength: 64
            calleeMasked:
              type: string
              minLength: 1
              maxLength: 64
            calleeNumber:
              type: string
              minLength: 1
              maxLength: 64
              readOnly: true
              x-onecall-internal-payload: true
              x-onecall-log-redaction: required
        authorization:
          type: object
          additionalProperties: false
          description: Direct-authorization internal payload present only on encrypted direct success; excluded from redacted snapshots.
          properties:
            calleeNumber:
              type: string
              minLength: 1
              maxLength: 64
              readOnly: true
              x-onecall-internal-payload: true
              x-onecall-log-redaction: required
        reservationId:
          type:
            - string
            - 'null'
          format: uuid
        authorizedRecordingSeconds:
          type:
            - integer
            - 'null'
          minimum: 1
        authorizationExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
        decisionAt:
          type: string
          format: date-time
