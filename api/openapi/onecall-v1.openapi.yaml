    post:
      tags: [operations]
      operationId: publishOperationsCatalogVersion
      summary: Publish a DRAFT catalog version and retire the previous ACTIVE.
      description: |
        Publishes one never-published DRAFT catalog version under the owner
        publication serialization. The caller supplies the expected current
        active version (nullable) and expected revision. A stale expectation
        returns `CATALOG_PUBLICATION_CONFLICT`/`PUBLICATION_STALE_VIEW` with no
        change; the loser rereads current state and does not select another
        version. On success the previous ACTIVE version is retired to OFFSALE
        first, then the candidate becomes ACTIVE. Published content and
        benefit lines are never rewritten and no independent offer withdrawal
        is provided. State-conditional only; no Idempotency-Key.
      security:
        - employeeSession: []
      x-onecall-surface: operations
      x-onecall-audience: employee
      x-onecall-authorization: employeeSession.role == ADMIN; owner publication lock; expected active version/revision re-read; no independent offer withdrawal
      x-onecall-a0-models:
        - catalog_order.catalog_version
        - audit.audit_fact
        - platform.outbox_event
