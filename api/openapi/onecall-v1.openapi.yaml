openapi: 3.1.0
info:
  title: ONECALL production API surfaces (v1)
  version: 1.0.0
  license:
    name: Proprietary
  contact:
    name: ONECALL API governance
  description: |
    Canonical OpenAPI 3.1 contract for the five approved ONECALL first-release
    trust surfaces. This document is a static contract only: it defines no
    running service, database, authentication provider, payment initiation,
    IVR runtime, object storage or Redis behavior. All operation paths are
    fully versioned under /api/v1; the single top-level server is the relative
    deployment root `/`.
servers:
  - url: /
    description: Deployment root only. Every path below carries its own /api/v1 prefix.
tags:
  - name: customer
    description: Authenticated customer identity, business numbers, claims, activation and evidence metadata.
    x-onecall-surface: customer
  - name: operations
    description: Fixed ADMIN/OPS employee read and activation-control surface; metadata access never grants recording playback.
    x-onecall-surface: operations
  - name: ivr
    description: Self-built IVR service actions and event envelopes (later slices).
    x-onecall-surface: ivr
  - name: public-share
    description: Public recording-share capability surface (later slices).
    x-onecall-surface: public-share
  - name: provider-callback
    description: Authenticated payment-provider callback surface (later slice).
    x-onecall-surface: provider-callback
x-onecall-contract:
  contractVersion: 1.0.0
  surfaces:
    - customer
    - operations
    - ivr
    - public-share
    - provider-callback
  a0Baseline: docs/14-production-data-model-and-flyway-schema-spec.md
  problemRegistry: x-onecall-problem-registry
  runtime: not-implemented
  notes: S2 freezes the cumulative 32 customer and operations operations (S1 14 + S2 18); ivr, public-share and provider-callback remain base-only.
x-onecall-problem-registry:
  UNAUTHENTICATED:
    httpStatus: 401
    a0Origin: session boundary (Q1/Q19); no user-existence disclosure
    surfaces: [customer, operations, ivr, public-share, provider-callback]
  FORBIDDEN:
    httpStatus: 403
    a0Origin: server-derived authorization predicate
    surfaces: [customer, operations, ivr, public-share, provider-callback]
  NOT_FOUND:
    httpStatus: 404
    a0Origin: current visibility predicate; no substitute object
    surfaces: [customer, operations, public-share]
  VALIDATION_FAILED:
    httpStatus: 422
    a0Origin: request schema, field and enum validation
    surfaces: [customer, operations, ivr, provider-callback]
  CURSOR_INVALID:
    httpStatus: 400
    a0Origin: cursor contract; opaque cursor cannot be parsed, is tampered or crosses surfaces
    surfaces: [customer, operations]
  CURSOR_FILTER_MISMATCH:
    httpStatus: 400
    a0Origin: cursor contract; normalized filter digest changed
    surfaces: [customer, operations]
  CLAIM_RISK_BLOCKED:
    httpStatus: 409
    a0Origin: subject_number.subject_risk_state OPEN risk; T-S1-06 risk precedes replay
    surfaces: [customer]
  CLAIM_REPLAY_CONFLICT:
    httpStatus: 409
    a0Origin: subject_number.subject_claim request_id replay identity mismatch; T-S1-06
    surfaces: [customer]
  CLAIM_CONTEXT_CONFLICT:
    httpStatus: 409
    a0Origin: subject_number.subject_claim same-account duplicate context mismatch; T-S1-06
    surfaces: [customer]
  ACTIVATION_STATE_CONFLICT:
    httpStatus: 409
    a0Origin: activation_consent.service_activation transition/revision mismatch; T-S2-09
    surfaces: [operations]
  CONSENT_REQUIRED:
    httpStatus: 409
    a0Origin: activation_consent.consent_record current prompt/policy missing, stale or invalid; T-S2-13
    surfaces: [customer]
  ACTIVATION_CONSENT_DECLINED:
    httpStatus: 409
    a0Origin: activation_consent.consent_record explicit DECLINE committed typed refusal; no accepted consent/activation/trial; same-event replay returns the same refusal; T-S2-13
    surfaces: [customer]
  PURCHASE_CONSENT_REQUIRED:
    httpStatus: 409
    a0Origin: activation_consent.consent_record missing or invalid current PURCHASE consent; no accepted purchase consent or order; T-S2-07
    surfaces: [customer]
  PURCHASE_CONSENT_STALE:
    httpStatus: 409
    a0Origin: activation_consent.consent_record current PURCHASE prompt/policy expired or content mismatch; T-S2-07
    surfaces: [customer]
  PURCHASE_CONSENT_DECLINED:
    httpStatus: 409
    a0Origin: activation_consent.consent_record explicit PURCHASE DECLINE; no accepted purchase consent or order; T-S2-07
    surfaces: [customer]
  REAL_NAME_REQUIRED:
    httpStatus: 422
    a0Origin: customer_iam.identity_profile ordinary-client real-name prerequisite before order creation; T-S2-07
    surfaces: [customer]
  ACTIVATION_NOT_ACTIVE:
    httpStatus: 403
    a0Origin: activation_consent.service_activation.status is not ACTIVE for the purchasing subject; T-S2-07
    surfaces: [customer]
  ORDER_UNKNOWN_PAYMENT_PENDING:
    httpStatus: 409
    a0Origin: catalog_order.customer_order same subject/offer has an UNKNOWN payment order that must be queried first; §7.3
    surfaces: [customer]
  IDEMPOTENCY_CONFLICT:
    httpStatus: 409
    a0Origin: platform.idempotency_record PURCHASE scope same key with changed purchase semantic fingerprint; T-S2-07
    surfaces: [customer]
  CATALOG_DRAFT_CONFLICT:
    httpStatus: 409
    a0Origin: catalog_order.catalog_version (product_id, version_no) natural-key collision, non-DRAFT state, changed content projection or immutable-constraint rejection
    surfaces: [operations]
  CATALOG_DRAFT_STALE_VIEW:
    httpStatus: 409
    a0Origin: catalog_order.catalog_version replace expectedRevision mismatch without proof the update was applied; conditional revision
    surfaces: [operations]
  TRIAL_POLICY_DRAFT_CONFLICT:
    httpStatus: 409
    a0Origin: entitlement_metering.trial_policy_version (campaign_key, version_no) natural-key collision, non never-published state or changed content projection
    surfaces: [operations]
  TRIAL_POLICY_DRAFT_STALE_VIEW:
    httpStatus: 409
    a0Origin: entitlement_metering.trial_policy_version replace expectedRevision mismatch without proof the update was applied; conditional revision
    surfaces: [operations]
  CATALOG_PUBLICATION_CONFLICT:
    httpStatus: 409
    a0Origin: catalog_order.catalog_version concurrent or unexpected current active version under the owner publication lock; T-S2-14
    surfaces: [operations]
  PUBLICATION_STALE_VIEW:
    httpStatus: 409
    a0Origin: catalog_order.catalog_version expected active version/revision no longer matches; loser rereads current state and does not retry; T-S2-14
    surfaces: [operations]
  TRIAL_POLICY_PUBLICATION_CONFLICT:
    httpStatus: 409
    a0Origin: entitlement_metering.trial_policy_version concurrent or unexpected enabled published version; T-S2-14
    surfaces: [operations]
  TRIAL_POLICY_STALE_VIEW:
    httpStatus: 409
    a0Origin: entitlement_metering.trial_policy_version expected enabled version/revision no longer matches; T-S2-14
    surfaces: [operations]
  RATE_LIMITED:
    httpStatus: 429
    a0Origin: platform rate or quota rejection; no numeric rate, window or retry policy is frozen in S1
    surfaces: [customer, operations, ivr, public-share, provider-callback]
  SERVICE_UNAVAILABLE:
    httpStatus: 503
    a0Origin: dependency, capacity or maintenance unavailability; no vendor or retry-after semantics are frozen in S1
    surfaces: [customer, operations, ivr, public-share, provider-callback]
  INTERNAL:
    httpStatus: 500
    a0Origin: server failure; safe generic message only
    surfaces: [customer, operations, ivr, public-share, provider-callback]
paths:
  /api/v1/customer/me:
    get:
      tags: [customer]
      operationId: getCustomerMe
      summary: Read the current customer context.
      description: |
        Resolves the current customer account and usable workspaces from the
        authenticated customer session. The client supplies no account,
        organization, workspace or role claim. Only ACTIVE accounts and ACTIVE
        memberships under ACTIVE organizations are projected. No provider
        subject, HMAC, identity document or full number is returned.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession -> ACTIVE customer_account; workspaces re-read from ACTIVE memberships under ACTIVE organizations; client-supplied account, workspace and role are ignored
      x-onecall-a0-models:
        - customer_iam.customer_account
        - organization_access.organization
        - organization_access.organization_membership
      x-onecall-a0-contracts:
        - T-S1-04
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: not-applicable
      responses:
        '200':
          description: Current customer context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/business-numbers:
    get:
      tags: [customer]
      operationId: listCustomerBusinessNumbers
      summary: List accessible business numbers.
      description: |
        Lists masked business numbers and their binding, subject, activation and
        real-name projections for the current session and server-derived
        workspace scope. Only bindings the current account may access are
        returned. The stable order is `subject.createdAt desc, bindingId asc`.
        Full numbers, HMAC values, ciphertext and ownership inferences are never
        returned.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession + server workspace scope; only currently accessible bindings are projected
      x-onecall-a0-models:
        - subject_number.business_subject
        - subject_number.caller_number_binding
        - activation_consent.service_activation
      x-onecall-a0-contracts:
        - '§7.1'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - CURSOR_INVALID
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: not-applicable
      x-onecall-sort: 'subject.createdAt desc, bindingId asc'
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Accessible business numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessNumberPage'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/subjects/{subjectId}:
    get:
      tags: [customer]
      operationId: getCustomerSubject
      summary: Read an accessible subject summary.
      description: |
        Returns the current activation status, trial summary, current consent
        requirements, claim state and evidence/order counts for a subject the
        current account may access. Activation, claim, risk and trial facts are
        re-read server-side. Risk internals, evidence bytes, full numbers and
        other subjects are never returned.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession -> server subject owner/claim/risk/workspace access; current policy and prompt are server-derived
      x-onecall-a0-models:
        - subject_number.business_subject
        - activation_consent.service_activation
        - activation_consent.consent_record
        - entitlement_metering.trial_grant
        - entitlement_metering.entitlement_balance
        - subject_number.subject_claim
      x-onecall-a0-contracts:
        - '§7.1'
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: not-applicable
      parameters:
        - name: subjectId
          in: path
          required: true
          description: Stable business subject identity.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Accessible subject summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSubjectDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/subject-claims:
    post:
      tags: [customer]
      operationId: createCustomerSubjectClaim
      summary: Append a verified personal subject claim.
      description: |
        Appends one verified personal claim for the authenticated account. The
        `Idempotency-Key` header is the A0 `subject_claim.request_id` (1-128).
        Open risk state is evaluated before replay, so a historically accepted
        claim is never disclosed as a successful replay while current risk is
        OPEN. A replay with changed subject, binding, method or verification
        proof is a conflict; a same-account duplicate with changed context is a
        context conflict. Enterprise ownership is out of S1 scope. The request
        never carries account, owner, role, raw number, HMAC, ciphertext or
        verification proof content.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession -> ACTIVE account; binding/subject/risk/owner predicates re-read under locks; accepted owner is set only from null
      x-onecall-a0-models:
        - subject_number.subject_claim
        - subject_number.business_subject
        - subject_number.caller_number_binding
        - subject_number.subject_risk_state
      x-onecall-a0-contracts:
        - T-S1-06
        - '§7.1'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - CLAIM_RISK_BLOCKED
        - CLAIM_REPLAY_CONFLICT
        - CLAIM_CONTEXT_CONFLICT
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: idempotency-key
      x-onecall-replay-order: risk-before-replay
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Accepted or first stored claim outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Risk-blocked, replay-conflict or context-conflict claim outcome.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/subjects/{subjectId}/activations:
    post:
      tags: [customer]
      operationId: createCustomerSubjectActivation
      summary: Record explicit activation consent and freeze the activation/trial result.
      description: |
        Records one explicit ACCEPT or DECLINE decision for the current subject
        activation policy and prompt. An ACCEPT freezes the activation and
        first-trial result. The body `activationEventId` (1-128) is the stable
        idempotency identity; the same event and semantic fingerprint returns
        the first frozen result and never reissues a trial. A DECLINE is a
        committed typed refusal carried by `409 ACTIVATION_CONSENT_DECLINED`:
        it appends the refusal, creates no accepted consent, activation or
        trial, and replaying the same `activationEventId` returns the same
        refusal. The `200 ActivationResult` schema is ACCEPT-only success and
        there is no DECLINE 200 schema. Missing, stale or invalid policy,
        prompt or content is refused with `409 CONSENT_REQUIRED`. The client
        cannot supply account, workspace, role, subject ownership, policy
        outcome or trial outcome.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession -> current subject access and ACTIVE account/workspace; current policy/prompt/content re-read; accepted consent is the only activation source
      x-onecall-a0-models:
        - activation_consent.consent_record
        - activation_consent.service_activation
        - activation_consent.service_activation_transition
        - entitlement_metering.trial_grant
        - entitlement_metering.entitlement_grant
        - entitlement_metering.entitlement_balance
      x-onecall-a0-contracts:
        - T-S2-13
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CONSENT_REQUIRED
        - ACTIVATION_CONSENT_DECLINED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: event-body
      parameters:
        - name: subjectId
          in: path
          required: true
          description: Stable business subject identity.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: Frozen activation and first-trial result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Current consent is required, stale or invalid (`CONSENT_REQUIRED`), or the submitted decision is an explicit DECLINE (`ACTIVATION_CONSENT_DECLINED`): a committed typed refusal with no accepted consent, activation or trial, where the same `activationEventId` replays the same refusal.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/catalog/offers:
    get:
      tags: [customer]
      operationId: listCustomerCatalogOffers
      summary: List visible in-sale catalog offers.
      description: |
        Lists ACTIVE catalog versions, channel offers, benefit lines and
        version tokens visible to the current customer channel. The stable
        order is `productCode asc, versionNo desc, catalogOfferId asc`. The
        cursor binds the normalized `channel`, `audience` and `offerType`
        filter digest and cannot be reused across filter changes. Prices and
        benefit quantities are the approved server-stored values only. Draft
        or offsale versions, unapproved prices and unauthorized channels are
        never returned.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession + server channel/audience scope; only ACTIVE catalog versions and channel offers are projected
      x-onecall-a0-models:
        - catalog_order.catalog_product
        - catalog_order.catalog_version
        - catalog_order.catalog_offer
        - catalog_order.catalog_benefit_line
      x-onecall-a0-contracts:
        - '§7.3'
        - uq_catalog_version_active
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - CURSOR_INVALID
        - CURSOR_FILTER_MISMATCH
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: not-applicable
      x-onecall-sort: 'productCode asc, versionNo desc, catalogOfferId asc'
      x-onecall-filter-digest:
        - channel
        - audience
        - offerType
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: channel
          in: query
          required: false
          description: Server-authorized sales channel filter.
          schema:
            type: string
            enum: [MINIAPP, WEB]
        - name: audience
          in: query
          required: false
          description: Catalog audience filter.
          schema:
            type: string
            enum: [PERSONAL, ENTERPRISE]
        - name: offerType
          in: query
          required: false
          description: Offer type filter.
          schema:
            type: string
            enum: [SUBSCRIPTION, ONE_TIME, ADD_ON, QUOTE]
      responses:
        '200':
          description: Visible in-sale catalog offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferPage'
        '400':
          description: Cursor is invalid or the normalized filter digest changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/customer/orders:
    post:
      tags: [customer]
      operationId: createCustomerOrder
      summary: Create a server-priced customer order snapshot.
      description: |
        Creates one personal or enterprise payable order from the current
        ACTIVE catalog offer. The client must supply an explicit purchase
        consent decision fixed to `ACCEPT` together with the current
        `policyCode`, `policyVersion`, `promptVersion` and `contentSha256`;
        `DECLINE` is not order creation. The server derives the workspace,
        real-name prerequisite, ACTIVE service activation, purchase consent
        event identity, amount, currency, snapshot, version token and payment
        state. The `Idempotency-Key` header is 1-475 characters and becomes
        the A0 `PURCHASE` client key; the purchase consent event identity is
        derived server-side from the authenticated account and that key and
        is never client-supplied. A second checkout while a same
        subject/offer order is UNKNOWN is rejected until the original order
        is queried. Missing, stale or declined current purchase consent
        creates no order. The request never carries price, amount, payment
        success or entitlement outcome.
      security:
        - customerSession: []
      x-onecall-surface: customer
      x-onecall-audience: customer
      x-onecall-authorization: customerSession -> ACTIVE account; subject access and ACTIVE service activation re-read under locks; ordinary-client real-name required; server amount only
      x-onecall-a0-models:
        - catalog_order.catalog_product
        - catalog_order.catalog_version
        - catalog_order.catalog_offer
        - catalog_order.catalog_benefit_line
        - catalog_order.customer_order
        - catalog_order.payment_order
        - activation_consent.consent_record
        - activation_consent.service_activation
        - customer_iam.identity_profile
      x-onecall-a0-contracts:
        - T-S2-07
        - '§7.3'
        - ck_catalog_version_published_shape
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - IDEMPOTENCY_CONFLICT
        - ORDER_UNKNOWN_PAYMENT_PENDING
        - PURCHASE_CONSENT_REQUIRED
        - PURCHASE_CONSENT_STALE
        - PURCHASE_CONSENT_DECLINED
        - ACTIVATION_NOT_ACTIVE
        - REAL_NAME_REQUIRED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: idempotency-key
      x-onecall-replay-order: risk-and-activation-before-replay
      parameters:
        - $ref: '#/components/parameters/OrderIdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: First created order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Same-key replay of the first completed order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency, unknown-payment or purchase-consent conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
