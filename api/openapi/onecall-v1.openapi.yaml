      security:
        - employeeSession: []
      x-onecall-surface: operations
      x-onecall-audience: employee
      x-onecall-authorization: employeeSession.role == OPS; subject activation state/revision re-read under lifecycle lock; only SUSPENDED -> ACTIVE; no trial reissue; no recording playback
      x-onecall-a0-models:
        - activation_consent.service_activation
        - activation_consent.service_activation_transition
        - audit.audit_fact
      x-onecall-a0-contracts:
        - T-S2-09
        - T-S1-03
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
