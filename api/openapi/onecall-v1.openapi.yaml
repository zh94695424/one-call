            - DIAL_TASK_CALLEE
            - ENTER_CALLEE
            - GUIDE_PURCHASE
            - REJECT
            - REJECT_SUSPENDED
            - REJECT_CALL_IN_PROGRESS
            - null
        reasonCode:
          type: string
          enum:
            - ACTIVATION_REQUIRED
            - CONSENT_REQUIRED
            - CALLER_UNTRUSTED
            - SESSION_IDENTITY_MISMATCH
            - CALL_IN_PROGRESS
            - CONFIRMATION_NOT_ALLOWED
            - ACTIVATION_SUSPENDED
            - CALLER_BINDING_REVOKED
            - WORKSPACE_ACCESS_REVOKED
            - TASK_ACCESS_REVOKED
            - ORGANIZATION_INACTIVE
            - ACCOUNT_DISABLED
            - CALL_STATE_UNRESOLVED
            - TASK_CONFLICT
            - TASK_CLAIMED
            - NO_AVAILABLE_ENTITLEMENT
            - NO_VALID_TASK
            - TASK_EXPIRED
            - TASK_UNAVAILABLE
            - DIRECT_AUTHORIZED
            - DATA_INTEGRITY
