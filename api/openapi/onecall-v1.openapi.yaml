                    minLength: 1
                    maxLength: 128
                  sizeBytes:
                    type: integer
                    minimum: 0
                  sha256:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
        verificationChallenge:
          type: object
          additionalProperties: false
          required: [customerSessionRequired]
          properties:
            customerSessionRequired:
              type: boolean
              const: true
    ShareAdmissionRequest:
      type: object
      additionalProperties: false
      description: Explicit admission for one capability token; only ORGANIZATION_MEMBER requires an authenticated customerSession and the extraction code is write-only.
      required: [admissionRequestId, verification]
      properties:
        admissionRequestId:
          type: string
          minLength: 1
          maxLength: 128
        verification:
          # P2: object-only closed discriminated union. `type: object` makes
          # the wrapper definitively non-array and `additionalProperties:
          # false` closes it to unbounded objects (F5-01/R6-01). The property
          # envelope repeats only the union of branch keys so the closed
          # wrapper cannot over-restrict a valid branch instance; the oneOf
          # branches stay authoritative per mode, so branch-specific secrets
          # (the writeOnly extraction `code`) remain confined to
          # EXTRACTION_CODE and never validate under another mode. The
          # explicit canonical discriminator mapping (NONE/EXTRACTION_CODE/
          # DESIGNATED_MOBILE/ORGANIZATION_MEMBER) makes openapi-typescript
          # 7.8.0 emit the wire literals on the branches instead of component
          # names, so the generated union is inhabitable (R-01).
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [NONE, EXTRACTION_CODE, DESIGNATED_MOBILE, ORGANIZATION_MEMBER]
            code:
              type: string
              minLength: 1
              maxLength: 128
              writeOnly: true
            verificationProofId:
              type: string
              minLength: 1
              maxLength: 128
          oneOf:
            - $ref: '#/components/schemas/ShareVerificationNone'
            - $ref: '#/components/schemas/ShareVerificationExtractionCode'
            - $ref: '#/components/schemas/ShareVerificationDesignatedMobile'
            - $ref: '#/components/schemas/ShareVerificationOrganizationMember'
          discriminator:
            propertyName: mode
            mapping:
              NONE: '#/components/schemas/ShareVerificationNone'
              EXTRACTION_CODE: '#/components/schemas/ShareVerificationExtractionCode'
              DESIGNATED_MOBILE: '#/components/schemas/ShareVerificationDesignatedMobile'
              ORGANIZATION_MEMBER: '#/components/schemas/ShareVerificationOrganizationMember'
    ShareVerificationNone:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          const: NONE
    ShareVerificationExtractionCode:
      type: object
      additionalProperties: false
      required: [mode, code]
      properties:
        mode:
          type: string
          const: EXTRACTION_CODE
        code:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ShareVerificationDesignatedMobile:
      type: object
      additionalProperties: false
      required: [mode, verificationProofId]
      properties:
        mode:
          type: string
          const: DESIGNATED_MOBILE
        verificationProofId:
          type: string
          minLength: 1
          maxLength: 128
    ShareVerificationOrganizationMember:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          const: ORGANIZATION_MEMBER
    ShareAdmission:
      type: object
      additionalProperties: false
      description: Admitted share session with a short-lived media authorization; NONE verifies nothing and ticket failure after commit never recounts.
      required: [admissionId, verificationMode, verificationResult, admittedAt, sessionExpiresAt, admissionExpiresAt, mediaAuthorization]
      properties:
        admissionId:
          type: string
          format: uuid
        verificationMode:
          type: string
          enum: [NONE, EXTRACTION_CODE, DESIGNATED_MOBILE, ORGANIZATION_MEMBER]
        verificationResult:
          type: string
          enum: [VERIFIED, NOT_REQUIRED]
        admittedAt:
          type: string
          format: date-time
        sessionExpiresAt:
          type: string
          format: date-time
        admissionExpiresAt:
          type: string
          format: date-time
        mediaAuthorization:
          type: object
          additionalProperties: false
          required: [credential, expiresAt]
          properties:
            credential:
              type: string
              minLength: 1
              maxLength: 2048
              readOnly: true
              x-onecall-log-redaction: required
            expiresAt:
              type: string
              format: date-time
    MediaAuthorizationRequest:
      type: object
      additionalProperties: false
      description: Issue or rebuild a short-lived media credential for an already-admitted session; no current credential is carried in the request.
      required: [authorizationRequestId, purpose]
      properties:
        authorizationRequestId:
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          type: string
          enum: [PLAYBACK, SEEK, RENEW]
    MediaAuthorization:
      type: object
      additionalProperties: false
      description: Short-lived opaque media credential validated by the media gateway; not a return-once secret and never logged.
      required: [credential, expiresAt]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
          x-onecall-log-redaction: required
        expiresAt:
          type: string
          format: date-time
    CallbackAcknowledgement:
      type: object
      additionalProperties: false
      description: Provider callback acknowledgement only; internal payment, entitlement and customer/employee identity are never returned.
      required: [accepted, duplicate]
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
    OpaqueProviderPayload:
      type: object
      # R-02: explicitly open so openapi-typescript 7.8.0 emits an
      # unknown-valued open record instead of Record<string, never>; the
      # named-only opaque exemption and fail-closed closure rules are
      # unchanged.
      additionalProperties: true
      x-onecall-opaque: true
      description: Approved opaque provider payment payload; A1 does not copy vendor fields, transaction details or signature material into the contract.
    PaymentProviderCallbackRequest:
      type: object
      additionalProperties: false
      description: Wrapper that admits exactly the opaque provider payload under provider mTLS plus signature verification.
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/OpaqueProviderPayload'
