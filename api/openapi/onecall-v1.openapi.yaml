          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationTransition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ActivationStateConflict'
        '422':
