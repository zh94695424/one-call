          in: path
          required: true
          description: Stable parent IVR call identity.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/IvrTimestampParam'
        - $ref: '#/components/parameters/IvrNonceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingDeclarationRequest'
      responses:
        '201':
          description: First recording declaration with a short-lived upload instruction.
          content:
