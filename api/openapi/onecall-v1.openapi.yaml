    IvrDecision:
      type: object
      additionalProperties: false
      description: >-
        Frozen IVR decision snapshot shared by INBOUND_RESOLVE, ACTIVATION_NEXT_ACTION and DIRECT_AUTHORIZATION; normal domain outcomes are always 200. The five frozen domain fields are always present: the two routing snapshot fields are non-null per A0; the three reservation fields are explicitly nullable when no reservation exists.
      required:
        - decisionId
        - callId
        - purpose
        - action
        - callerState
        - taskMatch
        - reasonCode
        - availableRecordingSeconds
        - balanceAsOf
        - reservationId
        - authorizedRecordingSeconds
        - authorizationExpiresAt
