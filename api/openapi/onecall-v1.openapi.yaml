        A0 task client identity; a same-key same-fingerprint replay returns the
        original task without extending its frozen TTL. A single non-terminal
        task per canonical caller/subject is enforced; an incompatible
        non-terminal task or a changed action identity is
        `OUTBOUND_TASK_CONFLICT`. Plaintext callee, other-account tasks and
        historical callees are never returned.
