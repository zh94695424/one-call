        extractionCode:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
          x-onecall-return-once: true
          x-onecall-log-redaction: required
          description: Returned only when verificationMode is EXTRACTION_CODE; never present in other modes.
    ShareCodeRotation:
      # C18: one operation/status contract delivered as a closed discriminated
      # result. The wrapper is a pure oneOf + discriminator carrier with an
      # explicit canonical mapping (ROTATED/REPLAYED), so openapi-typescript
      # 7.8.0 emits the canonical wire literals on the branches and the
      # generated wrapper is exactly the branch union with no duplicate
      # property/discriminator intersection (R-01). The oneOf branches stay
      # the closed authorities: ROTATED requires the one-time extractionCode;
      # REPLAYED forbids it; neither branch carries a capabilityToken. The
      # wrapper declares no properties, additionalProperties or type so the
      # closed branches — not a duplicated envelope — own closure, and no
      # unowned timestamp projection is exposed (R-03).
      description: Code rotation projection; ROTATED returns the new extraction code once, REPLAYED never does, and the response never contains a capability token.
      oneOf:
        - $ref: '#/components/schemas/ShareCodeRotationRotated'
        - $ref: '#/components/schemas/ShareCodeRotationReplayed'
      discriminator:
        propertyName: result
        mapping:
          ROTATED: '#/components/schemas/ShareCodeRotationRotated'
          REPLAYED: '#/components/schemas/ShareCodeRotationReplayed'
    ShareCodeRotationRotated:
      type: object
      additionalProperties: false
      description: First code rotation; the new extraction code is returned exactly once.
      required: [result, shareId, verificationMode, status, codeGeneration, revocationGeneration, extractionCode]
      properties:
        result:
          type: string
          const: ROTATED
        shareId:
          type: string
          minLength: 1
          maxLength: 128
        verificationMode:
          type: string
          enum: [EXTRACTION_CODE]
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        codeGeneration:
          type: integer
          minimum: 1
        revocationGeneration:
          type: integer
          minimum: 0
        extractionCode:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
          x-onecall-return-once: true
          x-onecall-log-redaction: required
    ShareCodeRotationReplayed:
      type: object
      additionalProperties: false
      description: Replayed code rotation; the extraction code is never re-returned.
      required: [result, shareId, verificationMode, status, codeGeneration, revocationGeneration]
      properties:
        result:
          type: string
          const: REPLAYED
        shareId:
          type: string
          minLength: 1
          maxLength: 128
        verificationMode:
          type: string
          enum: [EXTRACTION_CODE]
        status:
          type: string
          enum: [ACTIVE, LOCKED]
        codeGeneration:
          type: integer
          minimum: 1
        revocationGeneration:
          type: integer
          minimum: 0
