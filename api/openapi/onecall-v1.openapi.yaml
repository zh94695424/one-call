  /api/v1/operations/catalog/versions:
    post:
      tags: [operations]
      operationId: createOperationsCatalogVersionDraft
      summary: Create a DRAFT catalog version candidate for an existing product.
      description: |
        Creates one DRAFT catalog version candidate for an already existing
        immutable product under the natural unique key `(productId,
        versionNo)` and the canonical persisted content projection. The
        product must already exist; no product-create endpoint is provided. A
        first insert returns 201; the same natural identity with the same
        projection returns the existing DRAFT with 200; a changed projection,
        duplicate version or non-DRAFT state is `CATALOG_DRAFT_CONFLICT`.
        Benefit lines and the channel set are supplied once at creation and
        are append-only with the version. The request never carries status,
        publishedAt or a client price fact for a published version.
        State-conditional only; no Idempotency-Key and no platform
        idempotency scope.
      security:
        - employeeSession: []
      x-onecall-surface: operations
      x-onecall-audience: employee
      x-onecall-authorization: employeeSession.role == ADMIN; product must already exist; natural unique create; append-only benefit lines and channels; no status/publishedAt input
      x-onecall-a0-models:
        - catalog_order.catalog_product
        - catalog_order.catalog_version
        - catalog_order.catalog_offer
        - catalog_order.catalog_benefit_line
        - operations_iam.employee_account
        - audit.audit_fact
      x-onecall-a0-contracts:
        - uq_catalog_version_no
        - ck_catalog_version_published_shape
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CATALOG_DRAFT_CONFLICT
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      x-onecall-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogVersionDraftCreateRequest'
      responses:
        '201':
          description: First DRAFT catalog version candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVersionDraft'
        '200':
          description: Same natural identity and content projection replays the existing DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVersionDraft'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogDraftConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/operations/catalog/versions/{versionId}/draft:
    put:
      tags: [operations]
      operationId: replaceOperationsCatalogVersionDraft
      summary: Replace mutable content of a DRAFT catalog version candidate.
      description: |
        Replaces the mutable commercial content of one never-published DRAFT
        catalog version under `expectedRevision` and the canonical
        requested/current content projection. Benefit lines and the channel
        set are immutable (A0 append-only with the version) and are not
        rewritten. Channel version tokens for the existing channel set are
        regenerated server-side only and are never public input or output;
        no channel-token field or mutation endpoint is exposed. An applied
        update increments revision and returns 200; a
        retry whose current revision and projection prove the update was
        applied returns the current DRAFT without another write; a stale
        revision is `CATALOG_DRAFT_STALE_VIEW`; a published/non-DRAFT version
        or immutable-content change is `CATALOG_DRAFT_CONFLICT`. The request
        never carries status, publishedAt or a product/version identity
        change. State-conditional only; no Idempotency-Key.
      security:
        - employeeSession: []
      x-onecall-surface: operations
      x-onecall-audience: employee
      x-onecall-authorization: employeeSession.role == ADMIN; only DRAFT/never-published mutable commercial content; expectedRevision conditional update; benefit lines and channels immutable
      x-onecall-a0-models:
        - catalog_order.catalog_product
        - catalog_order.catalog_version
        - catalog_order.catalog_offer
        - catalog_order.catalog_benefit_line
        - operations_iam.employee_account
        - audit.audit_fact
      x-onecall-a0-contracts:
        - uq_catalog_version_no
        - ck_catalog_version_published_shape
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CATALOG_DRAFT_CONFLICT
        - CATALOG_DRAFT_STALE_VIEW
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      x-onecall-required-roles: [ADMIN]
      parameters:
        - name: versionId
          in: path
          required: true
          description: Catalog version identity to replace.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogVersionDraftReplaceRequest'
      responses:
        '200':
          description: Applied replace or an already-applied replay of the current DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVersionDraft'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogDraftConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/operations/trial-policies/{policyVersionId}/draft:
    put:
      tags: [operations]
      operationId: replaceOperationsTrialPolicyDraft
      summary: Replace mutable content of a DRAFT trial policy candidate.
      description: |
        Replaces the mutable content of one never-published first-trial policy
        candidate under `expectedRevision` and the canonical
        requested/current content projection. `campaignKey` and `versionNo`
        are immutable; enabled, publishedAt and publisher identity are never
        client-written. An applied update increments revision and returns 200;
        a retry whose current revision and projection prove the update was
        applied returns the current DRAFT without another write; a stale
        revision is `TRIAL_POLICY_DRAFT_STALE_VIEW`; a published policy or
        immutable-key change is `TRIAL_POLICY_DRAFT_CONFLICT`. No default
        granted seconds or valid days are invented. State-conditional only;
        no Idempotency-Key. Runtime draft writes remain subject to the A0
        precondition `R-A0-O20-PUBLISHER`.
      security:
        - employeeSession: []
      x-onecall-surface: operations
      x-onecall-audience: employee
      x-onecall-authorization: employeeSession.role == ADMIN; only DRAFT/never-published mutable content; expectedRevision conditional update; campaign key and versionNo immutable; R-A0-O20-PUBLISHER runtime prerequisite preserved
      x-onecall-a0-models:
        - entitlement_metering.trial_policy_version
        - operations_iam.employee_account
        - audit.audit_fact
      x-onecall-a0-contracts:
        - uq_trial_policy_campaign_version
        - ck_trial_policy_revision
        - '§7.3'
      x-onecall-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - TRIAL_POLICY_DRAFT_CONFLICT
        - TRIAL_POLICY_DRAFT_STALE_VIEW
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
      x-onecall-idempotency: state-conditional
      x-onecall-required-roles: [ADMIN]
      x-onecall-r-a0-o20-publisher: R-A0-O20-PUBLISHER
      parameters:
        - name: policyVersionId
          in: path
          required: true
          description: Trial policy version identity to replace.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialPolicyDraftReplaceRequest'
      responses:
        '200':
          description: Applied replace or an already-applied replay of the current DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialPolicyDraft'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrialPolicyDraftConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    customerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque customer session; issuance, WeChat/OTP login, refresh and revocation remain Q1/Q19 inputs.
    employeeSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Independent employee audience session with fixed ADMIN/OPS roles; authentication source and MFA remain Q1.
    ivrMtls:
      type: mutualTLS
      description: IVR service identity via mutual TLS. Certificate issuance, pinning and rotation remain Q7/Q15.
    ivrSignature:
      type: apiKey
      in: header
      name: X-ONECALL-SIGNATURE
      description: IVR request signature used together with mTLS. Algorithm, replay window and nonce form remain Q7/Q15/Q25.
    providerCallbackMtls:
      type: mutualTLS
      description: Payment provider callback service identity via mutual TLS. Certificate mapping remains Q6/Q15.
    providerCallbackSignature:
      type: apiKey
      in: header
      name: X-ONECALL-CALLBACK-SIGNATURE
      description: Provider callback signature used together with mTLS. Vendor payload and signature algorithm remain Q6/Q15.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor bound to the stable sort and normalized filter digest. Offset cursors are not accepted.
      schema:
        $ref: '#/components/schemas/Cursor'
    LimitParam:
      name: limit
      in: query
      required: false
      description: V1 API-governance page size default and maximum; a deployment may clamp further.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable operation action identity supplied by the caller; never truncated.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Customer-order client idempotency key (1-475). The A0 PURCHASE platform key is account_id||':'||this key (1-512); truncation is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 475
  responses:
    Unauthenticated:
      description: Missing or invalid customer or employee session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated identity is not allowed for the current access, role or resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the current identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request failed schema, field, enum or length validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorInvalid:
      description: The cursor cannot be parsed, was tampered with or crosses a surface.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ActivationStateConflict:
      description: The current activation state or revision does not permit the requested OPERATIONS transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogPublicationConflict:
      description: The current catalog active version or revision does not permit the requested publication or offsale transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrialPolicyPublicationConflict:
      description: The current enabled trial policy version or revision does not permit the requested publication or disable transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogDraftConflict:
      description: The DRAFT catalog candidate natural identity, state or content projection forbids the requested create or replace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrialPolicyDraftConflict:
      description: The DRAFT trial policy candidate natural identity, state or content projection forbids the requested create or replace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The platform rate or quota rejected the request; no numeric rate, window or retry policy is frozen in this contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency, capacity or maintenance condition makes the service unavailable; no vendor or retry-after semantics are frozen in this contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: Safe generic server failure with a stable trace identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem detail extended with a stable business code and trace identity.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldProblem'
    ProblemCode:
      type: string
      description: Stable machine-readable business error code; the only machine branching key.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - CURSOR_INVALID
        - CURSOR_FILTER_MISMATCH
        - CLAIM_RISK_BLOCKED
        - CLAIM_REPLAY_CONFLICT
        - CLAIM_CONTEXT_CONFLICT
        - ACTIVATION_STATE_CONFLICT
        - CONSENT_REQUIRED
        - ACTIVATION_CONSENT_DECLINED
        - PURCHASE_CONSENT_REQUIRED
        - PURCHASE_CONSENT_STALE
        - PURCHASE_CONSENT_DECLINED
        - REAL_NAME_REQUIRED
        - ACTIVATION_NOT_ACTIVE
        - ORDER_UNKNOWN_PAYMENT_PENDING
        - IDEMPOTENCY_CONFLICT
        - CATALOG_DRAFT_CONFLICT
        - CATALOG_DRAFT_STALE_VIEW
        - TRIAL_POLICY_DRAFT_CONFLICT
        - TRIAL_POLICY_DRAFT_STALE_VIEW
        - CATALOG_PUBLICATION_CONFLICT
        - PUBLICATION_STALE_VIEW
        - TRIAL_POLICY_PUBLICATION_CONFLICT
        - TRIAL_POLICY_STALE_VIEW
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
    FieldProblem:
      type: object
      additionalProperties: false
      description: Field-level validation problem; pointers identify the request location without echoing values.
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 512
    Cursor:
      type: string
      description: Opaque server-issued cursor; never an offset, SQL key or raw ID.
      minLength: 1
      maxLength: 512
    PageInfo:
      type: object
      additionalProperties: false
      description: Shared page-boundary convention; every *Page schema exposes these two fields together with items.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    CustomerAccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [workspaceType, status]
      properties:
        workspaceType:
          type: string
          enum: [PERSONAL, ORGANIZATION]
        organizationId:
          type: string
          format: uuid
        organizationDisplayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum: [ADMINISTRATOR, MEMBER, EVIDENCE_MANAGER, AUDITOR]
        status:
          type: string
          enum: [ACTIVE]
    CustomerContext:
      type: object
      additionalProperties: false
      required: [account, workspaces, channel]
      properties:
        account:
          $ref: '#/components/schemas/CustomerAccountSummary'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
        channel:
          type: string
          enum: [MINIAPP, WEB]
    BusinessNumber:
      type: object
      additionalProperties: false
      required: [bindingId, subjectId, numberMasked, numberType, bindingStatus, activationStatus, realNameStatus]
      properties:
        bindingId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        numberMasked:
          type: string
          minLength: 1
          maxLength: 64
        numberType:
          type: string
          enum: [MOBILE, LANDLINE]
        bindingStatus:
          type: string
          enum: [ACTIVE, DISABLED, RETIRED]
        activationStatus:
          type: string
          description: Server-derived activation projection for the bound subject; response-only and never client-writable.
          readOnly: true
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        realNameStatus:
          type: string
          enum: [UNVERIFIED, VERIFIED]
    BusinessNumberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessNumber'
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    TrialSummary:
      type: object
      additionalProperties: false
      required: [grantedSeconds, remainingSeconds, expiresAt, status]
      properties:
        grantedSeconds:
          type: integer
          minimum: 0
        remainingSeconds:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [GRANTED, EXHAUSTED, EXPIRED]
    ConsentRequirements:
      type: object
      additionalProperties: false
      description: Current policy, prompt and content identity that an explicit consent must match.
      required: [policyCode, policyVersion, promptVersion, contentSha256]
      properties:
        policyCode:
          type: string
          minLength: 1
          maxLength: 64
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        contentSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CustomerSubjectDetail:
      type: object
      additionalProperties: false
      required: [subjectId, activationStatus, evidenceCount, orderCount]
      properties:
        subjectId:
          type: string
          format: uuid
        numberMasked:
          type: string
          minLength: 1
          maxLength: 64
        activationStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        trial:
          $ref: '#/components/schemas/TrialSummary'
        consentRequirements:
          $ref: '#/components/schemas/ConsentRequirements'
        evidenceCount:
          type: integer
          minimum: 0
        orderCount:
          type: integer
          minimum: 0
    ClaimRequest:
      type: object
      additionalProperties: false
      description: Verified personal claim inputs. Account, owner, role, raw number, HMAC and verification ciphertext are server-derived and never accepted.
      required: [subjectId, bindingId, verificationMethod, verificationProofId]
      properties:
        subjectId:
          type: string
          format: uuid
        bindingId:
          type: string
          format: uuid
        verificationMethod:
          type: string
          enum: [SMS, WECHAT_PHONE, CALLER_CHALLENGE, MANUAL_REVIEW]
        verificationProofId:
          type: string
          description: Opaque server-validated verification-attempt reference; never a code, OTP, number or ciphertext.
          minLength: 1
          maxLength: 128
    ClaimResult:
      type: object
      additionalProperties: false
      required: [claimId, status, subjectId]
      properties:
        claimId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, REJECTED, CONFLICT]
        subjectId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
    ActivationRequest:
      type: object
      additionalProperties: false
      description: Explicit activation consent decision bound to the current policy, prompt and content identity.
      required: [activationEventId, decision, policyCode, policyVersion, promptVersion, contentSha256]
      properties:
        activationEventId:
          type: string
          minLength: 1
          maxLength: 128
        decision:
          type: string
          enum: [ACCEPT, DECLINE]
        policyCode:
          type: string
          minLength: 1
          maxLength: 64
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        contentSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ActivationTrial:
      type: object
      additionalProperties: false
      required: [grantedSeconds, expiresAt]
      properties:
        grantedSeconds:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    ActivationResult:
      type: object
      additionalProperties: false
      required: [activationStatus, activationRevision, transitionId, consentId, trialOutcome, trial]
      properties:
        activationStatus:
          type: string
          enum: [INACTIVE, ACTIVE, SUSPENDED]
        activationRevision:
          type: integer
          minimum: 1
        transitionId:
          type: string
          format: uuid
          description: The newly appended transition or the current latest transition anchor for an already-active replay.
        consentId:
          type: string
          format: uuid
        trialOutcome:
          type: string
          enum: [GRANTED, REPLAY, ALREADY_GRANTED]
        trial:
          $ref: '#/components/schemas/ActivationTrial'
    EvidenceArtifact:
      type: object
      additionalProperties: false
      required: [artifactRole]
      properties:
        artifactRole:
          type: string
          enum: [ORIGINAL, DERIVED]
        mimeType:
          type: string
          minLength: 1
          maxLength: 128
        sizeBytes:
          type: integer
          minimum: 0
        validatedDurationSeconds:
          type: integer
          minimum: 1
