  function startIvrSession(state, input, now) {

  function consumeTrial(state, input, now) {

  function createOrder(state, input, now) {

  function applyPaymentResult(state, input, now) {

function targetFingerprint(action,id){

 if(action.includes('product')||['edit-draft','publish','off-sale','on-sale'].includes(action)){const p=product(id);return JSON.stringify(p?business.catalog.filter(x=>x.sku===p.sku):null);}

 if(action.includes('employee')||action==='reset-credential')return JSON.stringify(employees);

 if(['edit-employee','disable-employee','enable-employee','reset-credential'].includes(action)){const e=employee(id);return !!e&&state.route==='/employees/'+id&&(action!=='disable-employee'||e.status==='ACTIVE')&&(action!=='enable-employee'||e.status==='DISABLED');}

function integer(v,min,max){return /^\d+$/.test(v)&&Number.isSafeInteger(+v)&&+v>=min&&+v<=max;}
function readOffer(m){
 const base=product(m.id)||emptyOffer(),fresh=m.action==='create-product';
 const version=m.action==='edit-product'?Math.max(...business.catalog.filter(x=>x.sku===base.sku).map(x=>x.version))+1:fresh?1:base.version;
 const value={...clone(base),productCode:$('#pkg-code').value.trim(),sku:$('#pkg-sku').value.trim(),name:$('#pkg-name').value.trim(),description:$('#pkg-description').value.trim(),type:$('#pkg-type').value,audience:$('#pkg-audience').value,billingCycle:$('#pkg-term').value,saleStatus:'DRAFT',version,revision:m.action==='edit-draft'?base.revision+1:1,demo:true,policyStatus:'DEMO_NOT_APPROVED'};
 const price=$('#pkg-price').value.trim();if(value.audience==='ENTERPRISE'){if(price!=='')return null;value.priceCents=null;}else{if(!/^\d+(\.\d{1,2})?$/.test(price)||+price<.01||+price>99999.99)return null;value.priceCents=Math.round(+price*100);}

 value.rights={};for(const key of Object.keys(rightsLabels)){const v=$('#pkg-'+key).value.trim();if(!integer(v,0,key==='evidenceCount'?1000000:100000))return null;value.rights[key]=+v;}
 value.includedFeatures=$('#pkg-features').value.split('\n').map(x=>x.trim()).filter(Boolean);if(value.includedFeatures.length>20)return null;
 value.channels=[...document.querySelectorAll('[name="pkg-channel"]:checked')].map(x=>x.value);
 const term={ONCE:[1,0],MONTHLY:[1,1],QUARTERLY:[3,1],ANNUAL:[12,1],QUOTE:[1,0]}[value.billingCycle];if(!term)return null;[value.installments,value.grantIntervalMonths]=term;
 if(value.type==='SUBSCRIPTION'?!['MONTHLY','QUARTERLY','ANNUAL'].includes(value.billingCycle):value.type==='QUOTE'?value.billingCycle!=='QUOTE':value.billingCycle!=='ONCE')return null;

 const candidate=clone(business);let object=m.id,before=null,after=null,event='';
 if(['create-product','edit-draft','edit-product'].includes(m.action)){const value=readOffer(m);if(!value)return fail('请检查编码唯一性、名称说明、价格、整数权益、渠道及类型/周期组合；个人不能携带企业席位或固话');before=p?clone(p):null;after=value;object=value.versionId;event=m.action==='edit-draft'?'保存同一草稿':'创建套餐草稿';if(m.action==='edit-draft')candidate.catalog[candidate.catalog.findIndex(x=>x.versionId===m.id)]=value;else candidate.catalog.push(value);}
 else if(m.action==='edit-trial'){const seconds=$('#trial-seconds').value.trim(),days=$('#trial-days').value.trim(),enabled=$('#trial-enabled').value;if(!integer(seconds,1,3600)||!integer(days,1,365)||!['true','false'].includes(enabled))return fail('试用额度需为 1—3600 整数秒，有效期为 1—365 整数天');before=clone(business.rule);candidate.rule={...candidate.rule,version:candidate.rule.version+1,seconds:+seconds,validDays:+days,enabled:enabled==='true'};after=clone(candidate.rule);object='FIRST-TRIAL';event='发布试用规则';}
 else {before=clone(candidate.catalog.filter(x=>x.sku===p.sku));if(m.action==='off-sale'){const target=candidate.catalog.find(x=>x.versionId===p.versionId);target.saleStatus='OFFSALE';target.revision++;}else{candidate.catalog.filter(x=>x.sku===p.sku&&x.saleStatus==='ACTIVE').forEach(x=>{x.saleStatus='OFFSALE';x.revision++;});const target=candidate.catalog.find(x=>x.versionId===p.versionId);target.saleStatus='ACTIVE';target.revision++;}after=clone(candidate.catalog.filter(x=>x.sku===p.sku));event=m.action==='publish'?'发布套餐':m.action==='off-sale'?'下架套餐':'上架套餐';}
 if(!commitBusiness(candidate))return;m.submitted=true;audit(event,object,before,after,reason);closeModal();if(['create-product','edit-product'].includes(m.action))go('/catalog/'+object);else render();notify('操作已完成，历史快照保持不变');
}
const demoCases={
 new:['NEW_MOBILE','新手机号 · 未实名未登录'],fixed:['NEW_LANDLINE','新固话 · 主叫挑战'],repeat:['REPEAT_CALL','重复呼入 · 复用原主体与试用'],timeout:['TIMEOUT','超时 · 未确认'],wrong:['WRONG_KEY','错误按键 · 非 1'],missing:['MISSING_CALLER','主叫缺失'],suspended:['SUSPENDED','业务已停用'],disabled:['TRIAL_DISABLED','新试用已关闭'],expired:['EXPIRED_TRIAL','试用已过期'],exhausted:['EXHAUSTED_TRIAL','剩余 20 秒后耗尽'],conflict:['CONFLICT','认领冲突'],recycled:['RECYCLED','号码回收风险']
};
function demoModal(){if(!actor()||state.dataMode!=='normal')return;openModal('IVR 流程演示','<p>仅本地演示自建 IVR：播放录音告知与提示词版本，可信主叫按键 1 后内部开通；IVR 只引导到小程序购买，不创建订单或支付。</p><label class="field">呼入场景'+select('demo-case',Object.entries(demoCases).map(([k,v])=>[k,v[1]]),state.reviewScenario)+'</label>','demo');}
function demoStart(){const m=state.modal,key=$('#demo-case').value;if(!demoCases[key])return fail('未知场景');const result=B.startIvrSession(business,{scenario:demoCases[key][0]},new Date());if(!result.ok)return fail('无法创建演示会话：'+result.code);if(['timeout','wrong','missing'].includes(key)){const session=business.sessions.find(x=>x.id===result.value.id);session.status=key==='missing'?'REJECTED':'ABANDONED';}m.submitted=true;const id=result.value.id;closeModal();go('/ivr-sessions/'+id);openDemoSession(id);}
function openDemoSession(id){const s=one(business.sessions,'id',id);if(!s)return;const u=subject(s.subjectId);const fixed=s.scenario==='NEW_LANDLINE'||s.maskedCaller?.includes('-');openModal('演示当前会话','<p><strong>'+esc(s.id)+' / '+esc(s.maskedCaller||'无法识别')+'</strong></p><p id="demo-outcome">'+esc(s.status==='CONFIRMED'?'已开通 · '+trialText(u):'等待明确同意；无可信主叫、超时或错误按键不发试用')+'</p><p>主体：'+esc(u?.id||'尚未建立')+'；实名：'+(u?label('identity',u.identity):'未实名')+'；账户：'+esc(u?.accountId||'待认领')+'</p><p><strong>录音告知：</strong>本次试用通话会录音并形成证据元数据。提示词版本 '+esc(s.consentVersion)+'；按键 1 表示明确同意。</p><p>当前新领取规则 '+business.rule.seconds+' 秒 / '+business.rule.validDays+' 天；既有试用按原发放版本与到期时间保留。</p><div class="actions">'+btn('按 1 确认开通','demo-confirm',id)+btn('试用录音 60 秒','demo-use',id)+btn(fixed?'提示微信搜索小程序购买':'提示到微信小程序购买','demo-guide',id)+btn(fixed?'主叫挑战后认领':'验证号码后认领','demo-claim',id)+'</div><p class="small muted">购买指引只记录 GUIDED，不产生支付或订单。固定电话不宣称发送短信。认领保留实名、试用和证据主体。</p>','demo-flow',id);$('.modal-actions').innerHTML=btn('关闭演示','close-modal');}
const demoErrors={SUSPENDED:'业务已暂停，不能绕过暂停',TRIAL_DISABLED:'新试用领取已关闭',TRIAL_EXPIRED:'试用已过期，不能新增录音',TRIAL_EXHAUSTED:'试用已耗尽，没有剩余试用权益',CLAIM_CONFLICT:'存在账户绑定冲突，请转线下人工客服核验',RECYCLED_NUMBER_REVIEW:'存在号码回收风险，请转线下人工客服核验',INVALID_TRANSITION:'需要明确开通、业务有效且有剩余试用权益',VERIFICATION_REQUIRED:'没有可信主叫，本次不新开通、不发试用',CONSENT_REQUIRED:'没有按键 1 明确确认，本次不新开通、不发试用'};
function demoAction(action,id){
 const m=state.modal,a=actor(),s=one(business.sessions,'id',id);
 if(!a){logout('员工会话已失效');return;}
 if(!m||m.action!=='demo-flow'||m.id!==id||m.route!==state.route||m.session!==JSON.stringify(state.session)||m.actorRevision!==a.revision||state.dataMode!=='normal'||!s)return fail('请从当前有效员工会话执行');
 let result,message='';
 if(action==='demo-confirm'){if(['REJECTED','ABANDONED'].includes(s.status))return fail(s.scenario==='WRONG_KEY'?'按键不是 1，本次不新开通、不发试用':'没有可信主叫或明确确认，本次不新开通、不发试用');if(s.scenario==='TRIAL_DISABLED'){const candidate=B.snapshot(business).value;candidate.rule.enabled=false;result=B.confirmIvrSession(candidate,{sessionId:id,key:'1',eventId:'OPS-CONFIRM-'+id},new Date());candidate.rule.enabled=business.rule.enabled;if(result.ok){const loaded=B.loadReviewSnapshot(business,candidate);if(!loaded.ok)result=loaded;}}else result=B.confirmIvrSession(business,{sessionId:id,key:'1',eventId:'OPS-CONFIRM-'+id},new Date());message=result.ok?(result.code==='DUPLICATE'?'原确认已处理，不重复开通或发放试用':result.value.grantCode==='TRIAL_DISABLED'?'已开通 · 新试用领取已关闭':result.value.grantCode==='DUPLICATE'?'已有试用，不重复领取':'已开通 · 首次试用 '+result.value.grant.grantedSeconds+' 秒'):'';}
 else if(action==='demo-use'){result=B.consumeTrial(business,{sessionId:id,seconds:60,eventId:'OPS-REC-'+id},new Date());if(result.ok)message=(result.code==='DUPLICATE'?'重复事件返回原结果；':'')+'已产生 '+result.value.evidence.recordedSeconds+' 秒录音证据；'+result.value.message;}
 else if(action==='demo-claim'){const u=subject(s.subjectId);result=B.claimSubject(business,{subjectId:u?.id,accountId:'ACCOUNT-DEMO-'+u?.id,verification:{verified:true,subjectId:u?.id,method:u?.numberType==='LANDLINE'?'CALLER_CHALLENGE':'SMS'},requestId:'OPS-CLAIM-'+id},new Date());message=result?.code==='DUPLICATE'?'主体已认领，不重复关联或发放试用':'已验证认领，实名仍未改变；试用和证据原样保留';}
 else if(action==='demo-guide'){s.guidanceStatus='GUIDED';result={ok:true};message=(s.maskedCaller?.includes('-')?'已提示用户搜索微信小程序购买':'已提示到微信小程序购买')+'；仅记录 GUIDED，未创建付费订单，未执行支付';}
 else return;
 if(!result?.ok)return fail(demoErrors[result?.code]||'操作被拒绝：'+result?.code);
 if(result.code!=='DUPLICATE')audit('IVR 演示 '+action,id,null,message,'本地可信场景模拟','ivr-service');
 closeModal();render();openDemoSession(id);$('#demo-outcome').textContent=message;
}
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;
 if(form.id==='login-form'){const name=$('#login-name').value.trim().toLowerCase(),code=$('#login-code').value,e=one(employees,'loginName',name);if(!e||e.status!=='ACTIVE'||!credentials.has(e.id)||credentials.get(e.id)!==code)return notify('登录名或 DEMO 码错误，或账号已停用');closeModal();dismissToast();state.session={employeeId:e.id,credentialVersion:e.credentialVersion,role:e.role,nonce:crypto.randomUUID()};if(state.route==='/login')state.route='/dashboard';render();}
 else if(['user-filter','order-filter','catalog-filter'].includes(form.id)&&actor()){state.filter=Object.fromEntries(new FormData(form));render();}
});
document.addEventListener('click',event=>{const target=event.target.closest('[data-route],[data-action]');if(!target)return;if(target.dataset.route)return go(target.dataset.route);const {action,id}=target.dataset;
 if(action==='logout')logout();else if(action==='close-modal')closeModal();else if(action==='confirm')confirm();else if(action==='demo')demoModal();else if(action.startsWith('demo-'))demoAction(action,id);else openAction(action,id);
});
document.addEventListener('change',event=>{if(event.target.id==='data-mode'&&['normal','empty','loading','unavailable'].includes(event.target.value)){closeModal();state.dataMode=event.target.value;render();}});
document.addEventListener('keydown',event=>{if(!state.modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const controls=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(el=>!el.disabled&&!el.readOnly);const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1)||'/dashboard';if(state.route!==route){closeModal();dismissToast();state.route=route;state.filter={};render();}});
// Local review hooks transfer business fixtures only, never employees, codes or login sessions.
window.__onecallOps={
 routes:clone(routeDefs),snapshot:()=>clone({business,employees:isAdmin()?employees:[],session:state.session,route:state.route,dataMode:state.dataMode,audit:state.audit,loggedIn:!!actor()}),
 businessSnapshot:()=>{const result=B.snapshot(business);if(!result.ok)throw Error(result.code);return result.value;},
 loadReviewSnapshot:candidate=>{if(!isAdmin()||state.dataMode!=='normal')return {ok:false,code:'FORBIDDEN'};const r=B.loadReviewSnapshot(business,candidate);if(r.ok)render();return clone(r);},
 applyActivationStatus:input=>{if(!isAdmin()||state.dataMode!=='normal')return {ok:false,code:'FORBIDDEN'};const r=B.setActivationStatus(business,input,new Date());if(r.ok)render();return clone(r);},
 setReviewScenario:name=>{const key=Object.keys(demoCases).find(k=>k===name||demoCases[k][0]===name);if(!key)return {ok:false,code:'NOT_FOUND'};state.reviewScenario=key;return {ok:true,scenario:demoCases[key][0]};},go,
 setReviewDataMode:mode=>{if(['normal','empty','loading','unavailable'].includes(mode)){closeModal();state.dataMode=mode;render();}}
};
state.route=location.hash.slice(1)||'/dashboard';render();
})();
