rder-radius:6px;padding:14px 20px;font-size:13px;z-index:100;max-width:calc(100vw - 48px);line-height:1.7}.hidden{display:none!important}

<script>

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ivrLabel = c => ({RECEIVED:'等待确认',CONFIRMED:'已按键确认',ABANDONED:'未确认退出',REJECTED:'呼入被拒绝'}[c] || c);

['/dashboard','运营概览','工作台'],['/users','用户管理','业务运营'],['/users/:id','用户详情',''],

['/catalog','套餐设置','商品与交易'],['/catalog/:id','套餐版本详情',''],['/trial-settings','试用规则','商品与交易'],
['/orders','订单查询','商品与交易'],['/orders/:id','订单详情',''],['/audit','操作记录','管理'],['/roadmap','后续规划','管理']

    {id:'SUB-1002',name:'IVR 试用用户',phone:'139****5137',type:'手机号',source:'IVR',account:null,identity:'未实名',active:true,version:1,trial:{seconds:300,used:60,rule:1,expires:Date.now()+25*86400000},history:['IVR IVR-8001 可信主叫呼入','播放 IVR-CONSENT-v1，按 1 明确同意','内部业务开通，首次发放 300 秒','未实名试用录音 60 秒，证据已固证']},

  ],

    {id:'ACT-7002',subject:'SUB-1002',source:'IVR',basis:'IVR-8001 / 语音 v1 / 按 1',result:'ACTIVE'},
    {id:'ACT-7003',subject:'SUB-1003',source:'WEB',basis:'服务协议 v1 / 显式勾选',result:'ACTIVE'},

    {id:'PKG-PLUS-1',sku:'PLUS',version:1,name:'个人进阶套餐',price:5900,minutes:300,days:30,status:'ACTIVE'},

  orders:[{id:'ORD-601',subject:'SUB-1001',source:'MINIAPP',payment:'PAID',entitlement:'已到账',snapshot:{id:'PKG-PER-1',name:'个人基础套餐',price:2900,minutes:100,days:30}},
    {id:'ORD-602',subject:'SUB-1003',source:'WEB',payment:'PAID',entitlement:'发放中',snapshot:{id:'PKG-PLUS-1',name:'个人进阶套餐',price:5900,minutes:300,days:30}},
    {id:'ORD-603',subject:'SUB-1003',source:'WEB',payment:'UNPAID',entitlement:'未发放',snapshot:{id:'PKG-PER-1',name:'个人基础套餐',price:2900,minutes:100,days:30}},

  audit:[{id:'LOG-1',actor:'ivr-service',object:'SUB-1002',event:'试用发放',detail:'0 → 300 秒 / FIRST-TRIAL / 规则 v1',reason:'IVR-8001 按 1 确认',time:'样例 · 09:16'}]
};
const getSubject = id => state.subjects.find(s=>s.id===id);
const getProduct = id => state.catalog.find(p=>p.id===id);
const rest = s => s.trial ? Math.max(0,s.trial.seconds-s.trial.used) : 0;
const trialText = s => !s.trial ? '未领取' : s.trial.expires<=Date.now() ? '已到期' : rest(s)===0 ? '已耗尽' : rest(s)+' 秒可用';
function log(event,object,detail,reason,actor=roles[state.role]){state.audit.unshift({id:'LOG-'+(++state.seq),actor,object,event,detail,reason,time:new Date().toLocaleTimeString('zh-CN',{hour12:false})});}
function dismissToast(){clearTimeout(state.toastTimer);state.toastTimer=null;$('#toast-root').innerHTML='';}
function notify(message){dismissToast();$('#toast-root').innerHTML='<div class="toast">'+esc(message)+'</div>';state.toastTimer=setTimeout(dismissToast,4500);}
function resolve(route){return routes.find(r=>r.path===route || (r.path.endsWith('/:id')&&route.startsWith(r.path.slice(0,-4)+'/')&&route.split('/').length===3));}
function go(route){if(typeof route!=='string'||!route.startsWith('/'))return;closeModal();dismissToast();state.filter={};state.route=route;location.hash=route;render();}
function loginView(){return '<div class="login-shell"><div class="login-brand"><img src="../logo/onecall-logo-b-lockup-white.svg" alt="一通话 ONECALL"><div><h1>把业务看清楚，<br>把运营做简单。</h1><p>统一管理三端用户、业务开通与套餐。<br>IVR 试用与小程序、Web 购买在同一后台汇总。</p></div><p class="small">ONECALL · 平台员工工作空间</p></div><div class="login-main"><section class="login-panel"><h2>运营后台登录</h2><p>平台员工使用。客户请从微信小程序或 Web 登录。</p><form id="login-form" class="stack"><label class="field">演示员工角色<select id="login-role"><option value="admin">管理员</option><option value="ops">运营人员</option></select></label><label class="field">演示验证码<input id="login-code" autocomplete="off" placeholder="输入 482916" maxlength="6"><small>本地原型，不连接真实员工身份服务。</small></label><button class="btn primary" type="submit">进入运营后台</button></form></section></div></div>';}
function nav(){let group='';return routes.filter(r=>r.group).map(r=>{const label=r.group!==group?'<div class="nav-label">'+esc(r.group)+'</div>':'';group=r.group;const active=state.route===r.path||(r.path!=='/dashboard'&&state.route.startsWith(r.path+'/'));return label+'<button class="nav-item '+(active?'active':'')+'" data-route="'+r.path+'" title="'+r.title+'">'+icon()+'<span class="nav-copy">'+r.title+'</span></button>';}).join('');}
function render(){
  document.title=(resolve(state.route)?.title||'运营后台')+' · 一通话';
  if(!state.loggedIn){$('#root').innerHTML=loginView();return;}
  const route=resolve(state.route);
  $('#root').innerHTML='<aside class="sidebar"><div class="brand"><img src="../logo/onecall-logo-b-icon-white.svg" alt=""><div><strong>一通话</strong><small>精简运营后台</small></div></div><nav class="nav" aria-label="主导航">'+nav()+'</nav><div class="sidebar-foot">本期以用户与套餐管理为主<br>工单 / 退款 / 发票由线下客服支持<br>本地原型 · 虚构数据</div></aside><header class="topbar"><strong>'+(route?esc(route.title):'页面未纳入本期')+'</strong><div class="actions"><span class="staff-copy">'+esc(roles[state.role])+' · 脱敏工作空间</span>'+btn('退出','logout')+'</div></header><main class="main"><div class="content" id="content">'+page(route)+'</div></main>'+reviewControls();

 const reason=$('#reason')?.value.trim()||'';if(reason.length<4)return fail('请填写至少 4 个字的操作理由');
 const s=getSubject(m.id),p=getProduct(m.id);
 if(s&&s.version!==m.version)return fail('用户状态已更新，请重新打开操作');
 if(p&&(p.status!==m.payload.status||m.payload.catalogFingerprint!==JSON.stringify(state.catalog.filter(x=>x.sku===p.sku))))return fail('套餐版本已变化，请重新打开操作');
 if(['suspend','resume'].includes(m.action)){s.active=m.action==='resume';s.version++;s.history.push((s.active?'恢复业务':'暂停业务')+'：'+reason);log(s.active?'恢复业务':'暂停业务',s.id,!s.active+' → '+s.active,reason);}
 else if(m.action==='edit-product'){
   const name=$('#pkg-name').value.trim(),price=$('#pkg-price').value.trim(),minutes=$('#pkg-minutes').value.trim(),days=$('#pkg-days').value.trim();
   if(!name||name.length>40||!/^\d+(\.\d{1,2})?$/.test(price)||+price<.01||+price>99999.99||!integer(minutes,1,100000)||!integer(days,1,3650))return fail('请检查名称、价格（0.01—99999.99 元）、分钟数（1—100000）和天数（1—3650）');
   const version=Math.max(...state.catalog.filter(x=>x.sku===p.sku).map(x=>x.version))+1;
   const draft={...p,id:'PKG-'+p.sku+'-'+version,version,name,price:Math.round(+price*100),minutes:+minutes,days:+days,status:'DRAFT'};
   state.catalog.push(draft);log('创建套餐草稿',draft.id,p.id+' → '+draft.id,reason);closeModal();go('/catalog/'+draft.id);notify('新版本草稿已创建，确认发布后才生效');return;
 }else if(m.action==='edit-trial'){
   if(m.payload.version!==state.rule.version)return fail('试用规则已更新，请重新打开操作');
   const seconds=$('#trial-seconds').value.trim(),days=$('#trial-days').value.trim(),enabled=$('#trial-enabled').value;
   if(!integer(seconds,1,3600)||!integer(days,1,365)||!['true','false'].includes(enabled))return fail('试用额度需为 1—3600 整数秒，有效期为 1—365 整数天');
   const before=clone(state.rule);state.rule={...state.rule,version:state.rule.version+1,seconds:+seconds,days:+days,enabled:enabled==='true'};log('发布试用规则',state.rule.campaign,JSON.stringify(before)+' → '+JSON.stringify(state.rule),reason);
 }else{const before=p.status;if(m.action==='off-sale')p.status='OFFSALE';else{state.catalog.filter(x=>x.sku===p.sku&&x.status==='ACTIVE').forEach(x=>x.status='OFFSALE');p.status='ACTIVE';}log(m.action==='publish'?'发布套餐':m.action==='off-sale'?'下架套餐':'上架套餐',p.id,before+' → '+p.status,reason);}
 closeModal();render();notify('操作已完成，历史记录保持不变');
}
function demoModal(){if(!state.loggedIn||state.dataMode!=='normal')return notify('请先切回正常业务数据');openModal('IVR 流程演示','<p>只模拟自建 IVR 与后台交互，所有数据为虚构。新主叫无需实名即可按键开通试用。</p><label class="field">呼入场景<select id="demo-case"><option value="new">新主叫 · 未实名未登录</option><option value="repeat">重复呼入 · 已有试用主体</option><option value="expired">试用到期 · 仍有剩余额度</option><option value="no-consent">未按确认键</option><option value="no-caller">无法识别可信主叫</option><option value="conflict">认领冲突 · 号码已关联其他账户</option></select></label>','demo');}
function demoStart(){
 const scenario=$('#demo-case').value;if(!['new','repeat','expired','no-consent','no-caller','conflict'].includes(scenario))return fail('未知场景');
 let s=scenario==='repeat'||scenario==='no-consent'?getSubject('SUB-1002'):scenario==='conflict'?getSubject('SUB-1001'):scenario==='expired'?getSubject('SUB-1005'):null;
 const id='IVR-DEMO-'+(++state.seq);
 const session={id,subject:s?.id||null,caller:scenario==='no-caller'?'无法识别':s?.phone||'135****'+String(state.seq).padStart(4,'0').slice(-4),status:scenario==='no-caller'?'REJECTED':scenario==='no-consent'?'ABANDONED':'RECEIVED',key:'—',consent:scenario==='no-caller'?'未播放':'IVR-CONSENT-v1',outcome:scenario==='no-caller'?'主叫缺失，未开通、未发试用':scenario==='no-consent'?'未明确同意，本次未新开通、未发试用':'等待明确按键确认',guided:false,time:'演示 · 刚刚',scenario};
 state.sessions.unshift(session);closeModal();go('/ivr-sessions/'+id);openDemoSession(id);
}
function openDemoSession(id){const session=state.sessions.find(x=>x.id===id);if(!session||!session.scenario)return;
 openModal('演示当前会话',demoBody(session),'demo-flow',id);$('.modal-actions').innerHTML=btn('关闭演示','close-modal');}
function demoBody(session){const s=getSubject(session.subject);return '<p><strong>'+esc(session.id)+' · '+esc(session.caller)+'</strong></p><p id="demo-outcome">'+esc(session.outcome)+'</p><p>业务主体：'+esc(s?.id||'尚未建立')+'；账户：'+esc(s?.account||'待认领')+'；实名：'+esc(s?.identity||'未实名')+'；试用：'+esc(s?trialText(s):'未领取')+'</p><div class="actions">'+btn('按 1 确认开通','demo-confirm',session.id)+btn('试用录音 60 秒','demo-use',session.id)+btn('提示小程序购买','demo-guide',session.id)+btn('验证号码后认领','demo-claim',session.id)+'</div><p class="small muted">认领演示代表已完成后端验证和冲突校验，不是仅凭登录认领；固话需主叫挑战等验证。认领不改变实名，不重发试用，不转移证据主体。</p>';}
function demoAction(action,id){
 const m=state.modal,session=state.sessions.find(x=>x.id===id);
 if(!state.loggedIn||state.dataMode!=='normal'||!m||m.action!=='demo-flow'||m.id!==id||m.route!==state.route||m.role!==state.role||!session?.scenario)return fail('请从当前演示会话执行');
 let s=getSubject(session.subject),message='';
 if(action==='demo-confirm'){
   if(['REJECTED','ABANDONED'].includes(session.status))return fail('没有可信主叫或明确确认，本次不新开通、不发试用');
   if(session.status==='CONFIRMED')return fail('原确认已处理，不重复开通或发放试用');
   if(s&&!s.active)return fail('业务已暂停，不能用重复呼入绕过暂停');
   if(!s){s={id:'SUB-DEMO-'+(++state.seq),name:'IVR 演示用户',phone:session.caller,type:'手机号',source:'IVR',account:null,identity:'未实名',active:true,version:1,trial:null,history:[]};state.subjects.push(s);session.subject=s.id;}
   session.status='CONFIRMED';session.key='1';s.history.push(session.id+' / IVR-CONSENT-v1 / 按 1 确认');
   if(!s.trial&&state.rule.enabled){s.trial={seconds:state.rule.seconds,used:0,rule:state.rule.version,expires:Date.now()+state.rule.days*86400000};message='已开通 · 首次试用 '+s.trial.seconds+' 秒';log('试用发放',s.id,'0 → '+s.trial.seconds+' 秒 / '+state.rule.campaign,'IVR 明确按键确认','ivr-service');}
   else message=s.trial?'已开通 · 已有试用，不重复领取':'已开通 · 新试用领取已关闭，无可用试用';
   session.outcome=message;state.activations.push({id:'ACT-'+(++state.seq),subject:s.id,source:'IVR',basis:session.id+' / IVR-CONSENT-v1 / 按 1',result:'ACTIVE'});
 }else if(action==='demo-use'){
   if(session.status!=='CONFIRMED'||!s?.active||!s.trial||s.trial.expires<=Date.now()||rest(s)===0)return fail('需要明确开通、业务有效且有未到期的剩余试用权益');
   const seconds=Math.min(60,rest(s));s.trial.used+=seconds;const evidence={id:'EVI-DEMO-'+(++state.seq),subject:s.id,session:id,seconds,identityAtCapture:s.identity,status:'已固证'};state.evidence.push(evidence);s.history.push(evidence.id+' '+s.identity+'试用录音 '+seconds+' 秒，保持原主体');message='已产生 '+seconds+' 秒录音证据；剩余 '+rest(s)+' 秒'+(rest(s)===0?'，已结束取证通话':'');log('试用录音',s.id,evidence.id+' / '+seconds+' 秒','试用有效录音','ivr-service');
 }else if(action==='demo-guide'){session.guided=true;message='已提示用户到微信小程序登录购买；未创建付费订单，未执行支付';}
 else if(action==='demo-claim'){
   if(session.status!=='CONFIRMED'||!s)return fail('请先明确按键开通并建立业务主体');
   if(session.scenario==='conflict')return fail('存在账户绑定冲突，拒绝认领，请联系线下客服核验');
   if(s.account)return fail('主体已认领，不重复关联或发放试用');
   s.account='USR-CLAIM-'+(++state.seq);s.version++;s.history.push('可信号码验证与冲突检查通过，追加账户关联 '+s.account+'；实名未改变');message='已验证认领，实名仍为未完成；既有证据主体及试用发放不变';log('认领业务主体',s.id,'待认领 → '+s.account,'演示后端验证及冲突检查通过','claim-service');
 }else return fail('未知演示操作');
 closeModal();render();openDemoSession(id);if($('#demo-outcome'))$('#demo-outcome').textContent=message;
}
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.id==='login-form'){if($('#login-code').value!=='482916')return notify('请输入演示验证码 482916');const role=$('#login-role').value;if(!roles[role])return;dismissToast();state.role=role;state.loggedIn=true;if(state.route==='/login')state.route='/dashboard';render();}
 else if(form.id==='user-filter'||form.id==='order-filter'){state.filter=Object.fromEntries(new FormData(form));render();}});
document.addEventListener('click',event=>{const target=event.target.closest('[data-route],[data-action]');if(!target)return;if(target.dataset.route)return go(target.dataset.route);const {action,id}=target.dataset;
 if(action==='logout'){closeModal();dismissToast();state.loggedIn=false;state.role='admin';state.dataMode='normal';state.filter={};state.route='/dashboard';location.hash='/dashboard';render();}
 else if(action==='close-modal')closeModal();else if(action==='confirm')confirm();else if(action==='demo')demoModal();else if(action.startsWith('demo-'))demoAction(action,id);else openAction(action,id);
});
document.addEventListener('change',event=>{if(event.target.id==='review-role'&&roles[event.target.value]){closeModal();state.role=event.target.value;render();}if(event.target.id==='data-mode'){const v=event.target.value;if(['normal','empty','loading','unavailable'].includes(v)){closeModal();state.dataMode=v;render();}}});
document.addEventListener('keydown',event=>{if(!state.modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const controls=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(el=>!el.disabled);const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1)||'/dashboard';if(state.route!==route){closeModal();dismissToast();state.route=route;state.filter={};render();}});
window.__onecallOps={routes:clone(routes),snapshot:()=>clone({...state,modal:undefined,toastTimer:undefined}),go,setReviewRole:role=>{if(roles[role]){closeModal();state.role=role;render();}},setReviewDataMode:mode=>{if(['normal','empty','loading','unavailable'].includes(mode)){closeModal();state.dataMode=mode;render();}}};
state.route=location.hash.slice(1)||'/dashboard';render();
})();
</script>
</body>
