<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>平台员工登录 · 一通话运营后台</title>
  <style>
    :root{
      color-scheme:light;
      --brand:#315b88;--brand-strong:#24486e;--brand-soft:#eaf1f7;
      --ink:#1f2b38;--muted:#667482;--line:#d8e0e7;--line-strong:#bac7d2;
      --canvas:#f3f6f8;--panel:#fff;--sidebar:#162533;--sidebar-2:#20384d;
      --success:#1f7656;--success-bg:#e9f5ef;--warning:#95610d;--warning-bg:#fff5dd;
      --danger:#aa3d43;--danger-bg:#faecee;--info:#356b99;--info-bg:#eaf2f8;
      --shadow:0 8px 24px rgba(29,49,67,.08);--radius:7px;
      font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;
    }
    *{box-sizing:border-box;letter-spacing:0}
    html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink)}
    button,input,select,textarea{font:inherit;letter-spacing:0}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.5}
    svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .hidden{display:none!important}.mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}.danger-text{color:var(--danger)}.success-text{color:var(--success)}
    .btn{min-height:40px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--ink);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
    .btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-strong)}
    .btn.danger{border-color:#dfb3b6;color:var(--danger);background:#fff}.btn.ghost{border-color:transparent;background:transparent}
    .icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
    .input,.select,textarea{width:100%;min-height:40px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--ink);padding:9px 11px;outline:none}
    .input:focus,.select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,91,136,.12)}
    textarea{min-height:88px;resize:vertical}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700}.field-hint{font-size:12px;color:var(--muted);line-height:1.55}
    .login-shell{min-height:100vh;display:grid;grid-template-columns:minmax(320px,560px) minmax(440px,1fr);background:#fff}
    .login-brand{background:var(--sidebar);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}
    .brand-lockup{display:flex;align-items:center;gap:14px}.brand-lockup img{width:44px;height:44px}.brand-lockup strong{font-size:21px}.brand-lockup span{display:block;margin-top:3px;color:#b8c9d7;font-size:13px}
    .login-brand h1{max-width:460px;font-size:36px;line-height:1.28;margin:0 0 18px}.login-brand p{max-width:480px;line-height:1.8;color:#c8d6e1;margin:0}
    .security-list{display:grid;gap:12px;margin-top:30px}.security-item{display:flex;align-items:flex-start;gap:10px;color:#d9e4ec;font-size:14px}.security-item svg{color:#8fb7d9;margin-top:2px}
    .login-main{padding:40px clamp(36px,7vw,110px);display:flex;align-items:center;justify-content:center}.login-panel{width:min(430px,100%)}
    .login-panel h2{font-size:26px;margin:0 0 8px}.login-panel>p{color:var(--muted);line-height:1.7;margin:0 0 28px}
    .form-stack{display:grid;gap:17px}.login-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:8px}
    .check-line{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.55;color:var(--muted)}.check-line input{margin-top:3px}
    .review-box{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}.review-box summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
    .review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);position:fixed;left:252px;right:0;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 22px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--sidebar);color:#eaf0f4;z-index:30;display:flex;flex-direction:column;overflow:hidden}
    .sidebar-brand{height:64px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.1)}.sidebar-brand img{width:32px;height:32px}
    .sidebar-brand strong{font-size:16px}.sidebar-brand small{display:block;color:#9eb1c0;margin-top:2px}
    .nav{padding:14px 10px 30px;overflow:auto;flex:1}.nav-label{font-size:11px;color:#7991a5;text-transform:uppercase;padding:16px 10px 7px;font-weight:700}
    .nav-item{width:100%;border:0;background:transparent;color:#c6d3dd;min-height:42px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0}
    .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}.nav-item.active{background:var(--sidebar-2);color:#fff;box-shadow:inset 3px 0 0 #82acd0}
    .nav-item .nav-copy{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item .count{margin-left:auto;background:#2e526e;border-radius:10px;padding:2px 7px;font-size:11px}
    .sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#91a6b6;line-height:1.5}
    .topbar .crumb{display:flex;align-items:center;gap:8px;min-width:0}.topbar .crumb strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-search{width:min(360px,34vw);position:relative;margin-left:12px}.top-search svg{position:absolute;left:11px;top:11px;color:var(--muted)}.top-search input{padding-left:38px}
    .top-spacer{flex:1}.scope-chip{height:36px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand-strong);border-radius:6px;padding:0 11px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
    .avatar{width:34px;height:34px;background:var(--sidebar);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
    .main{margin-left:252px;padding:88px 24px 36px;min-height:100vh}.content{max-width:1560px;margin:0 auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.page-head h1{font-size:24px;line-height:1.25;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);line-height:1.6;max-width:820px}
    .head-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .banner{border:1px solid #b9cddd;background:#edf4f8;color:#244b6c;border-radius:var(--radius);padding:12px 15px;display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;line-height:1.55;font-size:13px}.banner.warning{background:var(--warning-bg);border-color:#ecd39b;color:#744d0d}.banner.danger{background:var(--danger-bg);border-color:#e5b8bc;color:#7b2f34}.banner.success{background:var(--success-bg);border-color:#abd5c3;color:#155a41}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-height:112px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.metric-value{font-size:27px;font-weight:750;margin:12px 0 4px}.metric-foot{font-size:12px;color:var(--muted)}
    .grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr);gap:18px}.grid-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,39,55,.03);overflow:hidden}.panel+.panel{margin-top:16px}
    .panel-head{min-height:58px;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}.panel-head h2{font-size:16px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:4px 0 0}.panel-body{padding:16px}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:14px}.toolbar .search{min-width:230px;flex:1}.toolbar .select{width:auto;min-width:140px}
    .table-wrap{width:100%;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #e7ecf0;font-size:13px;vertical-align:middle}th{background:#f6f8fa;color:#556574;font-size:12px;font-weight:750;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f9fbfc}.cell-title{font-weight:700;color:var(--ink)}.cell-sub{color:var(--muted);font-size:12px;margin-top:4px}
    .status{display:inline-flex;align-items:center;gap:6px;min-height:25px;border-radius:4px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:#eef2f5;color:#52616e}.status.success{background:var(--success-bg);color:var(--success)}.status.warning{background:var(--warning-bg);color:var(--warning)}.status.danger{background:var(--danger-bg);color:var(--danger)}.status.info{background:var(--info-bg);color:var(--info)}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .link-button{border:0;background:transparent;color:var(--brand);padding:5px;font-weight:700}.link-button:hover{text-decoration:underline}
    .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{border:0;background:transparent;padding:11px 14px;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
    .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}.meta{padding:11px 0;border-bottom:1px solid #edf0f2;display:grid;grid-template-columns:118px 1fr;gap:12px;font-size:13px}.meta dt{color:var(--muted)}.meta dd{margin:0;min-width:0;word-break:break-word}
    .timeline{display:grid}.event{position:relative;padding:0 0 20px 28px;min-height:55px}.event:before{content:"";position:absolute;left:7px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}.event:after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line)}.event:last-child:after{display:none}.event strong{display:block;font-size:13px}.event p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.event time{display:block;margin-top:5px;color:#84919c;font-size:11px}
    .split-state{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.state-track{border-left:3px solid var(--line);padding:3px 0 3px 12px}.state-track.success{border-color:var(--success)}.state-track.warning{border-color:var(--warning)}.state-track strong{font-size:12px}.state-track span{display:block;margin-top:6px;font-size:13px}
    .empty{min-height:280px;display:grid;place-items:center;text-align:center;padding:35px}.empty svg{width:34px;height:34px;color:#91a0ad}.empty h2{font-size:18px;margin:13px 0 7px}.empty p{color:var(--muted);max-width:620px;line-height:1.7;margin:0}
    .placeholder{border:1px dashed var(--line-strong);background:#f9fbfc;border-radius:var(--radius);padding:28px}.placeholder h2{margin:0 0 8px;font-size:18px}.placeholder ul{color:var(--muted);line-height:1.8;padding-left:20px}
    .sensitive-session{border:1px solid #d2a2a7;background:#fff7f7;border-radius:var(--radius);padding:14px;position:relative;overflow:hidden}.sensitive-session:after{content:"原型虚构数据 · 临时访问";position:absolute;right:-40px;top:38px;transform:rotate(26deg);font-size:14px;color:rgba(170,61,67,.16);font-weight:800}.session-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.revealed-value{font-family:"Cascadia Mono",Consolas,monospace;font-weight:700;position:relative;z-index:1}
    .modal-backdrop{position:fixed;inset:0;background:rgba(14,27,38,.54);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}.modal{width:min(640px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:8px;box-shadow:0 22px 60px rgba(0,0,0,.22)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal-head h2{font-size:18px;margin:0}.modal-head p{font-size:13px;color:var(--muted);line-height:1.55;margin:5px 0 0}.modal-body{padding:20px;display:grid;gap:16px}.modal-actions{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.confirm-item{background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:11px}.confirm-item span{display:block;color:var(--muted);font-size:11px}.confirm-item strong{display:block;margin-top:5px;font-size:13px;word-break:break-word}
    .toast{position:fixed;right:22px;bottom:22px;z-index:100;background:#1e3344;color:#fff;border-radius:6px;padding:13px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:390px;font-size:13px}
    .review-strip{position:fixed;left:270px;bottom:16px;z-index:45;background:#fff;border:1px solid var(--line-strong);border-radius:7px;box-shadow:var(--shadow);padding:8px;display:flex;align-items:center;gap:8px}.review-strip label{font-size:11px;color:var(--muted);font-weight:700}.review-strip .select{width:auto;min-width:142px;min-height:34px;padding:5px 9px;font-size:12px}
    .approval-chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.approval-node{padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:12px}.approval-arrow{color:var(--muted)}
    @media(max-width:1180px){
      .sidebar{width:76px}.sidebar-brand{justify-content:center;padding:0}.sidebar-brand div,.nav-label,.nav-copy,.nav-item .count,.sidebar-foot{display:none}.nav-item{justify-content:center;padding:0}.topbar{left:76px}.main{margin-left:76px}.review-strip{left:92px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:900px){.login-shell{grid-template-columns:1fr}.login-brand{display:none}.grid-2,.grid-even{grid-template-columns:1fr}.top-search{display:none}.meta-grid{grid-template-columns:1fr}.split-state{grid-template-columns:1fr}.review-strip{right:16px;left:auto}.scope-chip span{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>

    function matchRoute(path){

      }

    document.addEventListener('click',function(event){

      var actionEl=event.target.closest('[data-action]');
      if(!actionEl)return;
      var action=actionEl.getAttribute('data-action');
      if(action==='login'){
        var otp=document.getElementById('staff-otp');var agree=document.getElementById('staff-agree');
        if(!agree.checked||otp.value!=='482916'){toast('请完成协议确认并输入有效二次验证码');return;}
        state.loggedIn=true;go(roles[state.role].initial);return;
      }
      if(action==='logout'){state.loggedIn=false;state.accessGrant=null;state.modal=null;location.hash='/login';render();return;}
      if(action==='close-modal'){state.modal=null;renderModal();return;}
      if(action==='toast'){toast(actionEl.getAttribute('data-message')||'操作已记录');return;}
      if(action==='batch-claim'){toast('已领取 2 个符合当前范围的工单，1 个因队列变更被跳过');return;}
      if(action==='request-access'){
        var accessKind=actionEl.getAttribute('data-kind');var accessObject=actionEl.getAttribute('data-object');
        if(!canSensitiveAccess(accessKind)){
          addEvent('SensitiveAccessDenied',accessObject||'unknown','角色无该内容权限','-');toast('当前角色无权申请该类敏感内容访问');return;
        }
        state.modal={type:'access',step:'request',objectId:accessObject,kind:accessKind,route:state.route};renderModal();return;
      }
      if(action==='access-submit'){
        var ticket=document.getElementById('access-ticket').value.trim();var reason=document.getElementById('access-reason').value.trim();
        if(!ticket||!reason){toast('工单和必要性说明不能为空');return;}
        state.modal.step='approval';addEvent('SensitiveAccessRequested',state.modal.objectId,'待独立审批',ticket);renderModal();return;
      }
      if(action==='access-approve'){state.modal.step='otp';addEvent('SensitiveAccessApproved',state.modal.objectId,'一次签发授权','TKT-10431');renderModal();return;}
      if(action==='access-verify'){
        var code=document.getElementById('access-otp').value.trim();
        if(code!=='482916'){document.getElementById('otp-error').innerHTML='<div class="banner danger">'+icon('alert')+'<span>二次验证失败，未签发访问会话。</span></div>';addEvent('SensitiveAccessVerificationFailed',state.modal.objectId,'拒绝','TKT-10431');return;}

      }
      if(action==='open-command'){
        state.modal={type:'command',step:'request',command:actionEl.getAttribute('data-command'),objectId:actionEl.getAttribute('data-object')};renderModal();return;
      }
      if(action==='command-submit'){
        if(state.modal.command==='call-correction'||state.modal.command==='release-quarantine'){state.modal.step='approval';renderModal();}else executeCommand();
        return;
      }
      if(action==='command-approve'){executeCommand();return;}
    });
    document.addEventListener('change',function(event){
      if(event.target.id==='login-role'){state.role=event.target.value;render();return;}
      if(event.target.id==='login-scenario'){state.scenario=event.target.value;render();return;}
      if(event.target.id==='review-role'){
        state.role=event.target.value;state.accessGrant=null;state.modal=null;var next=roles[state.role].initial;location.hash=next;render();return;
      }
    });
    window.addEventListener('hashchange',render);
    window.__onecallOps={state:state,routes:routeDefs,roles:roles,go:go,render:render};
    render();
  })();
  </script>
</body>
</html>
