onecall:
  activation-command:
    enabled: ${ONECALL_ACTIVATION_COMMAND_ENABLED:false}
    datasource:
      url: ${ONECALL_ACTIVATION_COMMAND_DB_URL:}
      username: ${ONECALL_ACTIVATION_COMMAND_DB_USERNAME:}
      password: ${ONECALL_ACTIVATION_COMMAND_DB_PASSWORD:}
  subject-claim-command:
    enabled: ${ONECALL_SUBJECT_CLAIM_COMMAND_ENABLED:false}
    datasource:
      url: ${ONECALL_SUBJECT_CLAIM_COMMAND_DB_URL:}
      username: ${ONECALL_SUBJECT_CLAIM_COMMAND_DB_USERNAME:}
      password: ${ONECALL_SUBJECT_CLAIM_COMMAND_DB_PASSWORD:}
  persistence:
    url: ${ONECALL_DB_URL:}
    username: ${ONECALL_DB_USERNAME:}
    password: ${ONECALL_DB_PASSWORD:}
  sharing-command:
    datasource:
      url: ${ONECALL_SHARING_COMMAND_DB_URL:}
      username: ${ONECALL_SHARING_COMMAND_DB_USERNAME:}
      password: ${ONECALL_SHARING_COMMAND_DB_PASSWORD:}
logging:
  level:
    org.jooq: 'OFF'
    com.zaxxer.hikari: 'OFF'
