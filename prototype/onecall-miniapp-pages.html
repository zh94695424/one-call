<div id="onecall-pages" class="viz-dotted-background">
  <style>
    #onecall-pages {
      --oc-blue: #2468f2;
      --oc-blue-deep: #1857cf;
      --oc-blue-soft: #edf4ff;
      --oc-page: #f7f9fc;
      --oc-white: #ffffff;
      --oc-ink: #1a1a1a;
      --oc-body: #667085;
      --oc-soft: #98a2b3;
      --oc-line: #dce4ee;
      --oc-success: #16845b;
      --oc-success-soft: #edf8f3;
      --oc-warning: #9a6700;
      --oc-warning-soft: #fff8e7;
      --oc-danger: #c53b47;
      --oc-danger-soft: #fff1f2;
      min-height: 970px;
      padding: 34px 18px 30px;
      display: flex;
      justify-content: center;
      color: var(--oc-ink);
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #onecall-pages * {
      box-sizing: border-box;
    }

    #onecall-pages button,
    #onecall-pages input {
      font: inherit;
      letter-spacing: 0;
    }

    #onecall-pages [hidden] {
      display: none !important;
    }

    #onecall-pages .suite {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: 210px minmax(0, 393px);
      align-items: start;
      justify-content: center;
      gap: 26px;
    }

    #onecall-pages .screen-index {
      padding-top: 4px;
    }

    #onecall-pages .index-title {
      margin: 0;
      color: light-dark(#1a1a1a, #f4f6f8);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-pages .index-meta {
      margin: 5px 0 18px;
      color: light-dark(#6b7280, #aab3c0);
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .index-group + .index-group {
      margin-top: 16px;
    }

    #onecall-pages .index-label {
      margin: 0 0 6px;
      color: light-dark(#98a2b3, #7f8997);
      font-size: 11px;
      line-height: 16px;
      font-weight: 500;
      letter-spacing: 0;
    }

    #onecall-pages .index-items {
      display: grid;
      gap: 3px;
    }

    #onecall-pages .index-button {
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: light-dark(#596579, #c6cdd7);
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
      text-align: left;
    }

    #onecall-pages .index-button[aria-current="page"] {
      background: light-dark(#edf4ff, #17294b);
      color: light-dark(#1857cf, #8eb3ff);
      font-weight: 500;
    }

    #onecall-pages .index-button svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      stroke-width: 1.8;
    }

    #onecall-pages .phone {
      width: 393px;
      height: 852px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--oc-page);
      color: var(--oc-ink);
      border: 1px solid #e4e9ef;
      border-radius: 8px;
    }

    #onecall-pages .status-bar {
      height: 44px;
      flex: 0 0 44px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--oc-white);
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    #onecall-pages .status-icons,
    #onecall-pages .capsule,
    #onecall-pages .app-left,
    #onecall-pages .inline,
    #onecall-pages .state,
    #onecall-pages .row-main,
    #onecall-pages .bottom-item,
    #onecall-pages .trust-item {
      display: flex;
      align-items: center;
    }

    #onecall-pages .status-icons {
      gap: 5px;
      color: #273445;
    }

    #onecall-pages .status-icons svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    #onecall-pages .app-bar {
      height: 52px;
      flex: 0 0 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--oc-white);
    }

    #onecall-pages .app-left {
      min-width: 0;
      gap: 8px;
    }

    #onecall-pages .back-button {
      width: 36px;
      height: 36px;
      margin-left: -9px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #273445;
    }

    #onecall-pages .back-button svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.8;
    }

    #onecall-pages .app-title {
      margin: 0;
      overflow: hidden;
      color: var(--oc-ink);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0;
    }

    #onecall-pages .capsule {
      width: 86px;
      height: 32px;
      flex: 0 0 86px;
      justify-content: space-evenly;
      border: 1px solid #dbe1e8;
      border-radius: 16px;
      color: #1f2937;
    }

    #onecall-pages .capsule svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    #onecall-pages .capsule-divider {
      width: 1px;
      height: 18px;
      background: #e4e8ee;
    }

    #onecall-pages .screen {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: var(--oc-page);
    }

    #onecall-pages .screen::-webkit-scrollbar {
      display: none;
    }

    #onecall-pages .screen-pad {
      min-height: 100%;
      padding: 18px 16px 24px;
      display: flex;
      flex-direction: column;
    }

    #onecall-pages .eyebrow {
      margin: 0 0 6px;
      color: var(--oc-blue);
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: 0;
    }

    #onecall-pages .page-heading {
      margin: 0;
      color: var(--oc-ink);
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-pages .page-lead {
      margin: 8px 0 0;
      color: var(--oc-body);
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .section-title {
      margin: 20px 0 9px;
      color: var(--oc-ink);
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-pages .section-title.first {
      margin-top: 0;
    }

    #onecall-pages .section-title.has-lead {
      margin-bottom: 0;
    }

    #onecall-pages .section-lead {
      margin: 4px 0 10px;
      color: var(--oc-body);
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .micro {
      color: var(--oc-soft);
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .surface {
      padding: 14px;
      border: 1px solid var(--oc-line);
      border-radius: 8px;
      background: var(--oc-white);
    }

    #onecall-pages .surface + .surface {
      margin-top: 10px;
    }

    #onecall-pages .notice {
      margin-top: 14px;
      padding: 12px 13px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border-radius: 8px;
      background: var(--oc-blue-soft);
      color: #375071;
      font-size: 12px;
      line-height: 19px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .notice svg {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      margin-top: 1px;
      color: var(--oc-blue);
      stroke-width: 1.8;
    }

    #onecall-pages .progress-steps {
      margin: 4px 0 18px;
    }

    #onecall-pages .progress-head {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--oc-body);
      font-size: 12px;
      line-height: 18px;
    }

    #onecall-pages .progress-head strong {
      flex: 0 0 auto;
      color: var(--oc-blue);
      font-weight: 600;
    }

    #onecall-pages .progress-track {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    #onecall-pages .progress-step {
      height: 4px;
      border-radius: 2px;
      background: #e8edf3;
    }

    #onecall-pages .progress-step.done,
    #onecall-pages .progress-step.current {
      background: var(--oc-blue);
    }

    #onecall-pages .step-list {
      margin-top: 18px;
      border-top: 1px solid var(--oc-line);
    }

    #onecall-pages .step-row {
      padding: 13px 0;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      border-bottom: 1px solid var(--oc-line);
    }

    #onecall-pages .step-num {
      color: var(--oc-blue);
      font-size: 12px;
      line-height: 20px;
      font-weight: 600;
    }

    #onecall-pages .step-copy strong {
      display: block;
      color: var(--oc-ink);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    #onecall-pages .step-copy span {
      display: block;
      margin-top: 3px;
      color: var(--oc-body);
      font-size: 12px;
      line-height: 19px;
      font-weight: 400;
    }

    #onecall-pages .field {
      margin-top: 15px;
    }

    #onecall-pages .field label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }

    #onecall-pages .input-wrap {
      height: 48px;
      display: flex;
      align-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: var(--oc-white);
    }

    #onecall-pages .input-wrap input {
      min-width: 0;
      height: 100%;
      flex: 1;
      padding: 0 13px;
      border: 0;
      background: transparent;
      color: var(--oc-ink);
      font-size: 15px;
      line-height: 22px;
      outline: 0;
    }

    #onecall-pages .input-action {
      min-width: 92px;
      height: 36px;
      margin-right: 5px;
      border: 0;
      border-left: 1px solid var(--oc-line);
      background: transparent;
      color: var(--oc-blue);
      font-size: 13px;
      font-weight: 500;
    }

    #onecall-pages .verification-choice {
      width: 100%;
      min-height: 76px;
      margin-top: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #8fb0f8;
      border-radius: 8px;
      background: #f6f9ff;
      color: var(--oc-ink);
      text-align: left;
    }

    #onecall-pages .verification-choice .row-main {
      align-items: flex-start;
    }

    #onecall-pages .verification-choice .row-icon {
      background: var(--oc-blue);
      color: #ffffff;
    }

    #onecall-pages .verification-choice .row-copy strong,
    #onecall-pages .verification-choice .row-copy span {
      white-space: normal;
    }

    #onecall-pages .method-divider {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--oc-soft);
      font-size: 11px;
      line-height: 17px;
    }

    #onecall-pages .method-divider::before,
    #onecall-pages .method-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--oc-line);
    }

    #onecall-pages .verified-number {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #b8d9ca;
      border-radius: 8px;
      background: var(--oc-success-soft);
    }

    #onecall-pages .verified-number strong,
    #onecall-pages .verified-number span {
      display: block;
    }

    #onecall-pages .verified-number strong {
      margin-top: 8px;
      color: var(--oc-ink);
      font-size: 20px;
      line-height: 27px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    #onecall-pages .verified-number > span {
      margin-top: 5px;
      color: var(--oc-body);
      font-size: 12px;
      line-height: 19px;
    }

    #onecall-pages .field-help {
      margin: 6px 0 0;
      color: var(--oc-soft);
      font-size: 11px;
      line-height: 17px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .check-list {
      margin-top: 16px;
      border-top: 1px solid var(--oc-line);
    }

    #onecall-pages .check-row {
      min-height: 58px;
      padding: 11px 0;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      border-bottom: 1px solid var(--oc-line);
    }

    #onecall-pages .check-box {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--oc-blue);
      color: #ffffff;
    }

    #onecall-pages .check-box svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.3;
    }

    #onecall-pages .check-copy {
      color: #475467;
      font-size: 12px;
      line-height: 19px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-pages .consent-input {
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      accent-color: var(--oc-blue);
    }

    #onecall-pages .authorization-summary {
      margin-top: 16px;
      border-top: 1px solid var(--oc-line);
      border-bottom: 1px solid var(--oc-line);
    }

    #onecall-pages .authorization-item {
      padding: 12px 0;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
    }

    #onecall-pages .authorization-item + .authorization-item {
      border-top: 1px solid var(--oc-line);
    }

    #onecall-pages .authorization-item > svg {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      color: var(--oc-blue);
      stroke-width: 1.8;
    }

    #onecall-pages .authorization-item strong,
    #onecall-pages .authorization-item span {
      display: block;
    }

    #onecall-pages .authorization-item strong {
      color: var(--oc-ink);
      font-size: 13px;
      line-height: 19px;
      font-weight: 600;
    }

    #onecall-pages .authorization-item span {
      margin-top: 3px;
      color: var(--oc-body);
      font-size: 12px;
      line-height: 19px;
    }

    #onecall-pages .compact-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #onecall-pages .compact-list li {
      padding-left: 16px;
      position: relative;
      color: #475467;
      font-size: 12px;
      line-height: 19px;
    }

    #onecall-pages .compact-list li + li {
      margin-top: 7px;
    }

    #onecall-pages .compact-list li::before {
      content: "";
      width: 5px;
      height: 5px;
      position: absolute;
      top: 7px;
      left: 1px;
      border-radius: 50%;
      background: var(--oc-blue);
    }

    #onecall-pages .disclosure-list {
      margin-top: 16px;
      border-top: 1px solid var(--oc-line);
      border-bottom: 1px solid var(--oc-line);
    }

    #onecall-pages .disclosure + .disclosure {
      border-top: 1px solid var(--oc-line);
    }

    #onecall-pages .disclosure summary {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      list-style: none;
      color: var(--oc-ink);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    #onecall-pages .disclosure summary::-webkit-details-marker {
      display: none;
    }

    #onecall-pages .disclosure-action {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      color: var(--oc-blue);
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    #onecall-pages .disclosure-action .collapse-label {
      display: none;
    }

    #onecall-pages .disclosure[open] .disclosure-action .expand-label {
      display: none;
    }

    #onecall-pages .disclosure[open] .disclosure-action .collapse-label {
      display: inline;
    }

    #onecall-pages .disclosure summary svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      stroke-width: 1.8;
    }

    #onecall-pages .disclosure[open] summary svg {
      transform: rotate(180deg);
    }

    #onecall-pages .disclosure-body {
      padding: 0 0 14px;
    }

    #onecall-pages .spacer {
      min-height: 18px;
      flex: 1;
    }

    #onecall-pages .primary-action,
    #onecall-pages .secondary-action {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    #onecall-pages .primary-action {
      border: 1px solid var(--oc-blue);
      background: var(--oc-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(36, 104, 242, 0.08);
    }

    #onecall-pages .primary-action:active {
      border-color: var(--oc-blue-deep);
      background: var(--oc-blue-deep);
    }

    #onecall-pages .primary-action:disabled {
      border-color: #dbe2ec;
      background: #e9edf3;
      color: #98a2b3;
      box-shadow: none;
    }

    #onecall-pages .secondary-action {
      border: 1px solid #b9c9dc;
      background: var(--oc-white);
      color: var(--oc-blue);
      font-weight: 500;
    }

    #onecall-pages .primary-action + .secondary-action,
    #onecall-pages .secondary-action + .primary-action {
      margin-top: 10px;
    }

    #onecall-pages .button-note {
      margin: 8px 0 0;
      color: var(--oc-soft);
      font-size: 11px;
      line-height: 17px;
      text-align: center;
      letter-spacing: 0;
    }

    #onecall-pages .upgrade-action {
      width: 100%;
      min-height: 64px;
      margin-top: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #9fbdf5;
      border-radius: 12px;
      background: #f4f8ff;
      color: var(--oc-blue-deep);
      text-align: left;
      box-shadow: 0 4px 12px rgba(36, 104, 242, 0.06);
    }

    #onecall-pages .upgrade-action:active {
      border-color: var(--oc-blue);
      background: #eaf2ff;
    }

    #onecall-pages .upgrade-action-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #e4eeff;
      color: var(--oc-blue);
    }

    #onecall-pages .upgrade-action-icon > svg,
    #onecall-pages .upgrade-action > svg {
      width: 18px;
      height: 18px;
    }

    #onecall-pages .upgrade-action-copy {
      min-width: 0;
      flex: 1;
    }

    #onecall-pages .upgrade-action-copy strong,
    #onecall-pages .upgrade-action-copy span {
      display: block;
    }

    #onecall-pages .upgrade-action-copy strong {
      color: #1749a6;
      font-size: 15px;
      line-height: 21px;
      font-weight: 600;
    }

    #onecall-pages .upgrade-action-copy span {
      margin-top: 2px;
      color: #5b6f90;
      font-size: 11px;
      line-height: 17px;
      font-weight: 400;
    }

    #onecall-pages .free-evidence-status {
      margin: 12px 0 2px;
      padding: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #dbe7f8;
      border-bottom: 1px solid #dbe7f8;
      color: var(--oc-body);
    }

    #onecall-pages .free-evidence-status > svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: var(--oc-blue);
    }

    #onecall-pages .free-evidence-copy {
      min-width: 0;
      flex: 1;
    }

    #onecall-pages .free-evidence-copy strong,
    #onecall-pages .free-evidence-copy span {
      display: block;
    }

    #onecall-pages .free-evidence-copy strong {
      color: var(--oc-ink);
      font-size: 13px;
      line-height: 19px;
      font-weight: 600;
    }

    #onecall-pages .free-evidence-copy span {
      margin-top: 2px;
      color: var(--oc-body);
      font-size: 11px;
      line-height: 17px;
      font-weight: 400;
    }

    #onecall-pages .free-evidence-balance {
      flex: 0 0 auto;
      color: var(--oc-blue);
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    #onecall-pages .free-evidence-status.exhausted > svg,
    #onecall-pages .free-evidence-status.exhausted .free-evidence-balance {
      color: var(--oc-soft);
    }

    #onecall-pages .hero-mark {
      width: 70px;
      height: 70px;
      margin: 16px auto 13px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--oc-blue-soft);
      color: var(--oc-blue);
    }

    #onecall-pages .hero-mark.success {
      background: var(--oc-success-soft);
