<div id="onecall-empty-preview" class="viz-dotted-background">
  <style>
    #onecall-empty-preview {
      --oc-blue: #2468f2;
      --oc-blue-pressed: #1857cf;
      --oc-ink: #1a1a1a;
      --oc-body: #6b7280;
      --oc-soft: #9ca3af;
      --oc-line: #afc2d6;
      --oc-border: #cbd7e5;
      --oc-strip: #f5f6f8;
      --oc-page: #ffffff;
      --oc-nav: #7b8ba1;
      min-height: 940px;
      padding: 56px 18px 32px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #onecall-empty-preview * {
      box-sizing: border-box;
    }

    #onecall-empty-preview .phone {
      width: min(393px, 100%);
      height: 852px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--oc-page);
      color: var(--oc-ink);
      border: 1px solid #e7ebf0;
      border-radius: 8px;
    }

    #onecall-empty-preview .status-bar {
      height: 44px;
      flex: 0 0 44px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-empty-preview .status-icons,
    #onecall-empty-preview .capsule,
    #onecall-empty-preview .trust-item,
    #onecall-empty-preview .tab-item {
      display: flex;
      align-items: center;
    }

    #onecall-empty-preview .status-icons {
      gap: 5px;
      color: #273445;
    }

    #onecall-empty-preview .status-icons svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    #onecall-empty-preview .app-bar {
      height: 52px;
      flex: 0 0 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #onecall-empty-preview .app-title {
      margin: 0;
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-empty-preview .capsule {
      width: 86px;
      height: 32px;
      justify-content: space-evenly;
      border: 1px solid #dbe1e8;
      border-radius: 16px;
      color: #1f2937;
    }

    #onecall-empty-preview .capsule-divider {
      width: 1px;
      height: 18px;
      background: #e4e8ee;
    }

    #onecall-empty-preview .capsule svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    #onecall-empty-preview .page-content {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #onecall-empty-preview .empty-state {
      min-height: 0;
      flex: 1;
      padding: 20px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #onecall-empty-preview .illustration {
      position: relative;
      width: 160px;
      height: 160px;
      flex: 0 0 160px;
      display: grid;
      place-items: center;
      color: var(--oc-line);
    }

    #onecall-empty-preview .archive-mark svg {
      width: 112px;
      height: 112px;
      stroke-width: 1.25;
    }

    #onecall-empty-preview .lock-mark {
      position: absolute;
      right: 26px;
      bottom: 29px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--oc-page);
      border: 1px solid #d9e4ef;
      border-radius: 50%;
    }

    #onecall-empty-preview .lock-mark svg {
      width: 23px;
      height: 23px;
      stroke-width: 1.4;
    }

    #onecall-empty-preview .empty-title {
      margin: 18px 0 0;
      color: var(--oc-ink);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-empty-preview .empty-description {
      max-width: 328px;
      margin: 10px 0 0;
      color: var(--oc-body);
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-empty-preview .empty-emotion {
      margin: 8px 0 0;
      color: var(--oc-soft);
      font-size: 13px;
      line-height: 19px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-empty-preview .actions {
      flex: 0 0 auto;
      padding: 10px 20px 24px;
    }

    #onecall-empty-preview .action-button {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: 0;
    }

    #onecall-empty-preview .primary-action {
      color: #ffffff;
      background: var(--oc-blue);
      border: 1px solid var(--oc-blue);
      box-shadow: 0 4px 12px rgba(36, 104, 242, 0.08);
    }

    #onecall-empty-preview .primary-action:active {
      background: var(--oc-blue-pressed);
      border-color: var(--oc-blue-pressed);
    }

    #onecall-empty-preview .action-note {
      margin: 8px 0 0;
      color: var(--oc-soft);
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
      text-align: center;
      letter-spacing: 0;
    }

    #onecall-empty-preview .secondary-action {
      margin-top: 14px;
      color: var(--oc-blue);
      background: #ffffff;
      border: 1px solid #bbcae0;
      font-weight: 500;
    }

    #onecall-empty-preview .trust-strip {
      height: 44px;
      flex: 0 0 44px;
      padding: 0 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      background: var(--oc-strip);
      color: #7b8491;
    }

    #onecall-empty-preview .trust-item {
      min-width: 0;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-empty-preview .trust-item svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      stroke-width: 1.6;
    }

    #onecall-empty-preview .tab-bar {
      height: 76px;
      flex: 0 0 76px;
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: start;
      padding: 9px 10px 18px;
      border-top: 1px solid #eef1f5;
      background: #ffffff;
    }

    #onecall-empty-preview .tab-item {
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      color: var(--oc-nav);
      font-size: 11px;
      line-height: 15px;
      font-weight: 400;
      letter-spacing: 0;
    }

    #onecall-empty-preview .tab-item.active {
      color: var(--oc-blue);
      font-weight: 500;
    }

    #onecall-empty-preview .tab-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.7;
    }

    #onecall-empty-preview .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 116px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: #1f2937;
    }

    @media (max-width: 430px) {
      #onecall-empty-preview {
        min-height: auto;
        padding: 0;
      }

      #onecall-empty-preview .phone {
        width: 100%;
        height: 812px;
        border: 0;
        border-radius: 0;
      }

      #onecall-empty-preview .empty-state {
        padding-top: 8px;
      }

      #onecall-empty-preview .illustration {
        width: 148px;
        height: 148px;
        flex-basis: 148px;
      }
    }
  </style>

  <section class="phone" aria-label="一通话证据箱空状态页面预览">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
        <i data-lucide="signal"></i>
        <i data-lucide="wifi"></i>
        <i data-lucide="battery-full"></i>
      </span>
    </div>

    <header class="app-bar">
      <h1 class="app-title">证据箱</h1>
      <div class="capsule" aria-label="微信小程序菜单">
        <i data-lucide="ellipsis" aria-hidden="true"></i>
        <span class="capsule-divider" aria-hidden="true"></span>
        <i data-lucide="circle" aria-hidden="true"></i>
      </div>
    </header>

    <main class="page-content">
      <section class="empty-state" aria-labelledby="empty-title">
        <div class="illustration" aria-hidden="true">
          <span class="archive-mark"><i data-lucide="archive"></i></span>
          <span class="lock-mark"><i data-lucide="lock-keyhole"></i></span>
        </div>
        <h2 id="empty-title" class="empty-title">证据箱是空的</h2>
        <p class="empty-description">通话、录音、照片存进来会自动加时间戳并加密，<br>需要时可直接出证</p>
        <p class="empty-emotion">希望你永远用不上</p>
      </section>

      <section class="actions" aria-label="证据箱操作">
        <button class="action-button primary-action" type="button">打一通取证电话</button>
        <p class="action-note">通话全程自动录音并生成存证记录</p>
        <button class="action-button secondary-action" type="button">导入已有证据</button>
      </section>

      <aside class="trust-strip" aria-label="证据能力说明">
        <span class="trust-item"><i data-lucide="shield-check" aria-hidden="true"></i><span>本地加密</span></span>
        <span class="trust-item"><i data-lucide="stamp" aria-hidden="true"></i><span>时间戳防篡改</span></span>
        <span class="trust-item"><i data-lucide="file-check-2" aria-hidden="true"></i><span>支持出证</span></span>
      </aside>
    </main>

    <nav class="tab-bar" aria-label="主导航">
      <span class="tab-item"><i data-lucide="phone-call" aria-hidden="true"></i><span>取证</span></span>
      <span class="tab-item active" aria-current="page"><i data-lucide="archive" aria-hidden="true"></i><span>证据箱</span></span>
      <span class="tab-item"><i data-lucide="file-check-2" aria-hidden="true"></i><span>出证</span></span>
      <span class="tab-item"><i data-lucide="user-round" aria-hidden="true"></i><span>我的</span></span>
      <span class="home-indicator" aria-hidden="true"></span>
    </nav>
  </section>
</div>
