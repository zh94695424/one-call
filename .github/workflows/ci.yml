          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          import struct
          import zipfile

          def parse_coordinates(text):
              result = []
              for line in text.splitlines():
                  if not line.strip() or line.strip() == "The following files have been resolved:":
                      continue
                  fields = line.strip().split()[0].split(":")
                  if len(fields) == 5:
                      group, artifact, kind, version, scope = fields
                      classifier = ""
                  elif len(fields) == 6:
                      group, artifact, kind, fourth, fifth, scope = fields
                      if fifth == "":
                          version, classifier = fourth, ""
                      else:
                          classifier, version = fourth, fifth
                  else:
                      raise ValueError("malformed coordinate evidence")
                  if (not all(re.fullmatch(r"[A-Za-z0-9_.-]+", value) for value in (group, artifact, kind, version, scope))
                          or (classifier and not re.fullmatch(r"[A-Za-z0-9_.-]+", classifier))
                          or kind != "jar"
                          or scope not in {"compile", "runtime", "test", "provided", "system"}):
                      raise ValueError("malformed coordinate evidence")
                  result.append((group, artifact, kind, version, classifier, scope))
              return result

          def literal_coordinates(text):
              rows = [tuple(line.split(":")) for line in text.splitlines() if line]
              assert all(len(row) == 6 for row in rows)
              assert len(set(rows)) == len(rows)
              return set(rows)

