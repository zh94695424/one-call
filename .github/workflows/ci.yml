name: ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
      - 'api/openapi/**'
      - 'protocol/**'
      - 'security/**'
      - 'deployment/capacity/**'
      - 'acceptance/**'
      - 'docs/*.md'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
      - 'api/openapi/**'
      - 'protocol/**'
      - 'security/**'
      - 'deployment/capacity/**'
      - 'acceptance/**'
      - 'docs/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: assert toolchains and jdk pin
        run: |
          grep -Fx '21.0.13+9' .java-version
          grep -Fx 'SEMANTIC_VERSION="21.0.13+9"' "${JAVA_HOME}/release"
          grep -Fx 'IMPLEMENTOR="Eclipse Adoptium"' "${JAVA_HOME}/release"
          ./mvnw -B -ntp -v | grep -F 'Apache Maven 3.9.9'
          ./mvnw -B -ntp -v | grep -F 'Java version: 21.0.13'
          java -version 2>&1 | grep -F '21.0.13'
      - name: require docker daemon
        run: docker info
      - name: build, module checks, container smoke
        run: ./mvnw -B -ntp -Pcontainer-smoke verify
      - name: assert container smoke actually ran
        run: |
          python3 - <<'PY'
          import glob
          import re
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          def suites(pattern):
              files = glob.glob(pattern)
              if not files:
                  sys.exit(f"missing report: {pattern}")
              return [ET.parse(f).getroot() for f in files]

          failsafe = suites("target/failsafe-reports/TEST-*PostgresContainerIT.xml")
          if len(failsafe) != 1:
              sys.exit(f"expected one container IT report, got {len(failsafe)}")
          suite = failsafe[0]
          expected = {
              "v001ThroughV009MigrateCleanPostgres16WithoutSkipping",
              "v009SharingInventoryAndGuardShapesAreExact",
              "v009OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v009ForeignKeyAndRestrictDeleteBackstops",
              "v009ShapeDefaultsAndAppendOnlyBackstops",
              "v009GrantLifecycleRevisionMatrixAndImmutabilityBackstops",
              "v009AdmissionCountOnceLimitAndAtomicRollbackBackstops",
              "concurrentV009AdmissionIdentityLimitAndLifecycleHasOneWinner",
              "v008EvidenceInventoryAndGuardShapesAreExact",
              "v008OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v008ForeignKeyAndDeferredCreationCycleFkBackstops",
              "v008MediaRecordingShapeDefaultsAppendOnlyAndRollbackBackstops",
              "v008CreationCycleBothOrdersAndTerminalLifecycleBackstops",
              "concurrentV008EvidenceCreationAndRecordingIdentityHasOneWinner",
              "v001ThroughV003InventoryMatchesTheFrozenContract",
              "brokenMigrationFailsVisibly",
              "idempotencyNewReplayConflictAndFinalizeOnce",
              "committedNewIdempotencyRowIsAlertableAndRolledBackWritesLeaveNoRow",
              "concurrentIdempotencyRetryObservesOneWinner",
              "outboxReplayConflictRollbackAndDenylist",
              "auditIsAppendOnlyAndRuntimeWritesAreDenied",
              "auditReasonAndDenylistRulesAreEnforced",
              "functionsHaveFixedSearchPathAndNoTransactionControl",
              "ownerPublicAndRoleExecutionBoundariesAreExact",
              "hostileSearchPathCannotRedirectFunctionEffects",
              "mutableHeadsEnforceLifecycleRevisionAndNamedChecks",
              "localImmutabilityGuardsRejectRelationAndRotationChanges",
              "identityCollisionAndMembershipRevokeRegrantSemantics",
              "concurrentIdentityAndMembershipLiveCollisionsHaveOneWinner",
              "runtimeAndCrossModulePrivilegesAreExactAndWritesDenied",
              "lastEnabledAdminTransactionIsSerializedAndFailsClosed",
              "v003SubjectNumberCatalogAndGuardsAreExact",
              "v003OwnerPublicAndRuntimeAclsAreExact",
              "subjectOwnerSetOnceAndRealNameSeparation",
              "bindingLifecycleTerminalityAndActiveNumberUniqueness",
              "appendOnlyClaimAndForeignKeyBackstops",
              "riskOpenClearReopenRevisionProtocol",
              "concurrentActiveBindingUniquenessHasOneWinner",
              "v004CatalogOrderInventoryAndGuardsAreExact",
              "v004OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v004CatalogVersionLifecycleAndGuardBackstops",
              "v004OrderPaymentLifecycleAndAppendOnlyBackstops",
              "v004ForeignKeyAndStagedConsentFkBackstops",
              "concurrentCatalogPublicationAndCommerceIdentityHasOneWinner",
              "v005IvrTaskSessionCallInventoryAndGuardShapesAreExact",
              "v005OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v005TaskTtlLifecycleAndGuardBackstops",
              "v005SessionCallCanonicalCallerAndReciprocalLinkBackstops",
              "v005LegEventDecisionFrozenIdentityAndAppendOnlyBackstops",
              "v005ForeignKeyAndDeferredReservationFkBackstops",
              "concurrentV005TaskClaimAndActiveCallHasOneWinner",
              "v006EntitlementReservationUsageInventoryAndGuardShapesAreExact",
              "v006OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v006IssueFirstTrialGrantReplayConflictAndPolicySemantics",
              "v006TrialBalanceIssuanceLifecycleAndAppendOnlyBackstops",
              "v006ReservationUsageForeignKeyAndLateFkBackstops",
              "v006NestedOutboxAtomicityAndReplayRollbackEvidence",
              "concurrentV006FirstTrialAndReservationIdentityHasOneWinner",
              "v007ActivationConsentInventoryAndGuardShapesAreExact",
              "v007OwnerPublicRuntimeAndCrossModuleAclsAreExact",
              "v007ForeignKeyAndLateOrderConsentFkBackstops",
              "v007ConsentShapeDefaultsAppendOnlyAndRollbackBackstops",
              "v007ActivationHeadTransitionRevisionMatrixAndImmutabilityBackstops",
              "concurrentV007ActivationAndTransitionIdentityHasOneWinner",
          }
          source = Path("src/test/java/com/onecall/archtests/container/PostgresContainerIT.java").read_text()
          source_names = re.findall(r"@Test\s+void\s+(\w+)\s*\(", source)
          if len(source_names) != 64 or len(set(source_names)) != 64 or len(expected) != 64:
              sys.exit("PA9 V009 S3 requires exactly 64 distinct source/CI methods")
          if set(source_names) != expected:
              sys.exit(f"container source and CI expected methods differ: {sorted(set(source_names) ^ expected)}")
          if int(suite.get("tests", "0")) != len(expected):
              sys.exit("container IT did not report the PA9 V009 S3 test count (64)")
          if int(suite.get("skipped", "0")) != 0:
              sys.exit("container IT was skipped")
          if int(suite.get("failures", "0")) != 0 or int(suite.get("errors", "0")) != 0:
              sys.exit("container IT failed")
          case_names = [case.get("name") for case in suite.findall("testcase")]
          cases = set(case_names)
          if len(case_names) != 64 or len(cases) != 64 or cases != expected:
              sys.exit(f"container IT methods differ from PA9 V009 S3: {sorted(cases)}")
          unit_suites = suites("target/surefire-reports/TEST-*.xml")
          if sum(int(unit.get("tests", "0")) for unit in unit_suites) != 21:
              sys.exit("expected exactly 21 Surefire unit/module tests")
          for surefire in unit_suites:
              if any(int(surefire.get(result, "0")) != 0 for result in ("skipped", "failures", "errors")):
                  sys.exit("a unit/module test was skipped or failed")
          expected_query = {
              "queryRuntimeStartsAfterFixtureProvisioning",
              "personalListingIsCreatorScoped",
              "organizationListingIsCreatorAndWorkspaceScoped",
              "inactiveAndMissingCreatorContextsFailClosed",
              "keysetTiesAndConcurrentInsertRemainStable",
              "pageLimitsEmptyAndTailStatesAreExact",
              "invalidAndCrossContextCursorsNeverWidenScope",
              "listingProjectionNeverReadsOrReturnsSecrets",
              "runtimeRoleAndPoolCleanupHoldOnSuccessAndFailure",
              "committedLifecycleChangesDenyNextQueryAndFailuresRollBack",
          }
          unit_expected = {
              "com.onecall.archtests.architecture.ModuleBoundaryTests": {
                  "discoversExactlyTheFrozenModuleSet", "everyExpectedModuleDeclaresApplicationModule",
                  "assertsExactAllowedDependencyMapFromPlan62", "discoveredProductionEdgesStayInsideTheConfiguredMap",
                  "verifiesNoCyclesOrBoundaryViolations", "rejectsCycleFixture", "rejectsForbiddenDependencyFixture",
                  "rejectsInternalPackageAccessFixture",
              },
              "com.onecall.archtests.OneCallApplicationTests": {"contextLoadsWithoutDatabaseOrSecurityAutoConfiguration"},
              "com.onecall.archtests.architecture.BootstrapDependencyBoundaryTests": {"approvedPersistenceFrameworksAndForbiddenStacksAreExact"},
              "com.onecall.core.sharing.internal.application.CustomerShareQueryServiceTests": {
                  "defaultsAndBoundsAreDeterministic", "trustedContextCannotBeOverridden",
                  "cursorBindingAndAnchorValidationAreDeterministic", "lookaheadUsesLastReturnedRow",
                  "emptyAndTailPagesHaveNoCursor", "projectionComponentsMatchFrozenListing",
                  "creatorContextDenialDoesNotFetchShares", "technicalFailuresReturnNoPartialPageOrSensitiveText",
              },
              "com.onecall.archtests.SharingPersistenceConfigurationTests": {
                  "defaultProfileCreatesNoPersistenceBeans", "persistenceRequiresExplicitQueryCredentials",
              },
              "com.onecall.archtests.architecture.SharingQueryBoundaryTests": {"sharingQueryApiAndProjectionAreExact"},
          }
          container_expected = {
              "com.onecall.archtests.container.PostgresContainerIT": expected,
              "com.onecall.archtests.container.SharingQueryServiceIT": expected_query,
          }

          def exact_inventory(pattern, inventory, total):
              reports = suites(pattern)
              if len(reports) != len(inventory) or {report.get("name") for report in reports} != set(inventory):
                  sys.exit("unexpected/missing test report class")
              if sum(int(report.get("tests", "0")) for report in reports) != total:
                  sys.exit("wrong aggregate test inventory")
              for report in reports:
                  class_name = report.get("name")
                  names = inventory[class_name]
                  source = Path("src/test/java", class_name.replace(".", "/") + ".java").read_text()
                  source_names = re.findall(r"@Test\s+(?:public\s+)?void\s+(\w+)\s*\(", source)
                  if len(source_names) != len(names) or set(source_names) != names:
                      sys.exit(f"source/CI inventory mismatch: {class_name}")
                  if re.search(r"@(ParameterizedTest|RepeatedTest|TestFactory|Disabled|Enabled\w*|Disabled\w*)\b", source):
                      sys.exit(f"unsupported/conditional tests: {class_name}")
                  pairs = [(case.get("classname"), case.get("name")) for case in report.findall("testcase")]
                  if len(pairs) != len(names) or set(pairs) != {(class_name, name) for name in names}:
                      sys.exit(f"XML/CI inventory mismatch: {class_name}")
                  if int(report.get("tests", "0")) != len(names) or any(int(report.get(key, "0")) for key in ("skipped", "failures", "errors")):
                      sys.exit(f"non-green or incorrect report: {class_name}")

          source_classes = set()
          for path in Path("src/test/java").rglob("*.java"):
              source = path.read_text()
              if re.search(r"@(?:Test|ParameterizedTest|RepeatedTest|TestFactory)\b", source):
                  source_classes.add(str(path.relative_to("src/test/java")).removesuffix(".java").replace("/", "."))
          if source_classes != set(unit_expected) | set(container_expected):
              sys.exit("unexpected/missing source test class")
          exact_inventory("target/surefire-reports/TEST-*.xml", unit_expected, 21)
          exact_inventory("target/failsafe-reports/TEST-*.xml", container_expected, 74)
          print("PA10 exact source/CI/XML inventory passed: Surefire 21; Failsafe 64+10=74; zero skips/errors/failures")
          PY
      - name: boot jar smoke
        run: |
          timeout 60s java -jar target/onecall-runtime-0.0.1-SNAPSHOT.jar > target/boot.log 2>&1
          grep -F 'Started OneCallApplication' target/boot.log
      - name: production jar dependency firewall
        run: |
          jar tf target/onecall-runtime-0.0.1-SNAPSHOT.jar > target/jar-index.txt
          ./mvnw -B -ntp dependency:list -DincludeScope=runtime -DoutputFile=target/pa10-runtime-dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          jars = [entry.removeprefix("BOOT-INF/lib/") for entry in Path("target/jar-index.txt").read_text().splitlines()
                  if entry.startswith("BOOT-INF/lib/") and entry.endswith(".jar")]
          resolved = re.findall(r"^\s*([\w.]+):([\w.-]+):jar:([^:\s]+):(compile|runtime)\b",
                                Path("target/pa10-runtime-dependencies.txt").read_text(), re.M)
          approved = {("org.jooq", "jooq"), ("com.zaxxer", "HikariCP"), ("org.postgresql", "postgresql"),
                      ("org.springframework", "spring-jdbc"), ("org.springframework", "spring-tx")}
          for group, artifact in approved:
              matches = [(version, scope) for actual_group, actual_artifact, version, scope in resolved
                         if (actual_group, actual_artifact) == (group, artifact)]
              if len(matches) != 1:
                  sys.exit(f"missing/duplicate resolved product coordinate: {group}:{artifact}")
              version, scope = matches[0]
              if scope != ("runtime" if artifact == "postgresql" else "compile"):
                  sys.exit(f"incorrect product scope: {artifact}")
              actual = [jar for jar in jars if jar.startswith(artifact + "-")]
              if actual != [f"{artifact}-{version}.jar"]:
                  sys.exit(f"missing/duplicate/unapproved version of {artifact}")
          forbidden = r"^(flyway|spring-security|spring-orm|hibernate|spring-data-|spring-web|tomcat|jetty|undertow|reactor-netty|jakarta.servlet|jakarta.validation|testcontainers|junit|mockito|byte-buddy-agent|assertj|awaitility|jooq-(?!\d)|h2-|hsqldb|derby|mybatis|spring-boot-(?:jdbc|jooq|flyway|test|web|security)|spring-boot-starter-(?:jdbc|jooq|flyway|web|security|data-)|spring-test)"
          if any(re.search(forbidden, jar) for jar in jars):
              sys.exit("forbidden framework/test tooling in product JAR")
          print("PA10 exact resolved query JAR inventory and negative firewall passed")
          PY

  contract-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: api/openapi/package-lock.json
      - name: assert exact node version
        run: node --version | grep -Fx v22.23.4
      - name: install locked A1 toolchain
        working-directory: api/openapi
        run: npm ci
      - name: A1 s3
        working-directory: api/openapi
        run: npm run check:s3
      - name: A2 s3
        run: |
          node protocol/ivr/validate.mjs --stage s3 \
            --model protocol/ivr/v1/ivr-protocol-v1.json \
            --fixtures protocol/ivr/v1/fixtures \
            --spec docs/16-production-ivr-protocol-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md
      - name: A3 s3
        run: |
          node security/validate.mjs --stage s3 \
            --model security/v1/security-design-v1.json \
            --fixtures security/v1/fixtures \
            --spec docs/17-production-security-design-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures
      - name: A4 s2
        run: |
          node deployment/capacity/validate.mjs --stage s2 \
            --template deployment/capacity/inputs.template.json \
            --fixtures deployment/capacity/fixtures
      - name: A5 s1
        run: |
          node acceptance/validate.mjs --stage s1 \
            --matrix acceptance/v1/acceptance-matrix-v1.json \
            --doc docs/19-production-acceptance-matrix.md \
            --fixtures acceptance/fixtures \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures \
            --a3-model security/v1/security-design-v1.json \
            --a3-fixtures security/v1/fixtures \
            --a4-calc deployment/capacity/calc.mjs \
            --a4-fixtures deployment/capacity/fixtures
      - name: A5 s2
        run: |
          node acceptance/validate.mjs --stage s2 \
            --matrix acceptance/v1/acceptance-matrix-v1.json \
            --doc docs/19-production-acceptance-matrix.md \
            --fixtures acceptance/fixtures \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures \
            --a3-model security/v1/security-design-v1.json \
            --a3-fixtures security/v1/fixtures \
            --a4-calc deployment/capacity/calc.mjs \
            --a4-fixtures deployment/capacity/fixtures \
            --check-doc-links
