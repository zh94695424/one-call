                   good_jars + ["r2dbc-postgresql-1.0.0.RELEASE.jar"])
          anchor = next(coordinate for coordinate in good_resolved if coordinate[1] == "spring-webmvc")
          for index, value in ((0, "forged.group"), (2, "pom"), (3, "0.0"), (4, "tests"), (5, "test")):
              wrong = list(anchor)
              wrong[index] = value
              rejected([tuple(wrong) if item == anchor else item for item in good_resolved], good_jars)
          rejected(good_resolved + [good_resolved[0]], good_jars)
          rejected(good_resolved[:-1], good_jars)
          rejected(good_resolved, good_jars + [good_jars[0]])
          rejected(good_resolved, good_jars[:-1])
          rejected(good_resolved, [jar for jar in good_jars if jar != jarmode])
          for text in ("bad-coordinate", "group:artifact:jar:1.0:compile:extra", "group:artifact:jar:1.0:bogus"):
              try:
                  parse_coordinates(text)
              except ValueError:
                  probes += 1
              else:
                  raise AssertionError("malformed coordinate accepted")
          assert probes == 82

          resolved = parse_coordinates(Path("target/pa11-runtime-dependencies.txt").read_text())
          index = Path("target/jar-index.txt").read_text().splitlines()
          jar_entries = [entry for entry in index if entry.startswith("BOOT-INF/lib/") and entry.endswith(".jar")]
          assert all(entry.count("/") == 2 for entry in jar_entries)
          jars = [entry.removeprefix("BOOT-INF/lib/") for entry in jar_entries]
          validate(resolved, jars)
          assert not any(coordinate[5] == "test" for coordinate in resolved)

          def direct_interfaces(data):
              offset, constants, number = 10, {}, 1
              count = struct.unpack_from(">H", data, 8)[0]
              while number < count:
                  tag = data[offset]
                  offset += 1
                  if tag == 1:
                      size = struct.unpack_from(">H", data, offset)[0]
                      offset += 2
                      constants[number] = data[offset:offset+size].decode("utf-8", errors="replace")
                      offset += size
                  elif tag == 7:
                      constants[number] = struct.unpack_from(">H", data, offset)[0]
                      offset += 2
                  elif tag in (3, 4, 9, 10, 11, 12, 17, 18):
                      offset += 4
                  elif tag in (5, 6):
                      offset += 8
                      number += 1
                  elif tag in (8, 16, 19, 20):
                      offset += 2
                  elif tag == 15:
                      offset += 3
                  else:
                      raise AssertionError("unknown class constant tag")
                  number += 1
              offset += 6
              size = struct.unpack_from(">H", data, offset)[0]
              offset += 2
              return [constants[constants[struct.unpack_from(">H", data, offset + 2 * item)[0]]] for item in range(size)]

          with zipfile.ZipFile("target/onecall-runtime-0.0.1-SNAPSHOT.jar") as product:
              entries = product.namelist()
              assert len(entries) == len(set(entries))
              for entry in entries:
                  if not entry.startswith("BOOT-INF/classes/"):
                      continue
                  assert not re.search(r"(?i)fixture|testbeans|testapplication|verifieradapter|testconfiguration", entry)
                  if entry.endswith(".class"):
                      interfaces = direct_interfaces(product.read(entry))
                      assert "com/onecall/core/customer_iam/internal/security/CustomerSessionVerifier" not in interfaces
                      assert "org/springframework/security/web/SecurityFilterChain" not in interfaces
          print(f"PA11 firewall passed: baseline37/34, web55/48, counterparts47, dependency-only8, packager1; deltas18/0 and14/0; {probes} adversarial probes")
          print("Approved legacy-regex collisions (positive-first): " + ", ".join(collisions))
          print("Only packager branch: " + jarmode + "; commons-logging parsed; tuple order group:artifact:type:version:classifier:scope")
