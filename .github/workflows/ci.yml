      - name: default and opt-in web jar smokes
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid

          jar = "target/onecall-runtime-0.0.1-SNAPSHOT.jar"
          env = {key: value for key, value in os.environ.items()
                 if not key.startswith(("ONECALL_DB_", "ONECALL_CUSTOMER_DB_", "SPRING_"))}
          with open("target/boot.log", "w") as log:
              default = subprocess.run(["java", "-jar", jar], stdout=log, stderr=subprocess.STDOUT, env=env, timeout=60)
          default.check_returncode()
          text = Path("target/boot.log").read_text()
          assert "Started OneCallApplication" in text
          assert not re.search(r"Tomcat|Netty|Jetty|Undertow|HikariPool", text)
          with open("target/web-boot.log", "w") as log:
              process = subprocess.Popen(["java", "-jar", jar, "--spring.profiles.active=web",
                                          "--spring.main.web-application-type=servlet", "--server.port=0"],
                                         stdout=log, stderr=subprocess.STDOUT, env=env)
              try:
                  deadline = time.monotonic() + 60
                  while True:
                      text = Path("target/web-boot.log").read_text()
                      port = re.search(r"Tomcat started on port (\d+)", text)
                      if port and "Started OneCallApplication" in text:
                          break
                      assert process.poll() is None, "web JVM exited before startup"
                      assert time.monotonic() < deadline, "web startup timed out"
                      time.sleep(0.2)
                  traces = set()
                  probes = [("/api/v1/customer/me", {}, 401, "UNAUTHENTICATED", "Authentication required"),
                            ("/api/v1/customer/me", {"Authorization": "Bearer smoke-opaque"}, 503,
                             "SERVICE_UNAVAILABLE", "Service unavailable"),
                            ("/api/v1/customer/me", {"Accept": "text/html", "X-Trace-Id": "untrusted"}, 401,
                             "UNAUTHENTICATED", "Authentication required"),
                            ("/error", {"Accept": "text/html"}, 404, "NOT_FOUND", "Not found")]
                  for path, headers, status, code, title in probes:
                      request = urllib.request.Request(f"http://127.0.0.1:{port.group(1)}{path}", headers=headers)
                      try:
                          response = urllib.request.urlopen(request, timeout=10)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          body = response.read().decode()
                          problem = json.loads(body)
                          assert response.code == status
                          assert response.headers.get_content_type() == "application/problem+json"
                          assert response.headers["Cache-Control"] == "no-store"
                          assert response.headers["Pragma"] == "no-cache"
                          assert response.headers["X-Content-Type-Options"] == "nosniff"
                          assert not response.headers.get("Set-Cookie")
                          assert response.headers.get("WWW-Authenticate") == ("Bearer" if status == 401 else None)
                          assert set(problem) == {"type", "title", "status", "code", "traceId"}
                          assert (problem["type"], problem["title"], problem["status"], problem["code"]) == ("about:blank", title, status, code)
                          assert str(uuid.UUID(problem["traceId"])) == problem["traceId"]
                          assert problem["traceId"] not in traces
                          traces.add(problem["traceId"])
                          assert not re.search(r"smoke-opaque|untrusted|jdbc:|password|exception|timestamp|<html", body, re.I)
                  assert "HikariPool" not in Path("target/web-boot.log").read_text()
              finally:
                  if process.poll() is None:
                      process.terminate()
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          print("PA11 bounded default/web JAR smokes passed; no DB/verifier adapter; JVM cleaned up")
          PYCODE
