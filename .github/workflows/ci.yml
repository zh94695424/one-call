          forbidden = r"^(flyway|spring-security|spring-orm|hibernate|spring-data-|spring-web|tomcat|jetty|undertow|reactor-netty|jakarta.servlet|jakarta.validation|testcontainers|junit|mockito|byte-buddy-agent|assertj|awaitility|jooq-(?!\d)|h2-|hsqldb|derby|mybatis|spring-boot-(?:jdbc|jooq|flyway|test|web|security)|spring-boot-starter-(?:jdbc|jooq|flyway|web|security|data-)|spring-test)"
          collisions = sorted(filename for filename in counterparts if re.search(forbidden, filename))
          assert len(baseline_resolved) == 37 and len(baseline_jars) == len(set(baseline_jars)) == 34
          assert len(approved) == 72 and len(dependency_only) == 8 and len(counterparts) == 64
          assert len(packaged_literal) == len(set(packaged_literal)) == 65
          assert set(packaged_literal) == set(counterparts) | {jarmode}
          assert baseline_resolved <= set(approved) and len(set(approved) - baseline_resolved) == 35
          assert set(baseline_jars) <= set(packaged_literal) and len(set(packaged_literal) - set(baseline_jars)) == 31
          assert len(collisions) == 7
          for coordinate, filename in approved.items():
              group, artifact, kind, version, classifier, scope = coordinate
              assert kind == "jar" and classifier == "" and scope in {"compile", "runtime"}
              if filename is not None:
                  assert filename == f"{artifact}-{version}.jar"
          assert parse_coordinates("commons-logging:commons-logging:jar:1.3.6:compile") == [
              ("commons-logging", "commons-logging", "jar", "1.3.6", "", "compile")]
          assert parse_coordinates("commons-logging:commons-logging:jar:1.3.6::compile") == [
              ("commons-logging", "commons-logging", "jar", "1.3.6", "", "compile")]
          assert parse_coordinates("group-with-hyphen:artifact-with-hyphen:jar:tests:1.0:test") == [
              ("group-with-hyphen", "artifact-with-hyphen", "jar", "1.0", "tests", "test")]

          def validate(resolved, jars):
              if len(resolved) != len(set(resolved)) or len(jars) != len(set(jars)):
                  raise ValueError("duplicate coordinate or filename")
              for coordinate in resolved:
                  if coordinate in approved:
                      filename = approved[coordinate]
                      if filename is not None and filename not in jars:
                          raise ValueError("missing approved counterpart")
                      if filename is None and f"{coordinate[1]}-{coordinate[3]}.jar" in jars:
                          raise ValueError("dependency-only coordinate materialized")
                      continue
                  if coordinate[:2] in {("com.fasterxml.jackson.core", "jackson-core"),
                                        ("com.fasterxml.jackson.core", "jackson-databind")}:
                      raise ValueError("Jackson 2 core/databind identity forbidden")
                  raise ValueError("nonmember resolved coordinate")
              for filename in jars:
                  if filename == jarmode:
                      continue
                  if filename in counterparts and counterparts[filename] in resolved:
                      continue
                  if re.search(forbidden, filename) or re.search(r"(?i)test|tool|fixture", filename):
                      raise ValueError("forbidden nonmember JAR")
                  raise ValueError("nonmember packaged JAR")
              if set(resolved) != set(approved) or set(jars) != set(packaged_literal):
                  raise ValueError("exact resolved/packaged inventory mismatch")

          probes = 0
          def rejected(resolved, jars, reason=None):
              global probes
              try:
                  validate(resolved, jars)
              except ValueError as failure:
                  if reason is not None:
                      assert reason in str(failure)
                  probes += 1
                  return
              raise AssertionError("adversarial manifest passed")

          good_resolved, good_jars = list(approved), list(packaged_literal)
          validate(good_resolved, good_jars)
          for coordinate in dependency_only:
              rejected(good_resolved, good_jars + [f"{coordinate[1]}-{coordinate[3]}.jar"])
          for family in ("spring-boot-starter-web", "spring-websocket", "tomcat-embed-jasper", "jakarta.servlet-api",
                         "spring-boot-starter-webflux", "reactor-netty-http", "jetty-server", "undertow-core",
                         "spring-boot-starter-security", "spring-security-core", "spring-security-oauth2-jose",
                         "jjwt-api", "spring-boot-starter-data-jpa", "hibernate-core", "flyway-core",
                         "spring-boot-starter-flyway", "spring-boot-starter-jdbc", "spring-boot-starter-jooq",
                         "spring-boot-starter-data-jdbc", "spring-boot-starter-validation", "jakarta.validation-api",
                         "testcontainers", "junit-jupiter", "mockito-core", "spring-test", "arbitrary-tools",
                         "r2dbc-postgresql", "h2", "spring-boot-jarmode-tools"):
              coordinate = ("unapproved", family, "jar", "0.0", "", "runtime")
              rejected(good_resolved + [coordinate], good_jars + [f"{family}-0.0.jar"])
              rejected(good_resolved, good_jars + [f"{family}-0.0.jar"])
          for artifact in ("jackson-core", "jackson-databind"):
              forged = ("com.fasterxml.jackson.core", artifact, "jar", "3.1.7", "", "compile")
              rejected(good_resolved + [forged], good_jars, "Jackson 2")
          rejected(good_resolved + [("org.postgresql", "r2dbc-postgresql", "jar", "1.0.0.RELEASE", "", "runtime")],
                   good_jars + ["r2dbc-postgresql-1.0.0.RELEASE.jar"])
          anchor = next(coordinate for coordinate in good_resolved if coordinate[1] == "spring-webmvc")
          for index, value in ((0, "forged.group"), (2, "pom"), (3, "0.0"), (4, "tests"), (5, "test")):
              wrong = list(anchor)
              wrong[index] = value
              rejected([tuple(wrong) if item == anchor else item for item in good_resolved], good_jars)
          rejected(good_resolved + [good_resolved[0]], good_jars)
          rejected(good_resolved[:-1], good_jars)
          rejected(good_resolved, good_jars + [good_jars[0]])
          rejected(good_resolved, good_jars[:-1])
          rejected(good_resolved, [jar for jar in good_jars if jar != jarmode])
          for text in ("bad-coordinate", "group:artifact:jar:1.0:compile:extra", "group:artifact:jar:1.0:bogus"):
              try:
                  parse_coordinates(text)
              except ValueError:
                  probes += 1
              else:
                  raise AssertionError("malformed coordinate accepted")
          assert probes == 82

          for coordinate in (
              ('commons-io', 'commons-io', 'jar', '2.20.0', '', 'compile'),
              ('org.apache.commons', 'commons-lang3', 'jar', '3.20.0', '', 'compile'),
              ('org.jetbrains', 'annotations', 'jar', '17.0.0', '', 'compile'),
              ('com.tencentcloudapi', 'tencentcloud-sdk-java-ssm', 'jar', '3.2.46', '', 'compile'),
              ('com.tencentcloudapi', 'tencentcloud-sdk-java-common', 'jar', '3.2.46', '', 'compile'),
              ('com.squareup.okhttp3', 'okhttp', 'jar', '4.12.0', '', 'compile'),
              ('com.squareup.okio', 'okio', 'jar', '3.6.0', '', 'compile'),
              ('com.squareup.okio', 'okio-jvm', 'jar', '3.6.0', '', 'compile'),
              ('org.jetbrains.kotlin', 'kotlin-stdlib-common', 'jar', '1.9.10', '', 'compile'),
              ('org.jetbrains.kotlin', 'kotlin-stdlib-jdk8', 'jar', '2.3.21', '', 'compile'),
              ('org.jetbrains.kotlin', 'kotlin-stdlib', 'jar', '2.3.21', '', 'compile'),
              ('org.jetbrains.kotlin', 'kotlin-stdlib-jdk7', 'jar', '2.3.21', '', 'compile'),
              ('com.google.code.gson', 'gson', 'jar', '2.13.2', '', 'compile'),
              ('com.google.errorprone', 'error_prone_annotations', 'jar', '2.41.0', '', 'compile'),
              ('com.squareup.okhttp3', 'logging-interceptor', 'jar', '4.12.0', '', 'compile'),
              ('org.apache.commons', 'commons-configuration2', 'jar', '2.15.1', '', 'compile'),
              ('org.apache.commons', 'commons-text', 'jar', '1.15.0', '', 'compile'),
          ):
              wrong = list(coordinate)
              wrong[3] = "0.0-pa23-unapproved"
              rejected([tuple(wrong) if item == coordinate else item for item in good_resolved], good_jars)
              filename = approved[coordinate]
              wrong_filename = f"{coordinate[1]}-0.0-pa23-unapproved.jar"
              rejected(good_resolved, [wrong_filename if item == filename else item for item in good_jars])
          assert probes == 116

          resolved = parse_coordinates(Path("target/pa11-runtime-dependencies.txt").read_text())
          index = Path("target/jar-index.txt").read_text().splitlines()
          jar_entries = [entry for entry in index if entry.startswith("BOOT-INF/lib/") and entry.endswith(".jar")]
          assert all(entry.count("/") == 2 for entry in jar_entries)
          jars = [entry.removeprefix("BOOT-INF/lib/") for entry in jar_entries]
          validate(resolved, jars)
          assert not any(coordinate[5] == "test" for coordinate in resolved)

          def direct_interfaces(data):
              offset, constants, number = 10, {}, 1
              count = struct.unpack_from(">H", data, 8)[0]
              while number < count:
                  tag = data[offset]
                  offset += 1
                  if tag == 1:
                      size = struct.unpack_from(">H", data, offset)[0]
                      offset += 2
                      constants[number] = data[offset:offset+size].decode("utf-8", errors="replace")
                      offset += size
                  elif tag == 7:
                      constants[number] = struct.unpack_from(">H", data, offset)[0]
                      offset += 2
                  elif tag in (3, 4, 9, 10, 11, 12, 17, 18):
                      offset += 4
                  elif tag in (5, 6):
                      offset += 8
                      number += 1
                  elif tag in (8, 16, 19, 20):
                      offset += 2
                  elif tag == 15:
                      offset += 3
                  else:
                      raise AssertionError("unknown class constant tag")
                  number += 1
              offset += 6
              size = struct.unpack_from(">H", data, offset)[0]
              offset += 2
              return [constants[constants[struct.unpack_from(">H", data, offset + 2 * item)[0]]] for item in range(size)]

          with zipfile.ZipFile("target/onecall-runtime-0.0.1-SNAPSHOT.jar") as product:
              entries = product.namelist()
              assert not any("pa25-runtime-identities" in entry or "ops/postgresql/" in entry for entry in entries)
              assert len(entries) == len(set(entries))
              for entry in entries:
                  if not entry.startswith("BOOT-INF/classes/"):
                      continue
                  assert not re.search(r"(?i)fixture|testbeans|testapplication|verifieradapter|testconfiguration", entry)
                  if entry.endswith(".class"):
                      interfaces = direct_interfaces(product.read(entry))
                      assert "com/onecall/core/customer_iam/internal/security/CustomerSessionVerifier" not in interfaces
                      assert "org/springframework/security/web/SecurityFilterChain" not in interfaces
          print(f"PA11 firewall passed: baseline37/34, ssm72/65, counterparts64, dependency-only8, packager1; deltas35/0 and31/0; {probes} adversarial probes")
          print("Approved legacy-regex collisions (positive-first): " + ", ".join(collisions))
          print("Only packager branch: " + jarmode + "; commons-logging parsed; tuple order group:artifact:type:version:classifier:scope")
          PYCODE

  contract-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: api/openapi/package-lock.json
      - name: assert exact node version
        run: node --version | grep -Fx v22.23.4
      - name: install locked A1 toolchain
        working-directory: api/openapi
        run: npm ci
      - name: A1 s3
        working-directory: api/openapi
        run: npm run check:s3
      - name: A2 s3
        run: |
          node protocol/ivr/validate.mjs --stage s3 \
            --model protocol/ivr/v1/ivr-protocol-v1.json \
            --fixtures protocol/ivr/v1/fixtures \
            --spec docs/16-production-ivr-protocol-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md
      - name: A3 s3
        run: |
          node security/validate.mjs --stage s3 \
            --model security/v1/security-design-v1.json \
            --fixtures security/v1/fixtures \
            --spec docs/17-production-security-design-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures
      - name: A4 s2
        run: |
          node deployment/capacity/validate.mjs --stage s2 \
            --template deployment/capacity/inputs.template.json \
            --fixtures deployment/capacity/fixtures
      - name: A5 s1
        run: |
          node acceptance/validate.mjs --stage s1 \
            --matrix acceptance/v1/acceptance-matrix-v1.json \
            --doc docs/19-production-acceptance-matrix.md \
            --fixtures acceptance/fixtures \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures \
            --a3-model security/v1/security-design-v1.json \
            --a3-fixtures security/v1/fixtures \
            --a4-calc deployment/capacity/calc.mjs \
            --a4-fixtures deployment/capacity/fixtures
      - name: A5 s2
        run: |
          node acceptance/validate.mjs --stage s2 \
            --matrix acceptance/v1/acceptance-matrix-v1.json \
            --doc docs/19-production-acceptance-matrix.md \
            --fixtures acceptance/fixtures \
            --a0 docs/14-production-data-model-and-flyway-schema-spec.md \
            --a1-bundle tmp/openapi-client/onecall-v1.bundle.json \
            --a2-model protocol/ivr/v1/ivr-protocol-v1.json \
            --a2-fixtures protocol/ivr/v1/fixtures \
            --a3-model security/v1/security-design-v1.json \
            --a3-fixtures security/v1/fixtures \
            --a4-calc deployment/capacity/calc.mjs \
            --a4-fixtures deployment/capacity/fixtures \
            --check-doc-links
