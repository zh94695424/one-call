          unit_suites = suites("target/surefire-reports/TEST-*.xml")
          if sum(int(unit.get("tests", "0")) for unit in unit_suites) != 67:
              sys.exit("expected exactly 67 Surefire unit/module tests")
          for surefire in unit_suites:
              if any(int(surefire.get(result, "0")) != 0 for result in ("skipped", "failures", "errors")):
