          def exact_inventory(pattern, inventory, total):
              reports = suites(pattern)
              if len(reports) != len(inventory) or {report.get("name") for report in reports} != set(inventory):
                  sys.exit("unexpected/missing test report class")
              if sum(int(report.get("tests", "0")) for report in reports) != total:
                  sys.exit("wrong aggregate test inventory")
              for report in reports:
                  class_name = report.get("name")
                  names = inventory[class_name]
                  source = Path("src/test/java", class_name.replace(".", "/") + ".java").read_text()
                  source_names = re.findall(r"@Test\s+(?:public\s+)?void\s+(\w+)\s*\(", source)
                  if len(source_names) != len(names) or set(source_names) != names:
                      sys.exit(f"source/CI inventory mismatch: {class_name}")
                  if re.search(r"@(ParameterizedTest|RepeatedTest|TestFactory|Disabled|Enabled\w*|Disabled\w*)\b", source):
                      sys.exit(f"unsupported/conditional tests: {class_name}")
                  pairs = [(case.get("classname"), case.get("name")) for case in report.findall("testcase")]
                  if len(pairs) != len(names) or set(pairs) != {(class_name, name) for name in names}:
                      sys.exit(f"XML/CI inventory mismatch: {class_name}")
                  if int(report.get("tests", "0")) != len(names) or any(int(report.get(key, "0")) for key in ("skipped", "failures", "errors")):
                      sys.exit(f"non-green or incorrect report: {class_name}")

          source_classes = set()
          for path in Path("src/test/java").rglob("*.java"):
              source = path.read_text()
              if re.search(r"@(?:Test|ParameterizedTest|RepeatedTest|TestFactory)\b", source):
                  source_classes.add(str(path.relative_to("src/test/java")).removesuffix(".java").replace("/", "."))
          if source_classes != set(unit_expected) | set(container_expected):
              sys.exit("unexpected/missing source test class")
          exact_inventory("target/surefire-reports/TEST-*.xml", unit_expected, 67)
          exact_inventory("target/failsafe-reports/TEST-*.xml", container_expected, 92)
          print("PA12 exact source/CI/XML inventory passed: Surefire 67; Failsafe 64+10+10+8=92; combined 159; zero skips/errors/failures")
