<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一通话 · 证枢能力中枢</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #dde3eb;
      --line-strong: #c8d1de;
      --text: #18202c;
      --muted: #657083;
      --faint: #8994a5;
      --primary: #2468f2;
      --primary-strong: #1554d1;
      --primary-soft: #edf4ff;
      --green: #138a62;
      --green-soft: #eaf8f2;
      --amber: #a66409;
      --amber-soft: #fff6e5;
      --red: #c2413b;
      --red-soft: #fff0ef;
      --violet: #7655b5;
      --violet-soft: #f4effc;
      --sidebar: 228px;
      --header: 64px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(36, 104, 242, .22); outline-offset: 1px;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: var(--primary); text-decoration: none; }
    svg { width: 18px; height: 18px; stroke-width: 1.8; }

    .app { min-width: 0; min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: var(--sidebar); padding: 18px 14px;
      background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px; }
    .brand img { width: 34px; height: 34px; }
    .brand strong { display: block; font-size: 15px; font-weight: 650; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .workspace-select {
      width: 100%; height: 42px; margin: 18px 0 16px; padding: 0 34px 0 12px; border: 1px solid var(--line);
      border-radius: 7px; background: var(--panel-soft); color: var(--text); font-weight: 550;
    }
    .role-preview { display: none; margin: -7px 0 14px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .role-preview.visible { display: block; }
    .role-preview span, .role-preview strong { display: block; }
    .role-preview span { color: var(--faint); font-size: 11px; }
    .role-preview strong { margin-top: 4px; font-size: 13px; }
    .nav-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; }
    .nav-label { margin: 16px 10px 7px; color: var(--faint); font-size: 11px; font-weight: 650; }
    .nav-item {
      width: 100%; min-height: 40px; border: 0; border-radius: 6px; background: transparent; color: #495568;
      display: flex; align-items: center; gap: 10px; padding: 9px 11px; text-align: left; margin: 2px 0;
    }
    .nav-item:hover { background: #f3f6fa; color: var(--text); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
    .nav-item .count { margin-left: auto; min-width: 21px; text-align: center; padding: 2px 6px; border-radius: 10px; background: #e9edf3; font-size: 11px; }
    .nav-item.active .count { background: #dce9ff; }
    .sidebar-foot { border-top: 1px solid var(--line); padding-top: 12px; }
    .user-card { display: flex; align-items: center; gap: 9px; padding: 7px 8px; }
    .user-card .icon-button { width: 30px; height: 30px; margin-left: auto; border-color: transparent; background: transparent; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #dfe8f7; color: #31557f; font-weight: 700; }
    .user-copy strong, .user-copy span { display: block; }
    .user-copy strong { font-size: 13px; }
    .user-copy span { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .topbar {
      position: fixed; z-index: 15; top: 0; left: var(--sidebar); right: 0; height: var(--header);
      background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px;
    }
    .breadcrumbs { color: var(--muted); font-size: 13px; }
    .breadcrumbs strong { color: var(--text); font-weight: 600; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-button {
      width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
      color: #526076; display: grid; place-items: center;
    }
    .icon-button:hover { border-color: var(--line-strong); background: var(--panel-soft); }
    .global-search { position: relative; width: 270px; }
    .global-search svg { position: absolute; left: 11px; top: 9px; width: 17px; color: var(--faint); }
    .global-search input { width: 100%; height: 36px; padding: 0 12px 0 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-soft); }

    .main { margin-left: var(--sidebar); padding-top: var(--header); min-height: 100vh; }
    .content { max-width: 1540px; margin: 0 auto; padding: 24px 28px 48px; }
    .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
    .page-head-copy { min-width: 0; }
    .page-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 650; }
    .page-head p { margin: 5px 0 0; color: var(--muted); line-height: 21px; }
    .page-head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 36px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: #354258;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 13px; font-weight: 550;
    }
    .btn:hover { border-color: #9dadc0; background: var(--panel-soft); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-strong); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--red); border-color: #e7b5b2; }
    .btn svg { width: 16px; height: 16px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 16px; min-width: 0; }
    .kpi-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
    .kpi-head svg { width: 17px; }
    .kpi-value { margin-top: 12px; font-size: 27px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .delta { color: var(--green); }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    .panel-head { min-height: 52px; display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 12px; }
    .panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .panel-head .head-action { margin-left: auto; }
    .panel-body { padding: 16px; }
    .stack { display: grid; gap: 16px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .search-field { position: relative; min-width: 260px; flex: 1 1 320px; max-width: 440px; }
    .search-field svg { position: absolute; left: 10px; top: 9px; width: 17px; color: var(--faint); }
    .input, .select { height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); padding: 0 11px; }
    .search-field .input { width: 100%; padding-left: 34px; }
    .select { min-width: 120px; }
    .view-switch { display: flex; margin-left: auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .view-switch button { width: 36px; height: 34px; border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; }
    .view-switch button:last-child { border-right: 0; }
    .view-switch button.active { color: var(--primary); background: var(--primary-soft); }
    .type-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
    .type-tab { min-height: 40px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); }
    .type-tab.active { color: var(--primary-strong); border-bottom-color: var(--primary); font-weight: 600; }

    .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    table { width: 100%; border-collapse: collapse; min-width: 930px; }
    th { height: 42px; padding: 0 13px; background: #f8fafc; color: #657083; font-size: 12px; font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 12px 13px; border-bottom: 1px solid #e9edf2; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcff; }
    .row-link { border: 0; background: transparent; color: var(--text); text-align: left; padding: 0; font-weight: 600; }
    .row-link:hover { color: var(--primary); }
    .evidence-name { display: flex; gap: 10px; align-items: center; min-width: 230px; }
    .file-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }
    .file-icon.photo { color: #21846f; background: #eaf7f2; }
    .file-icon.video { color: #9a5e15; background: #fff4e6; }
    .file-icon.audio { color: var(--violet); background: var(--violet-soft); }
    .file-icon.file { color: #59657a; background: #eef1f5; }
    .file-copy strong, .file-copy span { display: block; }
    .file-copy span { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .mono { font-variant-numeric: tabular-nums; font-family: "SFMono-Regular", Consolas, monospace; }
    .muted { color: var(--muted); }
    .micro { color: var(--muted); font-size: 12px; line-height: 18px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
    .status.success { color: var(--green); background: var(--green-soft); }
    .status.pending { color: var(--amber); background: var(--amber-soft); }
    .status.error { color: var(--red); background: var(--red-soft); }
    .status.neutral { color: #5c6778; background: #eef1f5; }
    .status.info { color: var(--primary-strong); background: var(--primary-soft); }
    .status svg { width: 13px; height: 13px; }
    .bulk-bar { min-height: 48px; padding: 7px 12px; display: none; align-items: center; gap: 8px; margin-bottom: 10px; border: 1px solid #b9d0fb; border-radius: 7px; background: var(--primary-soft); }
    .bulk-bar.visible { display: flex; }
    .bulk-bar strong { margin-right: auto; }

    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .gallery-item { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; overflow: hidden; }
    .thumb { aspect-ratio: 16/10; background: #eaf0f7; display: grid; place-items: center; color: #708096; }
    .thumb.paper { background: #edf1f5; padding: 20px; }
    .paper-sheet { width: 72%; height: 90%; background: #fff; border: 1px solid #d4dbe5; padding: 12px 10px; box-shadow: 0 2px 8px rgba(30,45,65,.08); }
    .paper-line { height: 3px; margin-bottom: 8px; background: #d9dee6; }
    .paper-line.short { width: 55%; }
    .gallery-copy { padding: 12px; }
    .gallery-copy strong { display: block; }
    .gallery-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 12px; }

    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(330px, .72fr); gap: 16px; }
    .preview-box { min-height: 470px; display: grid; place-items: center; background: #e9edf3; padding: 34px; border-bottom: 1px solid var(--line); }
    .document-preview { width: min(560px, 82%); min-height: 360px; background: #fff; border: 1px solid #ccd4df; box-shadow: 0 8px 28px rgba(29,42,61,.12); padding: 44px 50px; }
    .document-preview h3 { text-align: center; font-size: 22px; margin: 0 0 32px; }
    .document-preview p { line-height: 28px; color: #3f4856; }
    .document-preview .signature { margin-top: 42px; text-align: right; }
    .media-preview { width: min(620px, 92%); min-height: 350px; border: 1px solid #cbd5e1; border-radius: 7px; background: #f8fafc; display: grid; place-items: center; overflow: hidden; box-shadow: 0 8px 28px rgba(29,42,61,.1); }
    .media-preview-inner { width: 100%; height: 100%; min-height: 350px; display: grid; place-items: center; position: relative; padding: 28px; text-align: center; }
    .media-preview-inner > svg { width: 54px; height: 54px; color: #607087; }
    .media-preview-inner strong, .media-preview-inner span { display: block; }
    .media-preview-inner strong { margin-top: 14px; font-size: 17px; }
    .media-preview-inner span { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .photo-scene { background: #dce7ee; align-content: end; }
    .photo-scene::before { content: ""; position: absolute; inset: 38px 48px 92px; border: 2px solid #91a3b2; background: #edf3f6; }
    .photo-scene::after { content: "外包装破损区域"; position: relative; z-index: 1; padding: 8px 12px; border: 1px solid #c97b73; background: #fff4f2; color: #a33f37; border-radius: 5px; }
    .video-frame { background: #263244; color: #fff; }
    .video-frame span { color: #d6deea; }
    .video-frame .play-button { width: 54px; height: 54px; }
    .chat-preview { background: #eef3f7; align-content: center; gap: 10px; }
    .chat-bubble { max-width: 78%; padding: 11px 14px; border-radius: 7px; background: #fff; border: 1px solid #d5dde6; text-align: left; color: #344052; }
    .chat-bubble.mine { margin-left: auto; background: #dff5cf; border-color: #c4e6af; }
    .proof-list { display: grid; gap: 10px; }
    .proof-item { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid #edf0f4; }
    .proof-item:last-child { border-bottom: 0; }
    .proof-item > svg { color: var(--primary); }
    .proof-item strong, .proof-item span { display: block; }
    .proof-item span { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .detail-tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
    .detail-tab { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 7px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .detail-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .meta-list { display: grid; gap: 0; }
    .meta-row { min-height: 42px; display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 12px; align-items: center; border-bottom: 1px solid #edf0f4; }
    .meta-row:last-child { border-bottom: 0; }
    .meta-row span { color: var(--muted); }
    .meta-row strong { font-weight: 550; overflow-wrap: anywhere; }
    .hash { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
    .notice { display: flex; align-items: flex-start; gap: 9px; padding: 11px 12px; border-radius: 6px; background: var(--primary-soft); color: #35547b; line-height: 20px; }
    .notice.warning { background: var(--amber-soft); color: #7f5718; }
    .notice svg { flex: 0 0 auto; width: 17px; margin-top: 1px; }

    .audio-player { padding: 16px; background: #f8fafc; border-bottom: 1px solid var(--line); }
    .audio-main { display: flex; align-items: center; gap: 12px; }
    .play-button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
    .play-button svg { width: 18px; }
    .audio-track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: #dce3ec; overflow: hidden; }
    .audio-progress { height: 100%; width: 18%; background: var(--primary); transition: width .3s linear; }
    .audio-time { min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .audio-tools { display: flex; gap: 7px; margin-left: 52px; margin-top: 10px; }
    .mini-btn { min-height: 28px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); padding: 4px 9px; color: #4e5b6f; }
    .transcript { max-height: 520px; overflow-y: auto; padding: 16px; }
    .utterance { display: grid; grid-template-columns: 48px 72px minmax(0, 1fr); gap: 9px; padding: 10px 0; border-bottom: 1px solid #edf0f4; line-height: 21px; }
    .utterance:last-child { border-bottom: 0; }
    .speaker { font-weight: 600; }
    .time-link { border: 0; background: transparent; color: var(--primary); padding: 0; text-align: left; font-size: 12px; }
    mark { background: #fff0b8; color: inherit; padding: 0 2px; }
    .summary-fact { padding: 12px 0; border-bottom: 1px solid #edf0f4; }
    .summary-fact:last-child { border-bottom: 0; }
    .summary-fact strong { display: block; margin-bottom: 5px; }
    .citation { margin-top: 7px; color: var(--primary); font-size: 12px; }

    .timeline { padding: 4px 0 4px 7px; }
    .timeline-item { position: relative; padding: 0 0 18px 28px; border-left: 1px solid #dce3ec; }
    .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
    .timeline-dot { position: absolute; left: -7px; top: 1px; width: 13px; height: 13px; border: 3px solid var(--panel); border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px #b9c5d5; }
    .timeline-item.pending .timeline-dot { background: var(--amber); }
    .timeline-item strong, .timeline-item span { display: block; }
    .timeline-item span { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .progress-row { margin-bottom: 15px; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-track { height: 7px; background: #e8edf3; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); }
    .progress-fill.green { background: var(--green); }
    .progress-fill.amber { background: #d99835; }
    .quick-list { display: grid; gap: 2px; }
    .quick-item { min-height: 54px; display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid #edf0f4; background: transparent; text-align: left; padding: 8px 0; }
    .quick-item:last-child { border-bottom: 0; }
    .quick-icon { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; background: var(--panel-soft); color: #5d6b7e; }
    .quick-copy { min-width: 0; flex: 1; }
    .quick-copy strong, .quick-copy span { display: block; }
    .quick-copy span { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quick-item > svg { color: var(--faint); width: 16px; }

    .matter-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .matter-card { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 15px; text-align: left; }
    .matter-card:hover { border-color: #aebbcf; }
    .matter-card h3 { margin: 12px 0 6px; font-size: 15px; }
    .matter-card p { margin: 0; color: var(--muted); line-height: 20px; min-height: 40px; }
    .matter-meta { display: flex; gap: 12px; margin-top: 15px; padding-top: 12px; border-top: 1px solid #edf0f4; color: var(--muted); font-size: 12px; }
    .matter-meta span:last-child { margin-left: auto; }

    .stepper { display: flex; align-items: flex-start; margin: 8px 0 24px; }
    .step { flex: 1; position: relative; display: flex; gap: 9px; align-items: center; color: var(--muted); }
    .step:not(:last-child)::after { content: ""; position: absolute; left: 31px; right: 10px; top: 13px; height: 1px; background: var(--line); }
    .step-circle { position: relative; z-index: 1; width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: #e9edf3; color: #667286; font-size: 12px; }
    .step.done .step-circle { background: var(--green); color: #fff; }
    .step.active { color: var(--text); font-weight: 600; }
    .step.active .step-circle { background: var(--primary); color: #fff; }

    .number-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .number-card { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 16px; }
    .number-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .number-value { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { padding: 4px 7px; border-radius: 5px; background: #eef2f7; color: #5d697a; font-size: 12px; }

    .plan-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .plan-card { padding: 17px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .plan-card.current { border-color: #8fb2f6; box-shadow: inset 3px 0 0 var(--primary); }
    .plan-card h3 { margin: 0; font-size: 16px; }
    .plan-card .price { margin: 14px 0; font-size: 24px; font-weight: 650; }
    .benefit { display: flex; justify-content: space-between; min-height: 35px; align-items: center; border-bottom: 1px solid #edf0f4; }

  function validateCatalogVersion(value) {

    function finishLogin(login){
      state.phoneError='';
      const previousWorkspaceId=state.currentWorkspaceId,previousAccountId=state.accountId;
      if(previousAccountId&&previousAccountId!==login.account.id)resetScopedUi();
      bindAuthenticatedAccount(login);
      state.currentWorkspaceId=null;state.workspace='personal';state.enterpriseRole='personal';state.enterpriseName='';
      if(state.loginIntent==='invite'){state.authView='invite';render();return;}
      if(state.firstLogin){state.authView='privacy';render();return;}
      if(state.returnRoute){const target=state.returnRoute,resume=login.workspaces.find(item=>item.id===previousWorkspaceId);state.returnRoute=null;if(resume){enterWorkspace(resume.id,target);return;}}
      state.authView='workspace';render();

    function enterWorkspace(workspaceId,route='overview'){
      const workspace=accountWorkspaces().find(item=>item.id===workspaceId);if(!workspace){state.session='signedOut';state.authView='workspace';render();return false;}
      if(state.currentWorkspaceId&&state.currentWorkspaceId!==workspace.id)resetScopedUi();
      state.session='signedIn';state.currentWorkspaceId=workspace.id;state.workspace=workspace.type==='ORGANIZATION'?'enterprise':'personal';state.enterpriseRole=workspace.type==='ORGANIZATION'?(roleKeys[workspace.role]||'member'):'personal';state.enterpriseName=workspace.name;state.route=route;state.selectedEvidence=[];state.authScenario='normal';state.loginIntent='standard';state.firstLogin=false;state.sessionExpired=false;

      for(const key of ['matterEvidence','matterDetailEvidence','matterEvidenceDraft'])state[key]=state[key].filter(id=>visibleIds.has(id));
      render();return true;
    }

    function shareContentLabel(value){return {recording:'仅录音',transcript:'录音 + 逐字稿',summary:'录音 + 逐字稿 + AI 摘要'}[value];}
    function shareVerifyLabel(value){return {code:'提取码',none:'免验证',sms:'指定手机验证',member:'企业成员授权'}[value];}
    function shareLocalDateTime(at){const date=new Date(at);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);}
    function shareVisitCounts(share){const parts=share.visits.split('/').map(value=>value.trim());return {used:Number(parts[0]),limit:parts[1]==='不限'?Infinity:Number(parts[1])};}
    function shareLifecycle(share){
      if(!share)return 'invalid';
      if(share.status==='已撤销'||share.accessState==='revoked')return 'revoked';
      if(share.status==='已过期'||share.accessState==='expired'||(share.expiresAt&&Date.now()>=share.expiresAt))return 'expired';
      const visits=shareVisitCounts(share);
      if(visits.used>=visits.limit)return 'exhausted';
      return '';
    }
    function shareBlockedState(share){const lifecycle=shareLifecycle(share);return lifecycle==='exhausted'&&state.sharePlaybackId===share?.id&&state.shareAccessState==='playback'?'':lifecycle;}
    function admitSharePlayback(share){
      if(shareBlockedState(share))return false;
      if(state.sharePlaybackId!==share.id||state.shareAccessState!=='playback'){
        const visits=shareVisitCounts(share);
        share.visits=(visits.used+1)+' / '+(Number.isFinite(visits.limit)?visits.limit:'不限');
        share.latest='刚刚';
      }
      state.sharePlaybackId=share.id;state.shareAccessState='playback';state.shareCodeError='';state.audioSeconds=0;
      return true;
    }

    function shareAccessPage(){

      const shellStart='<div class="public-share-page"><header class="public-share-top"><div class="public-share-brand"><img src="../logo/onecall-logo-b-icon.svg" alt="一通话"><div><strong>一通话 · 录音分享</strong><span>受控播放页面</span></div></div><span class="status info">'+icon('shield-check')+accessLabel+'</span></header><main class="public-share-main"><section class="public-share-card">';
      const shellEnd='</section><p class="copy-watermark">本页面不展示原始存储地址 · 分享编号 '+shareId+'</p></main></div>';
      let blocked=shareBlockedState(share);
      if(state.shareAccessState==='locked')blocked='locked';
      if(blocked){
        stopAudio();state.audioPlaying=false;
        const info={invalid:['分享链接无效','没有找到对应的分享记录，请向分享方确认链接是否完整。','unlink'],expired:['分享已过期','该录音分享已超过有效期，无法继续验证或播放。','clock-3'],revoked:['分享已被撤销','分享方已停止本次访问授权，当前链接不能继续使用。','ban'],exhausted:['访问次数已用完','该分享已达到成功访问次数上限，请联系分享方重新授权。','eye-off'],locked:['验证暂时锁定','提取码连续错误次数过多，请 15 分钟后再试或联系分享方。','shield-alert']}[blocked];
        return shellStart+'<div class="public-share-state"><div><span class="success-icon" style="background:var(--amber-soft);color:var(--amber)">'+icon(info[2])+'</span><h2>'+info[0]+'</h2><p>'+info[1]+'</p><span class="micro">'+shareId+' · 已检查当前分享状态</span></div></div>'+shellEnd;
      }
      if(share.verify==='免验证'&&state.shareAccessState!=='playback')admitSharePlayback(share);
      const sender=share.sender||share.owner||'分享方';
      const senderContext='<div class="public-share-sender"><span class="public-share-sender-avatar">'+sender.slice(0,1)+'</span><div><strong>'+sender+'分享给你一段通话录音</strong><span>通过一通话受控分享</span></div></div>';
      if(state.shareAccessState==='playback'){
        const visits=shareVisitCounts(share),scope=share.scope||'录音 + 逐字稿 + AI 摘要';
        const remaining=share.expiresAt?Math.max(0,Math.ceil((share.expiresAt-Date.now())/3600000))+' 小时':share.expires;
        const transcript=scope==='仅录音'?'':'<div class="transcript" style="max-height:none">'+utterance('我','00:06','王经理，我们确认一下这批设备的付款和损坏处理。')+utterance('对方','00:14','设备款总额是十二万八千元，但损坏的两台要先换货。')+utterance('对方','00:38','我们承诺十月二十五日前把两台替换设备送到。')+'</div>';
        const identityNotice=share.verify==='免验证'?'免验证链接不会核验访问者身份；任何持有链接的人都可以在授权范围内收听。':'提取码只验证持有码者，不代表平台已经核验当前访问人的真实身份。';
        return shellStart+'<div class="public-share-head">'+senderContext+'<h1>录音播放副本</h1><p>'+share.recording+'</p><div class="public-share-meta"><span>'+icon('clock-3')+' 剩余有效期 '+remaining+'</span><span>'+icon('eye')+' 第 '+visits.used+' / '+(Number.isFinite(visits.limit)?visits.limit:'不限')+' 次成功访问</span><span>'+icon('file-key-2')+' '+share.id+'</span></div></div><div class="public-share-body"><div class="notice">'+icon('info')+'<span>这是分享方授权的播放副本，不是原始录音下载地址。播放、定位和访问结果将写入审计。</span></div><div class="audio-player" style="margin-top:16px;border:1px solid var(--line);border-radius:7px"><div class="audio-main"><button class="play-button" data-action="toggle-audio" aria-label="'+(state.audioPlaying?'暂停':'播放')+'">'+icon(state.audioPlaying?'pause':'play')+'</button><div class="audio-track"><div class="audio-progress" id="audio-progress" style="width:'+(state.audioSeconds/522*100)+'%"></div></div><div class="audio-time"><span id="audio-current">'+formatTime(state.audioSeconds)+'</span> / 08:42</div></div><div class="audio-tools"><button class="mini-btn">1.0×</button><span class="micro">'+(share.download?'允许下载播放副本':'下载未授权')+'</span></div></div>'+transcript+'<div class="notice warning" style="margin-top:14px">'+icon('shield-alert')+'<span>'+identityNotice+'</span></div></div>'+shellEnd;
      }
      if(share.verify!=='提取码')return shellStart+'<div class="public-share-state"><div><span class="success-icon" style="background:var(--amber-soft);color:var(--amber)">'+icon('shield-check')+'</span><h2>等待'+share.verify+'</h2><p>该验证流程不在当前静态接收页中模拟，请按分享方提供的方式完成验证。</p><span class="micro">'+share.id+'</span></div></div>'+shellEnd;
      const visits=shareVisitCounts(share);
      return shellStart+'<div class="public-share-head">'+senderContext+'<h1>查看分享的通话录音</h1><p>'+share.recording+'</p><div class="public-share-meta"><span>'+icon('clock-3')+' 有效至 '+share.expires+'</span><span>'+icon('eye')+' 最多成功访问 '+(Number.isFinite(visits.limit)?visits.limit:'不限')+' 次</span></div></div><div class="public-share-body"><div class="public-share-form"><div class="field"><label for="share-code-input">提取码</label><input id="share-code-input" class="input" value="'+state.shareCodeInput+'" maxlength="8" autocomplete="one-time-code" placeholder="请输入分享方提供的提取码"></div>'+(state.shareCodeError?'<div class="auth-error" role="alert">'+icon('circle-alert')+'<span>'+state.shareCodeError+'</span></div>':'')+button('验证并查看','unlock-keyhole','data-action="share-verify"','primary')+'<div class="notice" style="margin-top:16px;text-align:left">'+icon('shield-check')+'<span>无需注册或登录一通话账户。提取码仅用于本次访问校验，不等于实名认证或身份核验。</span></div></div></div>'+shellEnd;
    }

    function exportJobStatus(job){if(job.status==='可下载'&&Date.parse(job.expiresAt.replace(' ','T'))<Date.now())return '已失效';return job.status;}

    function nextExportJobId(){
      const prefix='EXP-261019-';const used=new Set(exportJobs.map(item=>item.id));
      const max=exportJobs.reduce((current,item)=>{if(!item.id.startsWith(prefix))return current;const suffix=item.id.slice(prefix.length);return /^\d+$/.test(suffix)?Math.max(current,Number(suffix)):current;},0);
      let sequence=max+1;let candidate=prefix+String(sequence).padStart(3,'0');
      while(used.has(candidate)){sequence+=1;candidate=prefix+String(sequence).padStart(3,'0');}
      return candidate;
    }

        if(code===(share.code||'8K3P')){admitSharePlayback(share);render();return;}
        state.shareCodeAttempts+=1;
        if(state.shareCodeAttempts>=3){state.shareAccessState='locked';state.shareCodeError='';render();return;}
        state.shareCodeError='提取码不正确，还可尝试 '+(3-state.shareCodeAttempts)+' 次。';render();return;
      }
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='auth-review-select'){
        const scenario=event.target.value;if(['returning','conflict','recycled'].includes(scenario)){setBusinessScenario(scenario);return;}state.authScenario=scenario;state.authView='login';state.loginMethod='wechat';state.qrState='ready';state.loginIntent='standard';state.firstLogin=false;state.sessionExpired=false;state.returnRoute=null;state.phoneError='';
        if(scenario==='qr-expired')state.qrState='expired';
        if(scenario==='qr-cancelled')state.qrState='cancelled';
        if(scenario==='phone-locked'){state.loginMethod='phone';state.phoneError='locked';}
        if(scenario==='privacy'){state.authView='privacy';state.firstLogin=true;}
        if(scenario==='invite'){state.loginIntent='invite';state.authView='login';}
        if(scenario==='session-expired'){state.sessionExpired=true;state.returnRoute='evidenceDetail';state.activeEvidence='OC-E1041';}
        if(['account-disabled','member-removed','seat-unassigned'].includes(scenario))state.authView='status';
        render();return;
      }
      if(event.target.id==='privacy-agree'){state.privacyAgreed=event.target.checked;const next=document.getElementById('privacy-continue');if(next)next.disabled=!state.privacyAgreed;return;}
      if(event.target.id==='workspace-select'){enterWorkspace(event.target.value);}
      if(event.target.matches('[data-evidence-check]')){const id=event.target.dataset.evidenceCheck;if(event.target.checked&&!state.selectedEvidence.includes(id))state.selectedEvidence.push(id);if(!event.target.checked)state.selectedEvidence=state.selectedEvidence.filter(x=>x!==id);render();}
      if(event.target.matches('[data-matter-evidence]')){const id=event.target.dataset.matterEvidence;if(event.target.checked&&!state.matterEvidence.includes(id))state.matterEvidence.push(id);if(!event.target.checked)state.matterEvidence=state.matterEvidence.filter(x=>x!==id);render();}
      if(event.target.matches('[data-matter-manage-evidence]')){const id=event.target.dataset.matterManageEvidence;if(event.target.checked&&!state.matterEvidenceDraft.includes(id))state.matterEvidenceDraft.push(id);if(!event.target.checked)state.matterEvidenceDraft=state.matterEvidenceDraft.filter(x=>x!==id);render();}
      if(event.target.id==='matter-owner-edit'){state.matterOwnerDraft=event.target.value;return;}
      if(event.target.id==='import-file'){state.importFiles=Array.from(event.target.files||[]).map(file=>file.name);render();}
      if(event.target.id==='supplement-file'){state.supplementFiles=Array.from(event.target.files||[]).map(file=>file.name);render();}
      if(event.target.id==='checkout-agree'){state.checkoutAgreed=event.target.checked;render();}
      if(event.target.id==='share-download'){state.shareDownload=event.target.checked;render();}
      if(event.target.id==='share-expire-at')state.shareCustomExpiry=event.target.value;
      if(event.target.id==='number-add-agree'){state.numberAddAgreed=event.target.checked;render();}
      if(event.target.id==='enterprise-order-agree'){state.enterpriseOrderAgreed=event.target.checked;render();}
      if(event.target.id==='member-edit-agree'){state.memberEditAgreed=event.target.checked;render();}
      if(event.target.id==='addon-agree'){state.addonAgreed=event.target.checked;render();}
      if(event.target.id==='export-sensitive-agree'){state.exportSensitiveAgreed=event.target.checked;render();}
      if(event.target.id==='export-purpose')state.exportPurpose=event.target.value;
      if(event.target.id==='export-range')state.exportRange=event.target.value;
    });
    document.addEventListener('input',event=>{
      if(event.target.id==='login-phone')state.loginPhone=event.target.value;
      if(event.target.id==='login-code')state.loginCode=event.target.value;
      if(event.target.id==='number-mobile'||event.target.id==='fixed-number')state.numberAddPhone=event.target.value;
      if(event.target.id==='number-code')state.numberAddCode=event.target.value;
      if(event.target.id==='share-expire-at')state.shareCustomExpiry=event.target.value;
      if(event.target.id==='export-code'){state.exportCode=event.target.value;state.exportError='';}
      if(event.target.id==='evidence-search'){const q=event.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=q&&!row.innerText.toLowerCase().includes(q));}
      if(event.target.id==='call-search'){const q=event.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=q&&!row.innerText.toLowerCase().includes(q));}
      if(event.target.id==='share-search'){const q=event.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=q&&!row.innerText.toLowerCase().includes(q));}
      if(event.target.id==='matter-search'){const q=event.target.value.trim().toLowerCase();document.querySelectorAll('.matter-card').forEach(card=>card.hidden=q&&!card.innerText.toLowerCase().includes(q));}
      if(event.target.id==='order-search'){const q=event.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=q&&!row.innerText.toLowerCase().includes(q));}
      if(event.target.id==='share-code-input')state.shareCodeInput=event.target.value;
    });
    function startAudio(){stopAudio();state.audioTimer=setInterval(()=>{if(!state.audioPlaying)return;state.audioSeconds=Math.min(522,state.audioSeconds+1);const progress=document.getElementById('audio-progress');const current=document.getElementById('audio-current');if(progress)progress.style.width=(state.audioSeconds/522*100)+'%';if(current)current.textContent=formatTime(state.audioSeconds);if(state.audioSeconds>=522){state.audioPlaying=false;stopAudio();render();}},1000);}
    function stopAudio(){if(state.audioTimer){clearInterval(state.audioTimer);state.audioTimer=null;}}
    const initialShareId=new URLSearchParams(window.location.search).get('share');
    if(initialShareId){state.session='signedOut';state.route='share-access';state.activeShare=initialShareId;state.shareAccessState='entry';state.sharePlaybackId='';state.audioPlaying=false;state.audioSeconds=0;}
    window.__onecallWeb={businessSnapshot(){const r=B.snapshot(business);if(!r.ok)throw Error(r.code);return r.value;},accountContext(){return cloneBusiness({accountId:state.accountId,workspace:selectedWorkspace(),identities:accountIdentities(),workspaces:accountWorkspaces()});},recipientDemoUrl,recipientDemoShareId:RECIPIENT_DEMO_SHARE_ID,expireSession(route){return expireSession(route);},loadReviewSnapshot(candidate){const r=B.loadReviewSnapshot(business,candidate);if(r.ok){const linked=business.subjects.find(item=>item.accountId===businessReview.accountId&&item.source==='IVR')||business.subjects.find(item=>item.accountId===businessReview.accountId);businessReview.subjectId=linked?.id||null;businessReview.verified=false;businessReview.claimCode='';businessReview.claimRequestId=null;if(!business.orders.some(item=>item.id===businessReview.orderId))businessReview.orderId=null;render();}return cloneBusiness(r);},setReviewScenario:setBusinessScenario,setClaimRequestId(requestId){businessReview.claimRequestId=requestId;return {ok:true};},applyActivationStatus(input){const r=B.setActivationStatus(business,input,new Date());if(r.ok)render();return cloneBusiness(r);},navigate(route){if(!Object.hasOwn(pageTitles,route))return {ok:false,code:'NOT_FOUND'};go(route);return {ok:true,route};},currentRoute(){return state.route;}};
    window.addEventListener('beforeunload',stopAudio);
    render();
  </script>
</body>
